<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のりもの あそび</title>
<meta name="theme-color" content="#bfe8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="のりもの あそび">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/menu-180.png">
<link rel="icon" href="icons/menu-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;
    background:linear-gradient(180deg,#bfe8ff 0%,#e3f5ff 45%,#fff4cf 100%);
    color:#3a3350;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .wrap{
    height:100%;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5vh;
  }
  h1{
    font-size:clamp(34px,10vw,56px);font-weight:800;color:#ff6b4a;
    text-shadow:0 4px 0 #fff;text-align:center;
  }
  .list{display:flex;flex-direction:column;gap:18px;width:min(100%,440px)}
  .tile{
    display:flex;align-items:center;gap:18px;
    min-height:112px;padding:16px 24px;
    border-radius:32px;border:5px solid var(--line);
    background:#fff;text-decoration:none;
    box-shadow:0 8px 0 rgba(0,0,0,.08),0 12px 24px rgba(0,70,130,.12);
  }
  .tile:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .tile:focus-visible{outline:4px solid #2f6fd0;outline-offset:3px}
  .emoji{font-size:clamp(46px,14vw,70px);line-height:1;flex:none}
  .label{
    font-size:clamp(28px,8.6vw,44px);font-weight:800;color:var(--ink);
    white-space:nowrap;
  }
  /* 長い名前（ミニカーロード など）は 少し小さくして 1行に収める */
  .label.long{font-size:clamp(21px,7vw,40px)}
  @media (max-height:640px){
    .tile{min-height:92px;padding:10px 20px}
    .wrap{gap:2.5vh}
  }
  @media (min-width:760px){
    .list{flex-direction:row;width:min(100%,960px)}
    .tile{flex:1;flex-direction:column;justify-content:center;min-height:240px;text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>なにで あそぶ？</h1>
  <nav class="list" id="list" aria-label="ゲーム"></nav>
</div>

<script>
/* ============================================================
   ゲームを ふやすとき は、この GAMES に 1つ 足すだけ。
     label : 画面に出す名前（ひらがな・カタカナ）
     emoji : 名前の左に出す絵
     url   : ゲームの場所（games/○○/index.html）
     color : わくの色 と 文字の色
     say   : 読み上げ用の名前（スクリーンリーダー向け）
   ============================================================ */
const GAMES = [
  { label:'のりもの',       emoji:'🚄', url:'atekko.html',                 color:['#ffb36b','#f06a1c'], say:'のりもの あてっこ' },
  { label:'なかまわけ',     emoji:'🧩', url:'games/nakamawake/index.html', color:['#9cc8f2','#2f6fd0'], say:'なかまわけ' },
  { label:'ミニカーロード', emoji:'🚗', url:'games/minicar/index.html',   color:['#8fd6a6','#1f8a4c'], say:'ミニカーロード' }
];

document.getElementById('list').innerHTML = GAMES.map((g) => `
  <a class="tile" href="${g.url}" aria-label="${g.say}で あそぶ" style="--line:${g.color[0]};--ink:${g.color[1]}">
    <span class="emoji" aria-hidden="true">${g.emoji}</span>
    <span class="label${g.label.length >= 6 ? ' long' : ''}">${g.label}</span>
  </a>`).join('');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
