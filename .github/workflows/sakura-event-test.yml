name: sakura-event tests

on:
  push:
    paths:
      - 'sakura-event/**'
      - '.github/workflows/sakura-event-test.yml'
  pull_request:
    paths:
      - 'sakura-event/**'
      - '.github/workflows/sakura-event-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakura-event
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
