<!doctype html><html lang="ja"><meta charset="utf-8"><title>運転音の確認</title><style>body{font:18px system-ui;padding:25px;background:#f7f0df;color:#294b55}button{font:inherit;padding:18px;margin:6px;border:0;border-radius:15px;background:#d5e6d8}pre{white-space:pre-wrap}</style><h1>自作の運転音</h1><p>音を鳴らし、最終出力の波形を測定します。</p><button id="run">音を確かめる</button><pre id="results">開始待ち</pre><script type="module">
import{CabAudio}from'../games/driving/shared/audio.js';const audio=new CabAudio(),results=document.querySelector('#results');const wait=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#run').onclick=async()=>{audio.unlock();await wait(70);const c=audio.context;if(!c){results.textContent='FAIL AudioContext unavailable';return;}const analyser=c.createAnalyser();analyser.fftSize=2048;audio.master.connect(analyser);const data=new Float32Array(analyser.fftSize),lines=[];for(const [name,play]of [['警笛',()=>audio.horn()],['ドア',()=>audio.door()],['接近',()=>audio.approach()],['到着',()=>audio.arrival(true)],['完了',()=>audio.complete()],['走行・加速',()=>audio.update(14,1,50,true)],['ブレーキ',()=>audio.update(10,-1,80,true)]]){play();await wait(100);analyser.getFloatTimeDomainData(data);const peak=Math.max(...data.map(Math.abs));lines.push((peak>.0001?'PASS':'FAIL')+' '+name+' peak='+peak.toFixed(5));results.textContent=lines.join('\n');await wait(1000);}audio.quiet();audio.setMuted(true);await wait(350);analyser.getFloatTimeDomainData(data);lines.push(Math.max(...data.map(Math.abs))<.0001?'PASS ミュート':'FAIL ミュート');lines.push('AudioContext: '+c.state);results.textContent=lines.join('\n');};
</script></html>
