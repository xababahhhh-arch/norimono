<!doctype html><html lang="ja"><meta charset="utf-8"><title>新作ゲーム 画面レビュー</title><style>body{margin:12px;background:#ece8df;font:16px system-ui;color:#244758}h1{font-size:21px}#grid{display:flex;gap:12px;flex-wrap:wrap}iframe{width:320px;height:568px;border:1px solid #c7cfc9;border-radius:16px;background:#f5f0e5}button{font:inherit;padding:14px;border:0;background:#fff;border-radius:10px}</style><h1>No.26〜30｜タップで動く のりものあそび</h1><button id="start">5本の画面を確認</button><div id="grid"></div><script>
for(const kind of ['garbage','dig','lock','flight','busride']){const f=document.createElement('iframe');f.src='../games/play/'+kind+'.html';f.title=kind;document.querySelector('#grid').append(f);}document.querySelector('#start').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentDocument.querySelector('#skip')?.click());
</script></html>
