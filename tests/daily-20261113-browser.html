<!doctype html><html lang="ja"><meta charset="utf-8"><title>11/13 10本 自動検証</title><button id="run">10本を検証</button><pre id="out"></pre><script>
const ids=['seat-bus','dock-turn','paint-train','hide-taxi','beat-heli','lift-balloon','cargo-order','spot-crossing','windmill-truck','train-lever'];
const sleep=t=>new Promise(r=>setTimeout(r,t));async function until(fn,limit=4500){const start=Date.now();while(Date.now()-start<limit){if(fn())return;await sleep(40)}throw Error('timeout')}
const sequences={'paint-train':[['🔴','🟡'],['🔵','🟡'],['🔴','🔵']],'cargo-order':[['📦','🧸'],['⚽','📦','🧸'],['🧸','⚽','🪵','📦']]};
document.querySelector('#run').onclick=async()=>{let failed=0,passed=0;const out=document.querySelector('#out');for(const width of [320,390,768])for(const id of ids){const frame=document.createElement('iframe');frame.style.cssText='position:absolute;left:-10000px;top:0;width:'+width+'px;height:760px';frame.src='../games/play/daily-20261113.html?id='+id;document.body.append(frame);try{await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject});const w=frame.contentWindow,d=w.document;w.speechSynthesis.cancel=()=>{};w.speechSynthesis.speak=u=>setTimeout(()=>u.onend?.(),0);
const click=async value=>{await until(()=>[...d.querySelectorAll('.choice')].some(b=>b.textContent===value&&!b.disabled));[...d.querySelectorAll('.choice')].find(b=>b.textContent===value).click();await sleep(160)};
await click('▶️ はじめる');
for(let round=0;round<3;round++){await until(()=>d.querySelector('#progress')?.textContent.startsWith((round+1)+' / 3'));
const actions=sequences[id]?.[round]||({'seat-bus':Array(round+2).fill('のせる'),'dock-turn':[['⬆️'],['➡️'],['⬅️']][round],'hide-taxi':[['🐱'],['🐶'],['🐰']][round],'beat-heli':Array(round+2).fill('たたく'),'lift-balloon':Array(round+2).fill('あげる'),'spot-crossing':[['🚦'],['🚗'],['🚆']][round],'windmill-truck':Array(round+2).fill('ふく'),'train-lever':Array(round+2).fill('すすめる')})[id];
if(!actions)throw Error('unknown actions '+id);for(const action of actions)await click(action);
await until(()=>round===2?d.querySelector('#stage')?.textContent.includes('🎉'):d.querySelector('#progress')?.textContent.startsWith((round+2)+' / 3'))}
await click('🔁 もういちど');await until(()=>d.querySelector('#progress')?.textContent==='あそびかた');if(d.documentElement.scrollWidth>width+2)throw Error('horizontal overflow');passed++;out.textContent+='PASS '+id+' '+width+'\n'}catch(e){failed++;out.textContent+='FAIL '+id+' '+width+': '+e.message+'\n'}finally{frame.remove()}}document.body.dataset.result=failed?'fail':'pass';out.textContent+='TOTAL '+passed+' pass, '+failed+' fail'};
</script>
