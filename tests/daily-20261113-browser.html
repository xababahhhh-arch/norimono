<!doctype html><html lang="ja"><meta charset="utf-8"><title>11/13 10本 自動検証</title><button id="run">10本を検証</button><pre id="out"></pre><script>
const ids=['seat-bus','dock-turn','paint-train','hide-taxi','beat-heli','lift-balloon','cargo-order','spot-crossing','windmill-truck','train-lever'];
document.querySelector('#run').onclick=async()=>{let failed=0,passed=0;const out=document.querySelector('#out');const sizes=[320,390,768];for(const width of sizes)for(const id of ids){const frame=document.createElement('iframe');frame.style.cssText='position:absolute;left:-10000px;top:0;width:'+width+'px;height:760px';frame.src='../games/play/daily-20261113.html?id='+id;document.body.append(frame);try{await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject});const w=frame.contentWindow,d=w.document;w.speechSynthesis.cancel=()=>{};w.speechSynthesis.speak=u=>setTimeout(()=>u.onend?.(),0);const press=async value=>{const b=[...d.querySelectorAll('.choice')].find(b=>b.textContent.includes(value));if(!b)throw Error('button missing '+value);b.click();await new Promise(r=>setTimeout(r,110))};await press('はじめる');for(let round=0;round<3;round++){for(let tick=0;tick<12;tick++){const txt=d.querySelector('#progress')?.textContent||'';if(txt.includes('3 / 3')&&round===2&&d.querySelector('#stage').textContent.includes('🎉'))break;const buttons=[...d.querySelectorAll('.choice')];const correct=({ 'seat-bus':'のせる','dock-turn':['⬆️','➡️','⬅️'][round],'paint-train':['🔴','🔵','🔴'][round],'hide-taxi':['🐱','🐶','🐰'][round],'beat-heli':'たたく','lift-balloon':'あげる','cargo-order':'📦','spot-crossing':['🚦','🚗','🚆'][round],'windmill-truck':'ふく','train-lever':'すすめる'})[id];const b=buttons.find(b=>b.textContent===correct)||buttons[0];if(!b)throw Error('no choices');b.click();await new Promise(r=>setTimeout(r,100));if(d.querySelector('#progress')?.textContent.startsWith((round+2)+' / 3'))break} }await new Promise(r=>setTimeout(r,100));if(d.documentElement.scrollWidth>width+2)throw Error('horizontal overflow');passed++;out.textContent+='PASS '+id+' '+width+'\n'}catch(e){failed++;out.textContent+='FAIL '+id+' '+width+': '+e.message+'\n'}finally{frame.remove()}}document.body.dataset.result=failed?'fail':'pass';out.textContent+='TOTAL '+passed+' pass, '+failed+' fail'};
</script>
