<!doctype html><meta charset="utf-8"><title>入口・キャッシュ検証</title><style>iframe{width:320px;height:568px;border:1px solid #ccc}pre{white-space:pre-wrap}</style><h1>320×568 縦画面</h1><iframe src="../index.html" title="縦画面"></iframe><pre id="result">確認中</pre><script type="module">
const out=document.querySelector('#result');try{const sw=await(await fetch('../sw.js')).text();const paths=JSON.parse('['+sw.match(/const CORE = \[(.*?)\];/s)[1].replace(/'/g,'"')+']');for(const p of paths){const r=await fetch(new URL('../'+p,location.href));if(!r.ok)throw Error(p+': '+r.status)}out.textContent='PASS キャッシュ対象 '+paths.length+' 件が200。';const f=document.querySelector('iframe');f.addEventListener('load',()=>{const d=f.contentDocument;out.textContent+='\n'+f.contentWindow.location.pathname+': '+(d.documentElement.scrollWidth<=320?'横はみ出しなし':'FAIL 横はみ出し');});}catch(e){out.textContent='FAIL '+e.message}
</script>
