<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材と発音の確認</title><script src="../shared/vehicles.js"></script><script src="../shared/pronunciation.js"></script><script src="../shared/voice.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#244758;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fffcf3;border-radius:22px;padding:16px}.card svg{width:100%;height:130px}.card h2{margin:5px 0;font-size:20px}.buttons{display:flex;flex-wrap:wrap;gap:7px}button{padding:12px;border:0;border-radius:12px;background:#dce9df;color:#244758;font:inherit;min-height:48px;touch-action:manipulation}button.active{background:#edb276}#status{position:sticky;top:0;padding:10px;background:#f5f0e5;font-weight:700}.example{font-size:14px;color:#647c83;min-height:24px}.notes{padding:16px;background:#fff6d8;border-radius:16px}a{color:#316b83}textarea{width:100%;min-height:60px;font:inherit;margin:7px 0;border:1px solid #bdcbbf;border-radius:8px;padding:8px}</style></head><body><main><h1>素材と発音の確認</h1><p class="notes">保護者・制作確認用です。端末の読み上げを使用しています。読み方・アクセントを実際に聞き、「要修正」に具体的な読みを記録してください。固定音声の収録と実機の発音確認が終わるまで、販売品質の検証完了にはしません。</p><div id="status" aria-live="polite">名前・「は」・「へ」の読みを確認できます。</div><div id="gallery"></div><p><button id="export">確認メモを保存</button> <a href="../index.html">ゲーム一覧へ</a></p></main><script>
const gallery=document.querySelector('#gallery'),status=document.querySelector('#status');let notes={};try{notes=JSON.parse(localStorage.getItem('nori-pronunciation-review')||'{}')}catch{}
for(const v of NoriVehicles.list()){
 const card=document.createElement('section');card.className='card';card.innerHTML=v.svg+'<h2>'+v.name+'</h2><div class="example"></div><div class="buttons"></div><textarea aria-label="'+v.name+'の発音メモ" placeholder="例：アクセントが違う／語尾が切れる"></textarea>';
 const sentences=[v.say,v.say+'はどれかな？',v.say+'を見つけよう。'];if(v.id==='train')sentences.push('電車は車両基地へ帰るよ。');if(v.id==='ambulance')sentences.push('救急車は病院へ帰るよ。');
 sentences.forEach((text,i)=>{const b=document.createElement('button');b.textContent=['名前を聞く','「は」を聞く','文で聞く','「へ」を聞く'][i]||'聞く';b.onclick=async()=>{card.querySelector('.example').textContent=text;status.textContent='読み上げ中：'+text;const r=await NoriVoice.speak(text);if(r.status!=='cancelled')status.textContent=r.status==='ended'?'読み・アクセントを確認してメモしてください。':'音声を再生できませんでした。日本語音声と端末の音量を確認してください。';};card.querySelector('.buttons').append(b);});
 const area=card.querySelector('textarea');area.value=notes[v.id]||'';area.oninput=()=>{notes[v.id]=area.value;try{localStorage.setItem('nori-pronunciation-review',JSON.stringify(notes))}catch{}};gallery.append(card);
}
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({checkedAt:new Date().toISOString(),device:navigator.userAgent,notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pronunciation-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></body></html>
