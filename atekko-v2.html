<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#bfe8ff"><title>のりもの あてっこ V2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#bfe8ff,#fff5d9);color:#17324a;user-select:none;-webkit-user-select:none}.screen{position:fixed;inset:0;display:none;padding:calc(env(safe-area-inset-top) + 54px) 12px calc(env(safe-area-inset-bottom) + 12px)}.screen.on{display:flex;flex-direction:column;align-items:center}.title{font-size:clamp(34px,10vw,54px);font-weight:1000;line-height:1.05;text-align:center;margin-top:5vh}.sub{font-size:17px;font-weight:900;margin-top:12px}.parade{width:min(94vw,440px);display:flex;gap:8px;align-items:center;justify-content:center;margin:auto 0 18px}.mini{width:31%;filter:drop-shadow(0 5px 3px #0002)}.play{width:112px;height:112px;border:0;border-radius:50%;background:#ff7b55;box-shadow:0 9px 0 #c84f32;color:#fff;font-size:54px;touch-action:manipulation}.play:active{transform:translateY(6px);box-shadow:0 3px 0 #c84f32}.playlabel{font-size:22px;font-weight:1000;margin:10px 0 4vh}.top{width:min(96vw,480px);display:flex;justify-content:space-between;align-items:center}.progress{font-size:17px;font-weight:1000}.repeat{border:0;border-radius:50%;width:48px;height:48px;background:#fff9;font-size:24px}.question{font-size:clamp(25px,7vw,36px);font-weight:1000;text-align:center;margin:4px 0 10px}.choices{flex:1;min-height:0;width:min(96vw,480px);display:grid;grid-template-columns:1fr;gap:9px}.choice{position:relative;border:4px solid #fff;border-radius:24px;background:#fffbe9;box-shadow:0 6px 0 #66809933;min-height:0;padding:2px 8px;overflow:hidden;touch-action:manipulation}.choice svg{width:100%;height:100%;max-height:150px}.choice:active{transform:translateY(4px)}.choice.good{background:#c9f2d1;animation:pop .3s}.choice.bad{background:#ffe1e1;animation:shake .28s}.status{height:30px;font-size:20px;font-weight:1000;text-align:center}.endicon{font-size:76px;margin-top:auto}.endtext{font-size:34px;font-weight:1000;text-align:center}.again{border:0;border-radius:24px;background:#59ba7c;color:#fff;font:1000 20px inherit;padding:16px 28px;margin:28px 0 auto}.star{position:fixed;pointer-events:none;font-size:30px;z-index:30;animation:fly .8s forwards}@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(180deg);opacity:0}}@media(max-height:720px){.question{font-size:24px;margin:0 0 5px}.choices{gap:5px}.choice{border-radius:18px}.choice svg{max-height:118px}.top{height:44px}.repeat{width:42px;height:42px}.status{height:24px;font-size:17px}}</style></head><body><section id="start" class="screen on"><div class="title">のりもの<br>あてっこ <small style="font-size:.42em">V2</small></div><div class="sub">いろんな のりものを みつけよう！</div><div class="parade" id="parade"></div><button class="play" id="play" aria-label="あそぶ">▶</button><div class="playlabel">あそぶ</div></section><section id="game" class="screen"><div class="top"><div class="progress" id="progress"></div><button class="repeat" id="repeat" aria-label="もういちどきく">🔊</button></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="status" id="status"></div></section><section id="end" class="screen"><div class="endicon">⭐</div><div class="endtext">すごい！<br>ぜんぶ できたね！</div><button class="again" id="again">もういっかい</button></section><script>(()=>{'use strict';const road='<rect x="0" y="138" width="320" height="6" rx="3" fill="#aeb5bd"/>';const wh=(x,y,r=16)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#30343a"/><circle cx="${x}" cy="${y}" r="${r*.43}" fill="#cbd1d8"/>`;const box=x=>`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">${x}</svg>`;const V=[{n:'しんかんせん',s:'しんかんせん',c:'#168c72',svg:box(`${road}<path d="M12 122V62h150c58 0 94 18 140 52 9 7 5 14-7 14H20c-5 0-8-2-8-6z" fill="#f7f8f8" stroke="#466" stroke-width="2"/><path d="M12 62h155c45 0 76 12 106 34H12z" fill="#27a88a"/><path d="M12 96h265" stroke="#f06fa5" stroke-width="5"/><g fill="#21364d">${[28,52,76,100,124].map(x=>`<rect x="${x}" y="72" width="13" height="10" rx="3"/>`).join('')}<path d="M185 68q30 4 49 18h-43z"/></g>${wh(62,130,12)}${wh(220,130,12)}`)},{n:'でんしゃ',s:'でんしゃ',c:'#e65a42',svg:box(`${road}<rect x="18" y="40" width="284" height="88" rx="12" fill="#e95d48" stroke="#74352c" stroke-width="2"/><rect x="28" y="54" width="244" height="38" rx="6" fill="#d9f1fa"/><g stroke="#e95d48" stroke-width="5">${[75,125,175,225].map(x=>`<path d="M${x} 52v42"/>`).join('')}</g><rect x="22" y="100" width="276" height="10" fill="#fff"/>${wh(72,130)}${wh(246,130)}`)},{n:'パトカー',s:'パトカー',c:'#28313b',svg:box(`${road}<path d="M22 116V98q0-12 16-16l60-8 32-28h82l38 32 44 10q12 3 12 16v12z" fill="#fff" stroke="#333" stroke-width="2"/><path d="M22 98h284v18H22z" fill="#20242a"/><path d="M138 52h62l28 25h-118z" fill="#a9d9ee"/><rect x="150" y="34" width="48" height="13" rx="5" fill="#f22"/>${wh(74,120)}${wh(250,120)}`)},{n:'しょうぼうしゃ',s:'しょうぼうしゃ',c:'#e31926',svg:box(`${road}<rect x="18" y="62" width="205" height="60" rx="7" fill="#e31926"/><path d="M220 76h48l32 28v18h-80z" fill="#ef2632"/><rect x="232" y="83" width="31" height="20" rx="3" fill="#bfe6f5"/><path d="M42 56L238 25l4 10L46 67z" fill="#e9edf0" stroke="#777" stroke-width="3"/><g stroke="#888" stroke-width="2">${[70,105,140,175,210].map(x=>`<path d="M${x} 51l4 12"/>`).join('')}</g>${wh(70,124)}${wh(190,124)}${wh(266,124)}`)},{n:'きゅうきゅうしゃ',s:'きゅうきゅうしゃ',c:'#d93542',svg:box(`${road}<path d="M18 118V48q0-8 9-8h188q15 0 24 13l24 31 29 6q12 3 12 15v13z" fill="#fff" stroke="#555" stroke-width="2"/><path d="M20 91h282" stroke="#e33b46" stroke-width="8"/><path d="M225 55l28 31h-42V55z" fill="#bfe4f4"/><rect x="102" y="29" width="48" height="12" rx="5" fill="#f22"/><path d="M106 56v24M94 68h24" stroke="#e33b46" stroke-width="8"/>${wh(72,122)}${wh(250,122)}`)},{n:'バス',s:'バス',c:'#319d62',svg:box(`${road}<rect x="14" y="34" width="292" height="90" rx="15" fill="#55b978" stroke="#35694a" stroke-width="2"/><rect x="28" y="48" width="250" height="39" rx="6" fill="#cceaf5"/><g stroke="#55b978" stroke-width="5">${[76,124,172,220].map(x=>`<path d="M${x} 46v43"/>`).join('')}</g><rect x="22" y="96" width="276" height="8" fill="#fff"/>${wh(72,126)}${wh(244,126)}`)},{n:'ショベルカー',s:'ショベルカー',c:'#d89b00',svg:box(`<rect x="0" y="140" width="320" height="6" fill="#b59a76"/><rect x="34" y="110" width="180" height="30" rx="15" fill="#444"/><g fill="#777">${[55,84,113,142,171,200].map(x=>`<circle cx="${x}" cy="125" r="9"/>`).join('')}</g><rect x="66" y="72" width="105" height="43" rx="7" fill="#f2b91f"/><path d="M110 72l25-35h54v78h-18V72z" fill="#e6a900"/><rect x="141" y="44" width="38" height="35" rx="4" fill="#b9ddeb"/><path d="M184 48l61 23 35 43" stroke="#e6a900" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M270 105l34 8-18 27-25-10z" fill="#e6a900"/>`)},{n:'ひこうき',s:'ひこうき',c:'#397cc1',svg:box(`<path d="M18 92l112-18 47-50h24l-18 47 92-8q28-2 34 10-4 13-34 15l-93 2 22 45h-25l-51-42-110 12z" fill="#eef3f7" stroke="#5c6d7a" stroke-width="2"/><path d="M181 70l93-7q20-1 29 6l-120 13z" fill="#4b91d1"/><circle cx="282" cy="75" r="4" fill="#fff5a8"/>`)},{n:'ふね',s:'ふね',c:'#297eb3',svg:box(`<path d="M28 103h268l-28 37H58z" fill="#2e82b7" stroke="#31556b" stroke-width="2"/><rect x="86" y="58" width="126" height="47" rx="5" fill="#f7f7f2"/><rect x="112" y="36" width="70" height="24" rx="4" fill="#f7f7f2"/><g fill="#87c7e4">${[102,130,158,186].map(x=>`<rect x="${x}" y="70" width="16" height="14" rx="2"/>`).join('')}</g><path d="M148 36V16h48" stroke="#555" stroke-width="4" fill="none"/><path d="M196 16l18 12h-18z" fill="#ef6b58"/><path d="M18 146q18-12 36 0t36 0t36 0t36 0t36 0t36 0t36 0" stroke="#5db7df" stroke-width="6" fill="none"/>`)}];let q=0,order=[],busy=false,ctx=null;const $=id=>document.getElementById(id);function audio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok,final=false){const c=audio();if(!c)return;const ns=final?[523,659,784,1047]:[ok?720:360];ns.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.1;o.type=ok||final?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(final?.08:.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.22)})}function speak(t,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),400);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;u.pitch=1;u.volume=.76;u.onend=()=>setTimeout(()=>cb&&cb(),280);u.onerror=u.onend;speechSynthesis.speak(u)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function screen(id){['start','game','end'].forEach(x=>$(x).classList.toggle('on',x===id))}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('span');s.className='star';s.textContent=i%2?'⭐':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*200-100)+'px');s.style.setProperty('--y',(-40-Math.random()*170)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function ask(){busy=false;const ans=order[q],pool=shuffle(V.filter(x=>x!==ans)).slice(0,q<2?1:2),opts=shuffle([ans,...pool]);$('progress').textContent=`${q+1} / 5`;$('question').textContent=`${ans.n} は どれ？`;$('status').textContent='';$('choices').innerHTML=opts.map((v,i)=>`<button class="choice" data-name="${v.n}" aria-label="${v.n}">${v.svg}${q===0&&v===ans?'<span style="position:absolute;right:8px;top:4px;font-size:34px;animation:pop .7s infinite">👆</span>':''}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>pick(b,ans));speak(`${ans.s}は、どれ？`)}function pick(b,ans){if(busy)return;audio();if(b.dataset.name===ans.n){busy=true;tone(true);b.classList.add('good');burst(b);$('status').textContent=`⭐ ${ans.n}！`;speak(`せいかい。${ans.s}！`,()=>{q++;if(q>=5){tone(true,true);screen('end');speak('すごい。ぜんぶ できたね！')}else ask()})}else{tone(false);b.classList.add('bad');$('status').textContent=`🙂 ${b.dataset.name}`;speak(`${b.dataset.name}だね。もういちど さがしてみよう`,()=>{b.classList.remove('bad');$('status').textContent=''})}}function begin(){audio();q=0;order=shuffle(V).slice(0,5);screen('game');speak('のりもの あてっこ。いわれた のりものを タッチしてね',ask)}$('parade').innerHTML=[V[0],V[3],V[7]].map(v=>`<div class="mini">${v.svg}</div>`).join('');$('play').onclick=begin;$('repeat').onclick=()=>{audio();const a=order[q];if(a)speak(`${a.s}は、どれ？`)};$('again').onclick=begin;})();</script><script src="back.js" data-home="index.html"></script></body></html>
