<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#bfe8ff"><title>のりもの あてっこ</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#bfe8ff,#fff5d9);color:#17324a;user-select:none;-webkit-user-select:none}.screen{position:fixed;inset:0;display:none;padding:calc(env(safe-area-inset-top) + 54px) 12px calc(env(safe-area-inset-bottom) + 12px)}.screen.on{display:flex;flex-direction:column;align-items:center}.title{font-size:clamp(34px,10vw,54px);font-weight:1000;line-height:1.05;text-align:center;margin-top:5vh}.sub{font-size:17px;font-weight:900;margin-top:12px}.parade{width:min(94vw,440px);display:flex;gap:8px;align-items:center;justify-content:center;margin:auto 0 18px}.mini{width:31%;filter:drop-shadow(0 5px 3px #0002)}.play{width:112px;height:112px;border:0;border-radius:50%;background:#ff7b55;box-shadow:0 9px 0 #c84f32;color:#fff;font-size:54px;touch-action:manipulation}.play:active{transform:translateY(6px);box-shadow:0 3px 0 #c84f32}.playlabel{font-size:22px;font-weight:1000;margin:10px 0 4vh}.top{width:min(96vw,480px);display:flex;justify-content:space-between;align-items:center}.progress{font-size:17px;font-weight:1000}.repeat{border:0;border-radius:50%;width:48px;height:48px;background:#fff9;font-size:24px}.question{font-size:clamp(25px,7vw,36px);font-weight:1000;text-align:center;margin:4px 0 10px}.choices{flex:1;min-height:0;width:min(96vw,480px);display:grid;grid-template-columns:1fr;gap:9px}.choice{position:relative;border:4px solid #fff;border-radius:24px;background:#fffbe9;box-shadow:0 6px 0 #66809933;min-height:0;padding:2px 8px;overflow:hidden;touch-action:manipulation}.choice svg{width:100%;height:100%;max-height:150px}.choice:active{transform:translateY(4px)}.choice.good{background:#c9f2d1;animation:pop .3s}.choice.bad{background:#ffe1e1;animation:shake .28s}.status{height:30px;font-size:20px;font-weight:1000;text-align:center}.endicon{font-size:76px;margin-top:auto}.endtext{font-size:34px;font-weight:1000;text-align:center}.again{border:0;border-radius:24px;background:#59ba7c;color:#fff;font:1000 20px inherit;padding:16px 28px;margin:28px 0 auto}.star{position:fixed;pointer-events:none;font-size:30px;z-index:30;animation:fly .8s forwards}@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(180deg);opacity:0}}@media(max-height:720px){.question{font-size:24px;margin:0 0 5px}.choices{gap:5px}.choice{border-radius:18px}.choice svg{max-height:118px}.top{height:44px}.repeat{width:42px;height:42px}.status{height:24px;font-size:17px}} .skip-intro{min-height:52px;min-width:240px;padding:12px 18px;border:0;border-radius:18px;background:#fff9;color:#244758;font:800 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;touch-action:manipulation;margin-bottom:12px}</style><script src="shared/vehicles.js"></script><script src="shared/pronunciation.js"></script><script src="shared/voice.js"></script><script src="shared/icons.js"></script><link rel="stylesheet" href="shared/product.css"></head><body><section id="start" class="screen on"><div class="title">のりもの<br>あてっこ</div><div class="sub">いろんな のりものを みつけよう！</div><div class="parade" id="parade"></div><button class="play" id="play" aria-label="せつめいを きく">▶</button><div class="playlabel">せつめいを きく</div><button id="skipIntro" class="skip-intro">せつめいを スキップ</button></section><section id="game" class="screen"><div class="top"><div class="progress" id="progress"></div><button class="repeat" id="repeat" aria-label="もういちどきく">🔊</button></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="status" id="status"></div></section><section id="end" class="screen"><div class="endicon">⭐</div><div class="endtext">すごい！<br>ぜんぶ できたね！</div><button class="again" id="again">もういっかい</button></section><script>(()=>{'use strict';const road='<rect x="0" y="138" width="320" height="6" rx="3" fill="#aeb5bd"/>';const wh=(x,y,r=16)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#30343a"/><circle cx="${x}" cy="${y}" r="${r*.43}" fill="#cbd1d8"/>`;const box=x=>`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">${x}</svg>`;const V=NoriVehicles.list().map(v=>({n:v.name,s:v.say,c:v.color,svg:v.svg}));let q=0,order=[],busy=false,ctx=null;const $=id=>document.getElementById(id);function audio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok,final=false){const c=audio();if(!c)return;const ns=final?[523,659,784,1047]:[ok?720:360];ns.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.1;o.type=ok||final?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(final?.08:.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.22)})}function speak(t,cb){return NoriVoice.speak(t,cb);}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function screen(id){['start','game','end'].forEach(x=>$(x).classList.toggle('on',x===id))}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<10;i++){const s=document.createElement('span');s.className='star';s.textContent=i%2?'⭐':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*200-100)+'px');s.style.setProperty('--y',(-40-Math.random()*170)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function ask(){busy=false;const ans=order[q],pool=shuffle(V.filter(x=>x!==ans)).slice(0,q<2?1:2),opts=shuffle([ans,...pool]);$('progress').textContent=`${q+1} / 5`;$('question').textContent=`${ans.n} は どれ？`;$('status').textContent='';$('choices').innerHTML=opts.map((v,i)=>`<button class="choice" data-name="${v.n}" aria-label="${v.n}">${v.svg}${q===0&&v===ans?'<span style="position:absolute;right:8px;top:4px;font-size:34px;animation:pop .7s infinite">👆</span>':''}</button>`).join('');[...$('choices').children].forEach(b=>b.onclick=()=>pick(b,ans));speak(`${ans.s}は、どれ？`)}function pick(b,ans){if(busy)return;audio();if(b.dataset.name===ans.n){busy=true;tone(true);b.classList.add('good');burst(b);$('status').textContent=`⭐ ${ans.n}！`;speak(`せいかい。${ans.s}！`,()=>{q++;if(q>=5){tone(true,true);screen('end');speak('すごい。ぜんぶ できたね！')}else ask()})}else{tone(false);b.classList.add('bad');$('status').textContent=`🙂 ${b.dataset.name}`;speak(`${b.dataset.name}だね。もういちど さがしてみよう`,()=>{b.classList.remove('bad');$('status').textContent=''})}}function begin(skipIntro=false){audio();q=0;order=shuffle(V).slice(0,5);screen('game');if(skipIntro)ask();else speak('のりもの あてっこ。いわれた のりものを タッチしてね',ask)}$('parade').innerHTML=[V[0],V[3],V[7]].map(v=>`<div class="mini">${v.svg}</div>`).join('');$('play').onclick=()=>begin(false);$('skipIntro').onclick=()=>begin(true);$('repeat').onclick=()=>{audio();const a=order[q];if(a)speak(`${a.s}は、どれ？`)};$('again').onclick=()=>begin(true);})();</script><script src="back.js" data-home="index.html"></script></body></html>
