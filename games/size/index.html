<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おおきい？ ちいさい？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f7f1e5;color:#17324a;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);gap:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:6px}.back{min-width:84px;min-height:44px;border:0;border-radius:15px;background:#fff;color:#17324a;font-weight:900;font-size:15px}.title{font-weight:900;font-size:20px;text-align:center;line-height:1.05}.count{min-width:60px;text-align:right;font-weight:900}.prompt{text-align:center;font-weight:900;font-size:24px;min-height:34px}.guide{text-align:center;font-size:13px;font-weight:800;color:#577083;min-height:18px}.stage{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center}.choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.choices.three{grid-template-columns:repeat(3,1fr)}.choice{position:relative;min-width:0;border:3px solid #fff;background:#fff;border-radius:24px;box-shadow:0 6px 0 #28465a22;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 5px;overflow:hidden}.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #28465a22}.vehicle-wrap{width:100%;height:72%;min-height:130px;display:flex;align-items:flex-end;justify-content:center}.vehicle{pointer-events:none;transform-origin:50% 100%}.vehicle svg{display:block;width:100%;height:auto}.size-word{font-size:15px;font-weight:900;margin-top:5px;min-height:20px;color:#577083}.choice.good{background:#e5f6e9;outline:7px solid #67cf78;animation:pop .38s}.choice.bad{background:#fff1ec;animation:shake .3s}.finger{position:absolute;right:7px;top:7px;font-size:34px;animation:pulse 1s infinite;filter:drop-shadow(0 2px 1px #fff)}.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}.star{position:absolute;font-size:30px;animation:fly .75s ease-out forwards}.start{position:fixed;inset:0;background:#f7f1e5;display:flex;align-items:center;justify-content:center;z-index:10}.start button{border:0;border-radius:28px;background:#fff;box-shadow:0 7px 0 #28465a22;padding:25px 35px;font-size:26px;font-weight:900;color:#17324a;line-height:1.3}.done{position:fixed;inset:0;background:#f7f1e5f4;display:none;z-index:9;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.done-inner{font-size:29px;font-weight:900}.done .again{margin-top:18px;min-height:52px;border:0;border-radius:18px;padding:0 22px;background:#65c77a;color:white;font-size:18px;font-weight:900}@keyframes pop{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@keyframes pulse{50%{transform:translateY(6px) scale(1.08)}}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(80deg);opacity:0}}@media(max-width:390px){.app{gap:5px;padding-left:8px;padding-right:8px}.title{font-size:17px}.prompt{font-size:21px}.choices{gap:7px}.choice{border-radius:19px;padding:5px 3px}.vehicle-wrap{min-height:110px}.size-word{font-size:12px}.choices.three .size-word{font-size:11px}}@media(max-height:700px){.prompt{font-size:20px}.vehicle-wrap{min-height:90px}.choice{padding-top:3px;padding-bottom:3px}}</style></head><body><div class="app"><div class="top"><button class="back" onclick="location.href='../../index.html'">← もどる</button><div class="title">おおきい？<br>ちいさい？</div><div class="count" id="count"></div></div><div class="prompt" id="prompt">いちばん おおきいのは どれ？</div><div class="guide" id="guide">みくらべて タッチ！</div><div class="stage"><div class="choices" id="choices"></div></div></div><div class="fx" id="fx"></div><div class="start" id="start"><button id="startBtn">👆 🔊<br>はじめる</button></div><div class="done" id="done"><div class="done-inner">🎉⭐<br>おおきさ わかったね！<br><button class="again" id="again">もういちど</button></div></div><script src="../../vehicles.js"></script><script>(()=>{'use strict';const ids=['patocar','kyukyusha','shobosha','bus','gomi','keikyu','airplane'];const pool=ids.map(id=>VEHICLES.find(v=>v.id===id)).filter(Boolean);const total=6;let q=0,busy=false,last=-1,ac=null,speechToken=0;const $=id=>document.getElementById(id),choices=$('choices'),prompt=$('prompt'),guide=$('guide'),count=$('count');function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}function tone(freq,dur,vol=.03,delay=0,type='sine'){const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}function good(){tone(660,.13,.026);tone(880,.18,.025,.11)}function bad(){tone(260,.14,.014);tone(220,.12,.011,.11)}function fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.22,.028,i*.12))}function speak(text,cb){const token=++speechToken;if(!('speechSynthesis'in window)){setTimeout(()=>{if(token===speechToken&&cb)cb()},700);return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.86;u.pitch=1.04;u.volume=.82;let done=false;const finish=()=>{if(done||token!==speechToken)return;done=true;setTimeout(()=>{if(token===speechToken&&cb)cb()},280)};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(()=>{if(token!==speechToken||done)return;if(!speechSynthesis.speaking&&!speechSynthesis.pending)finish()},Math.max(2500,text.length*220))}catch(_){setTimeout(()=>{if(token===speechToken&&cb)cb()},700)}}function art(v){return v.image?`<img src="../../${v.image}" alt="" style="width:100%;display:block">`:v.svg}function pickVehicle(){let n=Math.floor(Math.random()*pool.length);if(n===last)n=(n+1)%pool.length;last=n;return pool[n]}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*170-85)+'px');s.style.setProperty('--y',(-35-Math.random()*120)+'px');$('fx').appendChild(s);setTimeout(()=>s.remove(),800)}}function config(){if(q===0)return{ask:'big',scales:[.48,.88],labels:['ちいさい','おおきい']};if(q===1)return{ask:'small',scales:[.9,.46],labels:['おおきい','ちいさい']};if(q===2)return{ask:'big',scales:[.45,.66,.9],labels:['ちいさい','まんなか','おおきい']};if(q===3)return{ask:'small',scales:[.88,.62,.43],labels:['おおきい','まんなか','ちいさい']};if(q===4)return{ask:Math.random()<.5?'big':'small',scales:[.5,.69,.91],labels:['ちいさい','まんなか','おおきい']};return{ask:Math.random()<.5?'big':'small',scales:[.48,.68,.9],labels:['ちいさい','まんなか','おおきい']}}function render(){busy=false;const v=pickVehicle(),c=config(),isBig=c.ask==='big';count.textContent=`${q+1} / ${total}`;prompt.textContent=isBig?'いちばん おおきいのは どれ？':'いちばん ちいさいのは どれ？';guide.textContent=q<2?'みくらべて タッチ！':'3つを みくらべよう';const items=c.scales.map((s,i)=>({s,label:c.labels[i],right:isBig?s===Math.max(...c.scales):s===Math.min(...c.scales)}));for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}choices.className='choices'+(items.length===3?' three':'');choices.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-label',it.label);b.innerHTML=`<div class="vehicle-wrap"><div class="vehicle" style="width:${Math.round(it.s*100)}%">${art(v)}</div></div><div class="size-word">${q<2?it.label:''}</div>${q===0&&it.right?'<span class="finger">👆</span>':''}`;b.onclick=()=>answer(b,it,c.ask);choices.appendChild(b)});setTimeout(()=>speak(isBig?'いちばん おおきいのは どれかな？':'いちばん ちいさいのは どれかな？'),180)}function answer(btn,it,ask){if(busy)return;if(it.right){busy=true;btn.classList.add('good');good();burst(btn);prompt.textContent='せいかい！';guide.textContent=ask==='big'?'いちばん おおきい！':'いちばん ちいさい！';speak(ask==='big'?'せいかい。いちばん おおきいね！':'せいかい。いちばん ちいさいね！',()=>{q++;if(q>=total)finish();else render()})}else{btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');bad();const msg=it.label==='まんなか'?'これは まんなかの おおきさだね。':it.label==='おおきい'?'これは おおきいほうだね。':'これは ちいさいほうだね。';guide.textContent='もういちど みてみよう';speak(msg+' もういちど みくらべよう',()=>{btn.classList.remove('bad');guide.textContent=q<2?'みくらべて タッチ！':'3つを みくらべよう'})}}function finish(){fanfare();$('done').classList.add('show');speak('ぜんぶ できた！ おおきいと ちいさい、わかったね！')}$('startBtn').onclick=()=>{audio();$('start').style.display='none';speak('おおきいのと ちいさいのを みくらべるよ。',render)};$('again').onclick=()=>{speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();q=0;last=-1;$('done').classList.remove('show');render()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});})();</script></body></html>
