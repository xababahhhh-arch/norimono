<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おおきさ ぴったり</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f7f1e5;color:#17324a;overflow:hidden;touch-action:manipulation}.app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);gap:7px}.top{display:flex;align-items:center;justify-content:space-between}.back{min-width:72px;min-height:44px;border:0;border-radius:15px;background:#fff;font-weight:900;font-size:16px}.title{font-weight:900;font-size:20px}.count{min-width:72px;text-align:right;font-weight:900}.hint{text-align:center;font-weight:900;font-size:17px;min-height:26px}.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}.sample{height:28%;min-height:105px;display:flex;align-items:center;justify-content:center}.sample .vehicle{width:72%;max-width:285px}.choices{display:flex;align-items:center;justify-content:space-around;gap:7px;height:48%;min-height:180px}.choice{position:relative;flex:1;height:100%;min-width:0;border:3px solid #fff;background:#fff9;border-radius:22px;box-shadow:0 5px 0 #28465a22;display:flex;align-items:center;justify-content:center;padding:6px}.choice:active{transform:translateY(3px)}.choice.good{animation:pop .35s}.choice.bad{animation:shake .28s}.vehicle{pointer-events:none}.vehicle svg{display:block;width:100%;height:auto}.finger{position:absolute;right:4px;bottom:3px;font-size:30px;animation:pulse 1s infinite}.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;font-size:30px;animation:fly .8s forwards}.start{position:fixed;inset:0;background:#f7f1e5;display:flex;align-items:center;justify-content:center;z-index:5}.start button{border:0;border-radius:28px;background:#fff;box-shadow:0 7px 0 #28465a22;padding:24px 34px;font-size:26px;font-weight:900;color:#17324a}.done{position:fixed;inset:0;background:#f7f1e5ee;display:none;z-index:4;align-items:center;justify-content:center;text-align:center;font-size:27px;font-weight:900}.done.show{display:flex}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes fly{to{transform:translateY(-150px) rotate(100deg);opacity:0}}@media(max-width:380px){.title{font-size:18px}.hint{font-size:15px}.choices{gap:5px}.choice{border-radius:17px;padding:4px}}</style></head><body><div class="app"><div class="top"><button class="back" onclick="location.href='../../index.html'">← もどる</button><div class="title">おおきさ ぴったり</div><div class="count" id="count"></div></div><div class="hint" id="hint">おなじ おおきさは どれ？</div><div class="stage"><div class="sample" id="sample"></div><div class="choices" id="choices"></div></div></div><div class="stars" id="stars"></div><div class="start" id="start"><button id="startBtn">👆 🔊<br>はじめる</button></div><div class="done" id="done">🎉<br>ぜんぶ ぴったり！</div><script src="../../vehicles.js"></script><script>(()=>{const pool=['patocar','kyukyusha','shobosha','bus','gomishushusha','keikyu'].map(id=>VEHICLES.find(v=>v.id===id)).filter(Boolean);let q=0,busy=false,last=-1;const total=6;const sample=document.getElementById('sample'),choices=document.getElementById('choices'),hint=document.getElementById('hint'),count=document.getElementById('count');function ctx(){return new (window.AudioContext||window.webkitAudioContext)()}let ac;function tone(freq,dur,vol=.035,delay=0){if(!ac)ac=ctx();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+delay;o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.stop(t+dur)}function good(){tone(660,.12);tone(880,.18,.03,.11)}function bad(){tone(260,.12,.018);tone(220,.12,.014,.1)}function fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.25,.035,i*.12))}function speak(text,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.9;u.volume=.8;u.onend=()=>setTimeout(()=>cb&&cb(),280);u.onerror=()=>setTimeout(()=>cb&&cb(),280);speechSynthesis.speak(u)}function svg(v){return v.image?`<img src="../../${v.image}" style="width:100%">`:v.svg}function pick(){let n=Math.floor(Math.random()*pool.length);if(n===last)n=(n+1)%pool.length;last=n;return pool[n]}function stars(el){const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width*Math.random())+'px';s.style.top=(r.top+r.height*.45)+'px';document.getElementById('stars').appendChild(s);setTimeout(()=>s.remove(),850)}}function render(){busy=false;count.textContent=`${q+1} / ${total}`;hint.textContent='おなじ おおきさは どれ？';const v=pick(),target=q<2?.72:(.55+Math.random()*.25),scales=q<2?[target,.43]:q<4?[target,target*.7,target*1.28]:[target,target*.78,target*1.2];for(let i=scales.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[scales[i],scales[j]]=[scales[j],scales[i]]}sample.innerHTML=`<div class="vehicle" style="width:${target*100}%">${svg(v)}</div>`;choices.innerHTML='';scales.forEach((s,i)=>{const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label','おおきさをえらぶ');b.innerHTML=`<div class="vehicle" style="width:${Math.min(100,s/target*72)}%">${svg(v)}</div>${q===0&&Math.abs(s-target)<.001?'<span class="finger">👆</span>':''}`;b.onclick=()=>answer(b,Math.abs(s-target)<.001,v);choices.appendChild(b)})}function answer(b,ok,v){if(busy)return;if(ok){busy=true;b.classList.add('good');good();stars(b);hint.textContent='ぴったり！';speak('ぴったり！',()=>{q++;if(q>=total){fanfare();document.getElementById('done').classList.add('show');speak('ぜんぶ ぴったり！ できたね！')}else render()})}else{b.classList.add('bad');bad();hint.textContent='もういちど';speak('これは '+v.name+'。おおきさを よくみてね',()=>{b.classList.remove('bad');hint.textContent='おなじ おおきさは どれ？'})}}document.getElementById('startBtn').onclick=()=>{if(!ac)ac=ctx();ac.resume();document.getElementById('start').style.display='none';speak('うえと おなじ おおきさを おしてね',render)};})();</script></body></html>
