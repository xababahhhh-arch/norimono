<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>たいこで ドン！</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff3d7;color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 60px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:22px;font-weight:900;text-align:center;min-height:30px}.beats{height:58px;display:flex;gap:12px;align-items:center;justify-content:center}.beat{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid #e96b45;opacity:.42}.beat.on{opacity:1;transform:scale(1.28);background:#ffd25b;box-shadow:0 0 0 8px #ffd25b44}.beat.hitmark{background:#72d18a;opacity:1}.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}.drum{position:relative;width:min(74vw,300px);aspect-ratio:1;border:0;border-radius:50%;background:#f8dfb5;box-shadow:inset 0 0 0 14px #d95842,inset 0 0 0 22px #f6b14a,0 10px 0 #9d4938,0 16px 24px #0002;touch-action:manipulation}.drum:active,.drum.hit{transform:translateY(7px) scale(.98);box-shadow:inset 0 0 0 14px #d95842,inset 0 0 0 22px #f6b14a,0 3px 0 #9d4938}.face{font-size:72px}.hand{position:absolute;right:-15px;top:-12px;font-size:52px;animation:tap .75s infinite}.status{min-height:34px;font-size:22px;font-weight:900;text-align:center}.start{border:0;border-radius:20px;background:#56b97a;color:white;padding:14px 26px;font:900 20px inherit;min-height:54px}.stars{position:fixed;pointer-events:none;font-size:30px;animation:fly .7s forwards;z-index:20}.done{position:fixed;inset:0;display:none;place-items:center;background:#fff9e9f2;text-align:center;z-index:30}.done.show{display:grid}.done b{font-size:31px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#56b97a;color:#fff;font:900 18px inherit}@keyframes tap{50%{transform:translateY(12px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-height:700px){.drum{width:min(56vw,230px)}.face{font-size:58px}.beats{height:45px}.guide{font-size:19px}}</style></head><body><main class="app"><div class="progress" id="progress">1 / 6</div><div class="guide" id="guide">おとを きいてね</div><div class="beats" id="beats"></div><div class="stage"><button class="drum" id="drum" type="button" aria-label="たいこを たたく"><span class="face">🥁</span><span class="hand" id="hand">👆</span></button></div><div class="status" id="status"></div><button class="start" id="listen" type="button">🔊 おてほん</button></main><div class="done" id="done"><div>🎉 🥁 🎉<br><b>リズム ばっちり！</b><br><button id="again" type="button">もういちど</button></div></div><script>(()=>{'use strict';const stages=[{mode:'copy',pattern:[0]},{mode:'copy',pattern:[0,650]},{mode:'beat',hits:[0,1,2,3]},{mode:'beat',hits:[0,2]},{mode:'beat',hits:[1,3]},{mode:'beat',hits:[0,1,3]}],beatMs=650;let q=0,ctx=null,accept=false,taps=[],timer=0,playing=false,beatStart=0;const $=id=>document.getElementById(id);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function unlockAudio(){const c=ac();try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}}function drumSound(){const c=ac(),body=c.createOscillator(),bodyGain=c.createGain(),attack=c.createOscillator(),attackGain=c.createGain(),at=c.currentTime+.01;body.type='sine';body.frequency.setValueAtTime(220,at);body.frequency.exponentialRampToValueAtTime(110,at+.16);bodyGain.gain.setValueAtTime(.0001,at);bodyGain.gain.exponentialRampToValueAtTime(.25,at+.008);bodyGain.gain.exponentialRampToValueAtTime(.0001,at+.28);attack.type='triangle';attack.frequency.setValueAtTime(500,at);attack.frequency.exponentialRampToValueAtTime(260,at+.07);attackGain.gain.setValueAtTime(.0001,at);attackGain.gain.exponentialRampToValueAtTime(.11,at+.005);attackGain.gain.exponentialRampToValueAtTime(.0001,at+.11);body.connect(bodyGain).connect(c.destination);attack.connect(attackGain).connect(c.destination);body.start(at);attack.start(at);body.stop(at+.3);attack.stop(at+.13)}function clickSound(accent=false){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+.005;o.type='square';o.frequency.value=accent?1000:780;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.065);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.075)}function ping(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=ok?720:310;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(c.destination);o.start();o.stop(t+.2)}function currentCount(){return stages[q].mode==='copy'?stages[q].pattern.length:4}function showBeats(active=-1,hits=[]){$('beats').innerHTML=Array.from({length:currentCount()},(_,i)=>`<span class="beat ${i===active?'on':''} ${hits.includes(i)?'hitmark':''}"></span>`).join('')}function burst(){const r=$('drum').getBoundingClientRect();for(let i=0;i<8;i++){const s=document.createElement('span');s.className='stars';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-40-Math.random()*150)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function voice(text,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.9;u.pitch=1;u.volume=.7;u.onend=()=>setTimeout(()=>cb&&cb(),300);u.onerror=u.onend;speechSynthesis.speak(u)}function copyDemo(){const p=stages[q].pattern;showBeats();p.forEach((ms,i)=>setTimeout(()=>{drumSound();showBeats(i);$('drum').classList.add('hit');setTimeout(()=>$('drum').classList.remove('hit'),120)},ms));setTimeout(()=>{showBeats();$('status').textContent='👆 まねしてね';accept=true;playing=false},p[p.length-1]+650)}function beatDemo(){const target=stages[q].hits;$('status').textContent='👂 おてほんを きいてね';showBeats(-1,target);const totalBeats=8;for(let i=0;i<totalBeats;i++){setTimeout(()=>{const beat=i%4;clickSound(beat===0);showBeats(beat,target);if(i<4&&target.includes(beat)){setTimeout(drumSound,90);$('drum').classList.add('hit');setTimeout(()=>$('drum').classList.remove('hit'),220)}if(i===3){$('status').textContent='👆 そのまま まねしてね！';taps=[];beatStart=performance.now()+beatMs;accept=true}},i*beatMs)}setTimeout(()=>{accept=false;showBeats(-1,target);checkBeat();playing=false},totalBeats*beatMs+180)}function demo(){unlockAudio();if(playing)return;clearTimeout(timer);accept=false;taps=[];playing=true;$('guide').textContent=stages[q].mode==='copy'?'おなじ リズムで たたこう':'カッに あわせて たたこう';$('status').textContent='👂 おてほん';stages[q].mode==='copy'?copyDemo():beatDemo()}function normalize(a){if(a.length<2)return[];const first=a[0];return a.slice(1).map(x=>x-first)}function success(){ping(true);burst();$('status').textContent='⭐ せいかい！';voice(q<2?'せいかい。いい リズム！':'せいかい。カッに あわせて じょうずに たたけたね！',()=>{q++;if(q>=stages.length){$('done').classList.add('show');voice('ぜんぶ できた。リズム ばっちり！')}else{render();setTimeout(demo,450)}})}function retry(){ping(false);$('status').textContent='🙂 もういちど';voice('おしいね。もういちど おてほんを きいてみよう',()=>setTimeout(demo,350))}function checkCopy(){accept=false;const target=stages[q].pattern,got=normalize(taps);let ok=taps.length===target.length;if(ok&&target.length>1){const want=target.slice(1);ok=want.every((v,i)=>Math.abs(got[i]-v)<220)}ok?success():retry()}function checkBeat(){const target=stages[q].hits,matched=[];for(const tap of taps){let best=-1,dist=9999;for(const i of target){const d=Math.abs(tap-(beatStart+i*beatMs));if(d<dist){dist=d;best=i}}if(dist<=250&&!matched.includes(best))matched.push(best)}const extra=taps.length-matched.length;matched.length===target.length&&extra===0?success():retry()}function hit(){unlockAudio();if(!accept)return;drumSound();$('drum').classList.add('hit');setTimeout(()=>$('drum').classList.remove('hit'),100);taps.push(performance.now());$('hand').style.display='none';if(stages[q].mode==='copy'&&taps.length===stages[q].pattern.length){clearTimeout(timer);timer=setTimeout(checkCopy,260)}}function render(){$('progress').textContent=`${q+1} / ${stages.length}`;$('guide').textContent=q<2?'おとを きいて まねしよう':'カッに あわせて たたこう';$('status').textContent='';$('hand').style.display=q===0?'block':'none';showBeats(-1,stages[q].hits||[]);$('listen').textContent=q<2?'🔊 おてほん':'🎵 カッと ドンを きく'}$('drum').addEventListener('pointerdown',hit);$('listen').addEventListener('pointerdown',unlockAudio);$('listen').addEventListener('click',demo);$('again').addEventListener('pointerdown',unlockAudio);$('again').addEventListener('click',()=>{q=0;$('done').classList.remove('show');render();setTimeout(demo,300)});document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('norimono-started',()=>{unlockAudio();render();if(window.__noriSkipIntro)demo();else voice('たいこで ドン。さいしょは おてほんを まねしてね。あとから カッの おとに あわせて たたくよ',()=>demo())});render();})();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
