<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おうちに かえそう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(#bde8ff 0 45%,#b9dfa3 45%);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 52px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;justify-content:center;align-items:center}.count{font-weight:900;font-size:17px;background:#fff9;padding:6px 13px;border-radius:20px}.prompt{font-size:24px;font-weight:900;text-align:center;min-height:34px}.vehicle{width:min(58vw,230px);height:128px;display:flex;align-items:center;justify-content:center;animation:bob 1.5s ease-in-out infinite}.vehicle svg{width:100%;height:100%}@keyframes bob{50%{transform:translateY(-3px)}}.homes{width:100%;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch;min-height:0}.home{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 #0002;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 14px inherit;color:#17324a;position:relative;overflow:hidden;touch-action:manipulation}.home:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.home svg{width:92%;height:72px}.home.wrong{animation:shake .28s}.home.good{outline:6px solid #69d37b;transform:scale(1.04)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.hand{position:absolute;font-size:32px;right:7px;top:4px;animation:tap 1s infinite}@keyframes tap{50%{transform:translateY(7px)}}.stars{position:fixed;inset:0;pointer-events:none;z-index:20}.star{position:absolute;font-size:30px;animation:pop .7s ease-out forwards}@keyframes pop{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}.done{position:fixed;inset:0;background:#fff9;backdrop-filter:blur(5px);display:none;z-index:30;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.panel{background:white;border-radius:28px;padding:26px 30px;box-shadow:0 10px 30px #0003}.panel b{font-size:30px}.panel button{margin-top:18px;border:0;border-radius:18px;padding:14px 25px;background:#65c77a;font:900 18px inherit;color:white}@media(max-width:380px){.app{gap:4px}.prompt{font-size:21px}.vehicle{height:105px}.homes{gap:7px}.home svg{height:60px}}</style></head><body><main class="app"><div class="top"><span class="count" id="count">1 / 5</span></div><div class="prompt" id="prompt">おうちは どっち？</div><div class="vehicle" id="vehicle"></div><div class="homes" id="homes"></div></main><div class="stars" id="stars"></div><div class="done" id="done"><div class="panel"><div style="font-size:54px">🏠✨</div><b>みんな かえれたよ！</b><br><button id="again">もういちど</button></div></div><script>const V={fire:{name:'しょうぼうしゃ',home:'しょうぼうしょ',c:'#e74b45',icon:'🔥'},ambulance:{name:'きゅうきゅうしゃ',home:'びょういん',c:'#f7f7f7',icon:'✚'},bus:{name:'バス',home:'バスてい',c:'#f1c84c',icon:'BUS'},train:{name:'でんしゃ',home:'えき',c:'#69a9d0',icon:'🚉'},garbage:{name:'ごみしゅうしゅうしゃ',home:'ごみしゅうしゅうじょ',c:'#69b77c',icon:'♻'}};const ORDER=['fire','ambulance','bus','train','garbage'];const HOME_ART={しょうぼうしょ:['#e76b55','🔥'],びょういん:['#f5f7fa','✚'],バスてい:['#f2d36b','BUS'],えき:['#83b5d4','🚉'],ごみしゅうしゅうじょ:['#8bc48f','♻']};let q=0,busy=false,ctx=null;function car(v){return `<svg viewBox="0 0 260 120" aria-label="${v.name}"><rect x="24" y="42" width="202" height="52" rx="16" fill="${v.c}" stroke="#34495e" stroke-width="4"/><path d="M70 42l25-29h72l28 29" fill="${v.c}" stroke="#34495e" stroke-width="4"/><rect x="101" y="19" width="38" height="22" rx="4" fill="#bde8ff"/><circle cx="72" cy="96" r="17" fill="#34495e"/><circle cx="190" cy="96" r="17" fill="#34495e"/><circle cx="72" cy="96" r="7" fill="#d9e2e7"/><circle cx="190" cy="96" r="7" fill="#d9e2e7"/><text x="154" y="78" text-anchor="middle" font-size="25" font-weight="900" fill="#34495e">${v.icon}</text></svg>`}function homeArt(name){let a=HOME_ART[name];return `<svg viewBox="0 0 150 90"><path d="M13 42L75 5l62 37v42H13z" fill="${a[0]}" stroke="#405364" stroke-width="4"/><rect x="58" y="51" width="34" height="33" rx="3" fill="#fff"/><text x="75" y="48" text-anchor="middle" font-size="23" font-weight="900" fill="#405364">${a[1]}</text></svg>`}function speak(t,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),500);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.86;u.pitch=1.05;u.onend=()=>setTimeout(cb||(()=>{}),300);speechSynthesis.speak(u)}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(freq,t,d=.13){ac();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}function goodSound(){ac();let t=ctx.currentTime;tone(523,t);tone(659,t+.11);tone(784,t+.22)}function badSound(){ac();tone(260,ctx.currentTime,.16)}function fanfare(){ac();let t=ctx.currentTime;[523,659,784,1047].forEach((n,i)=>tone(n,t+i*.13,.2))}function stars(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');document.getElementById('stars').appendChild(s);setTimeout(()=>s.remove(),750)}}function choices(key){let correct=V[key].home,all=Object.values(V).map(x=>x.home).filter(x=>x!==correct),n=q<2?2:3;all.sort(()=>Math.random()-.5);let arr=[correct,...all.slice(0,n-1)].sort(()=>Math.random()-.5);return arr}function render(){busy=false;let key=ORDER[q],v=V[key];document.getElementById('count').textContent=`${q+1} / 5`;document.getElementById('vehicle').innerHTML=car(v);let hs=document.getElementById('homes');hs.innerHTML='';choices(key).forEach((h,i)=>{let b=document.createElement('button');b.className='home';b.dataset.home=h;b.innerHTML=homeArt(h)+`<span>${h}</span>`+(q===0&&h===v.home?'<span class="hand">👆</span>':'');b.onclick=()=>pick(b,key);hs.appendChild(b)});speak(`${v.name}の おうちは どこかな？`)}function pick(b,key){if(busy)return;let v=V[key];if(b.dataset.home===v.home){busy=true;b.classList.add('good');goodSound();stars(b);speak(`せいかい。${v.name}は、${v.home}に かえるよ`,()=>{q++;if(q>=5){fanfare();document.getElementById('done').classList.add('show');speak('できたね。みんな おうちに かえれたよ')}else render()})}else{b.classList.add('wrong');badSound();setTimeout(()=>b.classList.remove('wrong'),350);speak(`${b.dataset.home}だね。${v.name}の おうちを もういちど さがしてね`)}}document.getElementById('again').onclick=()=>{q=0;document.getElementById('done').classList.remove('show');render()};document.addEventListener('pointerdown',ac,{once:true});render();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
