<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おうちに かえそう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(#bfe8ff 0 43%,#b8dfa3 43%);color:#17324a;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.app{height:100dvh;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;justify-content:center}.count{font-weight:900;font-size:17px;background:#fff;padding:7px 14px;border-radius:999px;box-shadow:0 3px 0 #0002}.prompt{font-size:24px;font-weight:900;text-align:center;min-height:34px}.vehicle{width:min(76vw,305px);height:145px;display:flex;align-items:center;justify-content:center;animation:bob 1.4s ease-in-out infinite}.vehicle svg{width:100%;height:100%}@keyframes bob{50%{transform:translateY(-3px)}}.homes{width:100%;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}.home{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 #0002;padding:6px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:manipulation;min-height:112px}.home:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.home svg{width:100%;height:96px}.home.wrong{animation:shake .28s}.home.good{outline:6px solid #69d37b;transform:scale(1.03)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.hand{position:absolute;font-size:32px;right:7px;top:5px;animation:tap 1s infinite}@keyframes tap{50%{transform:translateY(7px)}}.stars{position:fixed;inset:0;pointer-events:none;z-index:20}.star{position:absolute;font-size:30px;animation:pop .7s ease-out forwards}@keyframes pop{from{transform:scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}.done{position:fixed;inset:0;background:#fff9;backdrop-filter:blur(5px);display:none;z-index:30;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.panel{background:#fff;border-radius:28px;padding:26px 30px;box-shadow:0 10px 30px #0003}.panel b{font-size:30px}.panel button{margin-top:18px;border:0;border-radius:18px;padding:15px 26px;background:#65c77a;font:900 18px inherit;color:#fff;min-height:52px}@media(max-width:390px){.app{gap:5px;padding-left:9px;padding-right:9px}.prompt{font-size:21px}.vehicle{height:120px}.homes{gap:7px}.home{min-height:92px}.home svg{height:78px}}</style></head><body><main class="app"><div class="top"><span class="count" id="count">1 / 6</span></div><div class="prompt">どこに かえる？</div><div class="vehicle" id="vehicle"></div><div class="homes" id="homes"></div></main><div class="stars" id="stars"></div><div class="done" id="done"><div class="panel"><div style="font-size:58px">🚒🚑🚓🚌🚃♻️</div><b>みんな かえれたよ！</b><br><button id="again">もういちど</button></div></div><script>const V={fire:{name:'しょうぼうしゃ',home:'しょうぼうしょ'},ambulance:{name:'きゅうきゅうしゃ',home:'しょうぼうしょ'},police:{name:'パトカー',home:'けいさつしょ'},bus:{name:'バス',home:'バスえいぎょうしょ'},train:{name:'でんしゃ',home:'しゃりょうきち'},garbage:{name:'ごみしゅうしゅうしゃ',home:'せいそうしゃこ'}};const ORDER=['fire','bus','ambulance','police','train','garbage'];let q=0,busy=false,ctx=null;const $=id=>document.getElementById(id);const wheel=(x,y=103,r=17)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#26343e"/><circle cx="${x}" cy="${y}" r="${Math.max(6,r-10)}" fill="#dce3e8"/>`;function vehicleArt(k){if(k==='fire')return `<svg viewBox="0 0 310 140" aria-label="しょうぼうしゃ"><rect x="30" y="55" width="238" height="50" rx="8" fill="#e7443e" stroke="#663a35" stroke-width="4"/><path d="M36 55V36h70l27 19" fill="#e7443e" stroke="#663a35" stroke-width="4"/><rect x="48" y="40" width="42" height="19" r <svg viewBox="0 0 180 115" aria-label="しょうぼうしょ"><rect x="10" y="28" width="160" height="76" rx="5" fill="#f2eee9" stroke="#465966" stroke-width="4"/><rect x="15" y="20" width="150" height="18" rx="3" fill="#d84a43"/><rect x="25" y="50" width="57" height="54" rx="3" fill="#d94b45" stroke="#763732" stroke-width="3"/><rect x="98" y="50" width="57" height="54" rx="3" fill="#d94b45" stroke="#763732" stroke-width="3"/><path d="M30 62h47M30 75h47M30 88h47M103 62h47M103 75h47M103 88h47" stroke="#ffd7d2" stroke-width="3"/><circle cx="90" cy="13" r="10" fill="#f1c94b" stroke="#465966" stroke-width="3"/></svg>`;if(name==='けいさつしょ')return `<svg viewBox="0 0 180 115" aria-label="けいさつしょ"><rect x="25" y="28" width="130" height="76" rx="5" fill="#edf4f8" stroke="#405364" stroke-width="4"/><path d="M16 31L90 7l74 24" fill="#5f8daf" stroke="#405364" stroke-width="4"/><rect x="67" y="61" width="46" height="43" fill="#b8d9eb" stroke="#405364" stroke-width="3"/><rect x="39" y="46" width="22" height="17" fill="#b8d9eb"/><rect x="119" y="46" width="22" height="17" fill="#b8d9eb"/><circle cx="90" cy="35" r="13" fill="#fff" stroke="#405364" stroke-width="3"/><path d="M90 26l4 6 7 1-5 5 1 7-7-3-7 3 1-7-5-5 7-1z" fill="#f1c94b"/></svg>`;if(name==='バスえいぎょうしょ')return `<svg viewBox="0 0 180 115" aria-label="バスえいぎょうしょ"><rect x="11" y="29" width="158" height="75" rx="5" fill="#efe7d6" stroke="#4e5d65" stroke-width="4"/><path d="M11 29h158l-16-17H27z" fill="#d8a44b" stroke="#4e5d65" stroke-width="4"/><rect x="22" y="48" width="64" height="56" rx="3" fill="#d9d9d9" stroke="#4e5d65" stroke-width="3"/><rect x="94" y="48" width="64" height="56" rx="3" fill="#d9d9d9" stroke="#4e5d65" stroke-width="3"/><g fill="#f2c94c" stroke="#5b5135" stroke-width="2"><rect x="28" y="71" width="52" height="22" rx="5"/><rect x="100" y="71" width="52" height="22" rx="5"/></g><g fill="#bde8ff"><rect x="34" y="75" width="28" height="9" rx="2"/><rect x="106" y="75" width="28" height="9" rx="2"/></g></svg>`;if(name==='しゃりょうきち')return `<svg viewBox="0 0 180 115" aria-label="しゃりょうきち"><path d="M14 40L90 9l76 31v61H14z" fill="#dce5ea" stroke="#445762" stroke-width="4"/><rect x="31" y="53" width="118" height="48" rx="4" fill="#9fb6c2" stroke="#445762" stroke-width="3"/><path d="M49 53v48M90 53v48M131 53v48" stroke="#445762" stroke-width="3"/><path d="M29 110h122M39 103l-5 12M72 103l-5 12M108 103l5 12M141 103l5 12" stroke="#555" stroke-width="4"/><rect x="54" y="63" width="72" height="27" rx="8" fill="#e8edf0" stroke="#445762" stroke-width="3"/><rect x="63" y="68" width="23" height="12" fill="#9fd2ed"/><rect x="94" y="68" width="23" height="12" fill="#9fd2ed"/><path d="M54 84h72" stroke="#4a9ac8" stroke-width="7"/></svg>`;return `<svg viewBox="0 0 180 115" aria-label="せいそうしゃこ"><rect x="11" y="29" width="158" height="75" rx="5" fill="#dcebdc" stroke="#405364" stroke-width="4"/><path d="M22 29h136l-13-17H35z" fill="#74aa79" stroke="#405364" stroke-width="4"/><rect x="23" y="48" width="92" height="56" rx="3" fill="#b4cbb5" stroke="#405364" stroke-width="3"/><rect x="126" y="54" width="25" height="38" rx="4" fill="#6cab70" stroke="#405364" stroke-width="3"/><rect x="120" y="48" width="37" height="8" rx="3" fill="#54656e"/><circle cx="69" cy="75" r="18" fill="#fff"/><path d="M69 60l6 10-8-1M54 82l11 1-5 7M84 85l-7-10 11 1" fill="none" stroke="#4f9c58" stroke-width="5" stroke-linecap="round"/></svg>`}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(f,t,d=.13,v=.045){ac();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}function goodSound(){ac();let t=ctx.currentTime;tone(523,t);tone(659,t+.11);tone(784,t+.22,.18)}function badSound(){ac();tone(250,ctx.currentTime,.16,.025)}function fanfare(){ac();let t=ctx.currentTime;[523,659,784,1047].forEach((n,i)=>tone(n,t+i*.13,.22))}function speak(t,cb){let done=false,timer=null;const finish=()=>{if(done)return;done=true;if(timer)clearTimeout(timer);if(cb)setTimeout(cb,250)};timer=setTimeout(finish,2600);if(!('speechSynthesis'in window)){finish();return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.86;u.pitch=1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}catch(_){finish()}}function stars(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');$('stars').appendChild(s);setTimeout(()=>s.remove(),750)}}function choices(key){let correct=V[key].home,all=[...new Set(Object.values(V).map(x=>x.home))].filter(x=>x!==correct),n=q<2?2:3;all.sort(()=>Math.random()-.5);return [correct,...all.slice(0,n-1)].sort(()=>Math.random()-.5)}function render(){busy=false;let key=ORDER[q],v=V[key];$('count').textContent=`${q+1} / ${ORDER.length}`;$('vehicle').innerHTML=vehicleArt(key);$('homes').innerHTML='';choices(key).forEach(h=>{let b=document.createElement('button');b.className='home';b.dataset.home=h;b.setAttribute('aria-label',h);b.innerHTML=homeArt(h)+(q===0&&h===v.home?'<span class="hand">👆</span>':'');b.onclick=()=>pick(b,key);$('homes').appendChild(b)});speak(`${v.name}は、どこに かえるかな？`)}function pick(b,key){if(busy)return;let v=V[key];if(b.dataset.home===v.home){busy=true;b.classList.add('good');goodSound();stars(b);speak(`せいかい。${v.name}は、${v.home}に かえるよ`,()=>{q++;if(q>=ORDER.length){fanfare();$('done').classList.add('show');speak('できたね。みんな おうちに かえれたよ')}else render()})}else{b.classList.add('wrong');badSound();setTimeout(()=>b.classList.remove('wrong'),350);speak('ちがうよ。もういちど さがしてね')}}$('again').onclick=()=>{q=0;$('done').classList.remove('show');render()};document.addEventListener('pointerdown',ac,{once:true});render();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
