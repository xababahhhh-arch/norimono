<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おうちに かえそう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(#bde8ff 0 45%,#b9dfa3 45%);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 52px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;justify-content:center}.count{font-weight:900;font-size:17px;background:#fff9;padding:6px 13px;border-radius:20px}.prompt{font-size:24px;font-weight:900;text-align:center;min-height:34px}.vehicle{width:min(72vw,290px);height:142px;display:flex;align-items:center;justify-content:center;animation:bob 1.5s ease-in-out infinite}.vehicle svg{width:100%;height:100%}@keyframes bob{50%{transform:translateY(-3px)}}.homes{width:100%;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch;min-height:0}.home{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 #0002;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 14px inherit;color:#17324a;position:relative;overflow:hidden;touch-action:manipulation}.home:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.home svg{width:92%;height:72px}.home.wrong{animation:shake .28s}.home.good{outline:6px solid #69d37b;transform:scale(1.04)}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.hand{position:absolute;font-size:32px;right:7px;top:4px;animation:tap 1s infinite}@keyframes tap{50%{transform:translateY(7px)}}.stars{position:fixed;inset:0;pointer-events:none;z-index:20}.star{position:absolute;font-size:30px;animation:pop .7s ease-out forwards}@keyframes pop{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}.done{position:fixed;inset:0;background:#fff9;backdrop-filter:blur(5px);display:none;z-index:30;align-items:center;justify-content:center;text-align:center}.done.show{display:flex}.panel{background:white;border-radius:28px;padding:26px 30px;box-shadow:0 10px 30px #0003}.panel b{font-size:30px}.panel button{margin-top:18px;border:0;border-radius:18px;padding:14px 25px;background:#65c77a;font:900 18px inherit;color:white}@media(max-width:380px){.app{gap:4px}.prompt{font-size:21px}.vehicle{height:118px}.homes{gap:7px}.home svg{height:60px}}</style></head><body><main class="app"><div class="top"><span class="count" id="count">1 / 5</span></div><div class="prompt" id="prompt">おうちは どっち？</div><div class="vehicle" id="vehicle"></div><div class="homes" id="homes"></div></main><div class="stars" id="stars"></div><div class="done" id="done"><div class="panel"><div style="font-size:54px">🏠✨</div><b>みんな かえれたよ！</b><br><button id="again">もういちど</button></div></div><script>const V={fire:{name:'しょうぼうしゃ',home:'しょうぼうしょ'},ambulance:{name:'きゅうきゅうしゃ',home:'びょういん'},bus:{name:'バス',home:'バスてい'},train:{name:'でんしゃ',home:'えき'},garbage:{name:'ごみしゅうしゅうしゃ',home:'ごみしゅうしゅうじょ'}};const ORDER=['fire','ambulance','bus','train','garbage'];const HOME_ART={しょうぼうしょ:['#e76b55','🔥'],びょういん:['#f5f7fa','✚'],バスてい:['#f2d36b','BUS'],えき:['#83b5d4','🚉'],ごみしゅうしゅうじょ:['#8bc48f','♻']};let q=0,busy=false,ctx=null;const wheel=(x,y=102)=>`<circle cx="${x}" cy="${y}" r="17" fill="#26343e"/><circle cx="${x}" cy="${y}" r="7" fill="#dce3e8"/>`;function vehicleArt(k){if(k==='fire')return `<svg viewBox="0 0 300 135" role="img" aria-label="しょうぼうしゃ"><rect x="34" y="54" width="224" height="50" rx="8" fill="#e7443e" stroke="#633" stroke-width="4"/><path d="M40 54V36h67l25 18" fill="#e7443e" stroke="#633" stroke-width="4"/><rect x="48" y="41" width="42" height="19" rx="3" fill="#bde8ff"/><rect x="150" y="29" width="104" height="10" rx="5" fill="#e9edf0" stroke="#59636b" stroke-width="3" transform="rotate(-8 150 29)"/><line x1="164" y1="28" x2="166" y2="43" stroke="#59636b" stroke-width="3"/><line x1="188" y1="25" x2="190" y2="40" stroke="#59636b" stroke-width="3"/><line x1="212" y1="22" x2="214" y2="37" stroke="#59636b" stroke-width="3"/><rect x="137" y="62" width="72" height="30" rx="5" fill="#c52f2b"/><circle cx="225" cy="69" r="13" fill="#fff" stroke="#633" stroke-width="3"/><path d="M225 60v18M216 69h18" stroke="#e7443e" stroke-width="4"/>${wheel(79)}${wheel(225)}</svg>`;if(k==='ambulance')return `<svg viewBox="0 0 300 135" role="img" aria-label="きゅうきゅうしゃ"><path d="M35 101V48c0-9 7-16 16-16h119c11 0 18 5 25 14l19 25h36c10 0 18 8 18 18v12z" fill="#fff" stroke="#465966" stroke-width="4"/><path d="M195 48l17 23h-43V43h17c4 0 7 2 9 5" fill="#bde8ff"/><rect x="53" y="43" width="74" height="28" rx="5" fill="#d8eff9"/><path d="M36 78h230" stroke="#e64b45" stroke-width="9"/><rect x="129" y="48" width="36" height="36" rx="5" fill="#fff"/><path d="M147 53v26M134 66h26" stroke="#e64b45" stroke-width="8"/><rect x="93" y="23" width="34" height="10" rx="5" fill="#ef5a55"/><rect x="132" y="23" width="34" height="10" rx="5" fill="#6aa9d5"/>${wheel(78)}${wheel(225)}</svg>`;if(k==='bus')return `<svg viewBox="0 0 300 135" role="img" aria-label="バス"><path d="M26 101V35c0-10 8-18 18-18h203c14 0 25 11 25 25v59z" fill="#f2c94c" stroke="#5b5135" stroke-width="4"/><rect x="42" y="31" width="180" height="34" rx="5" fill="#bde8ff"/><path d="M88 31v34M134 31v34M180 31v34" stroke="#5b7180" stroke-width="4"/><rect x="228" y="31" width="29" height="58" rx="4" fill="#d8eef8" stroke="#5b7180" stroke-width="3"/><path d="M31 76h236" stroke="#fff" stroke-width="6"/><rect x="47" y="71" width="48" height="18" rx="6" fill="#e99b38"/><text x="71" y="84" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">BUS</text>${wheel(75)}${wheel(228)}</svg>`;if(k==='train')return `<svg viewBox="0 0 300 135" role="img" aria-label="でんしゃ"><path d="M39 100V31c0-10 8-18 18-18h183c12 0 21 9 21 21v66z" fill="#e8edf0" stroke="#445762" stroke-width="4"/><rect x="55" y="27" width="47" height="37" rx="5" fill="#9fd2ed"/><rect x="111" y="27" width="47" height="37" rx="5" fill="#9fd2ed"/><rect x="167" y="27" width="47" height="37" rx="5" fill="#9fd2ed"/><rect x="223" y="27" width="25" height="52" rx="8" fill="#9fd2ed"/><path d="M40 72h220" stroke="#4a9ac8" stroke-width="12"/><circle cx="64" cy="88" r="6" fill="#ffd85b"/><circle cx="238" cy="88" r="6" fill="#ef5a55"/><rect x="59" y="101" width="178" height="8" rx="4" fill="#37474f"/><circle cx="85" cy="108" r="10" fill="#26343e"/><circle cx="215" cy="108" r="10" fill="#26343e"/><path d="M125 13l12-12h26l12 12" fill="none" stroke="#445762" stroke-width="4"/></svg>`;return `<svg viewBox="0 0 300 135" role="img" aria-label="ごみしゅうしゅうしゃ"><path d="M29 101V58c0-10 8-18 18-18h69l24 25v36z" fill="#79bd75" stroke="#3f5d46" stroke-width="4"/><path d="M116 40h18c8 0 13 3 18 10l11 15h-47z" fill="#bde8ff" stroke="#3f5d46" stroke-width="3"/><path d="M142 45h103l25 22-15 34H140z" fill="#65a962" stroke="#3f5d46" stroke-width="4"/><path d="M163 55h75l17 15-10 19h-82z" fill="#589452"/><path d="M253 61l21 10-10 24-15-6" fill="#79bd75" stroke="#3f5d46" stroke-width="4"/><circle cx="198" cy="73" r="17" fill="#fff"/><path d="M198 59l5 9-7-1M185 79l10 1-4 6M210 82l-6-8 9 1" fill="none" stroke="#4f9c58" stroke-width="5" stroke-linecap="round"/>${wheel(75)}${wheel(226)}</svg>`}function homeArt(name){let a=HOME_ART[name];return `<svg viewBox="0 0 150 90"><path d="M13 42L75 5l62 37v42H13z" fill="${a[0]}" stroke="#405364" stroke-width="4"/><rect x="58" y="51" width="34" height="33" rx="3" fill="#fff"/><text x="75" y="48" text-anchor="middle" font-size="23" font-weight="900" fill="#405364">${a[1]}</text></svg>`}function speak(t,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),500);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.86;u.pitch=1.05;u.onend=()=>setTimeout(cb||(()=>{}),300);speechSynthesis.speak(u)}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(freq,t,d=.13){ac();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}function goodSound(){ac();let t=ctx.currentTime;tone(523,t);tone(659,t+.11);tone(784,t+.22)}function badSound(){ac();tone(260,ctx.currentTime,.16)}function fanfare(){ac();let t=ctx.currentTime;[523,659,784,1047].forEach((n,i)=>tone(n,t+i*.13,.2))}function stars(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');document.getElementById('stars').appendChild(s);setTimeout(()=>s.remove(),750)}}function choices(key){let correct=V[key].home,all=Object.values(V).map(x=>x.home).filter(x=>x!==correct),n=q<2?2:3;all.sort(()=>Math.random()-.5);let arr=[correct,...all.slice(0,n-1)].sort(()=>Math.random()-.5);return arr}function render(){busy=false;let key=ORDER[q],v=V[key];document.getElementById('count').textContent=`${q+1} / 5`;document.getElementById('vehicle').innerHTML=vehicleArt(key);let hs=document.getElementById('homes');hs.innerHTML='';choices(key).forEach(h=>{let b=document.createElement('button');b.className='home';b.dataset.home=h;b.innerHTML=homeArt(h)+`<span>${h}</span>`+(q===0&&h===v.home?'<span class="hand">👆</span>':'');b.onclick=()=>pick(b,key);hs.appendChild(b)});speak(`${v.name}の おうちは どこかな？`)}function pick(b,key){if(busy)return;let v=V[key];if(b.dataset.home===v.home){busy=true;b.classList.add('good');goodSound();stars(b);speak(`せいかい。${v.name}は、${v.home}に かえるよ`,()=>{q++;if(q>=5){fanfare();document.getElementById('done').classList.add('show');speak('できたね。みんな おうちに かえれたよ')}else render()})}else{b.classList.add('wrong');badSound();setTimeout(()=>b.classList.remove('wrong'),350);speak(`${b.dataset.home}だね。${v.name}の おうちを もういちど さがしてね`)}}document.getElementById('again').onclick=()=>{q=0;document.getElementById('done').classList.remove('show');render()};document.addEventListener('pointerdown',ac,{once:true});render();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
