<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>たかい？ ひくい？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#dff5ff,#fff4d7);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 10px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:22px;font-weight:900;text-align:center}.listen{border:0;border-radius:19px;background:#fff;color:#17324a;box-shadow:0 5px 0 #17324a22;padding:11px 20px;font:900 18px inherit;min-height:48px}.choices{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{position:relative;border:4px solid #fff;border-radius:28px;box-shadow:0 7px 0 #17324a20;font:900 21px inherit;color:#17324a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;touch-action:manipulation}.choice.high{background:#d9f3ff}.choice.low{background:#f8dfbd}.choice:active{transform:translateY(4px)}.choice.good{outline:7px solid #64cf7c}.choice.bad{animation:shake .3s}.pic{font-size:82px;line-height:1}.arrow{font-size:44px;line-height:1}.hand{position:absolute;right:8px;top:8px;font-size:40px;animation:tap .8s infinite}.status{height:34px;font-size:21px;font-weight:900}.star{position:fixed;z-index:20;pointer-events:none;font-size:29px;animation:fly .7s forwards}.done{position:fixed;inset:0;display:none;place-items:center;background:#fff9e9f2;text-align:center;z-index:30}.done.show{display:grid}.done b{font-size:30px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#59bf78;color:#fff;font:900 18px inherit}@keyframes tap{50%{transform:translateY(9px)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:390px){.pic{font-size:68px}.choice{font-size:19px;border-radius:22px}.guide{font-size:20px}}@media(max-height:700px){.pic{font-size:58px}.arrow{font-size:34px}.listen{padding:8px 18px}.guide{font-size:18px}}</style></head><body><main class="app"><div class="progress" id="progress"></div><div class="guide" id="guide">おとを きいてね</div><button class="listen" id="listen" type="button">🔊 もういちど きく</button><div class="choices"><button class="choice high" id="high" type="button" aria-label="たかい おと"><span class="pic">🐦</span><span class="arrow">⬆️</span><span>たかい おと</span><span class="hand" id="hand">👆</span></button><button class="choice low" id="low" type="button" aria-label="ひくい おと"><span class="pic">🐘</span><span class="arrow">⬇️</span><span>ひくい おと</span></button></div><div class="status" id="status"></div></main><div class="done" id="done"><div>🎉 🎵 🎉<br><b>おとの たかさが わかったね！</b><br><button id="again" type="button">もういちど</button></div></div><script>(()=>{'use strict';const rounds=['high','low','high','low','high','low'].sort(()=>Math.random()-.5);let q=0,busy=false,ctx=null,toneEnd=0;const $=id=>document.getElementById(id);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(kind){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime,d=3;o.type='sine';o.frequency.value=kind==='high'?784:196;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065,t+.08);g.gain.setValueAtTime(.065,t+d-.18);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);toneEnd=performance.now()+d*1000}function fx(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=ok?660:300;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(c.destination);o.start();o.stop(t+.18)}function speak(text,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),450);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.96;u.pitch=1;u.volume=.8;u.onend=()=>setTimeout(()=>cb&&cb(),250);u.onerror=u.onend;speechSynthesis.speak(u)}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--y',(-35-Math.random()*130)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function play(){if(busy)return;tone(rounds[q]);$('status').textContent='👂 きいてね';setTimeout(()=>{$('status').textContent='どっちかな？'},3100)}function render(){$('progress').textContent=`${q+1} / ${rounds.length}`;$('guide').textContent=q<2?'たかい？ ひくい？':'おとの たかさは どっち？';$('status').textContent='';$('hand').style.display=q===0?'block':'none';setTimeout(play,350)}function pick(kind,el){if(busy||performance.now()<toneEnd)return;if(kind===rounds[q]){busy=true;fx(true);el.classList.add('good');burst(el);const label=kind==='high'?'たかい おと':'ひくい おと';speak(`せいかい。${label} だね`,()=>{el.classList.remove('good');q++;if(q>=rounds.length){$('done').classList.add('show');speak('ぜんぶ できた。おとの たかさが わかったね！')}else{busy=false;render()}})}else{fx(false);el.classList.add('bad');const answer=rounds[q]==='high'?'たかい おと':'ひくい おと';speak(`おしいね。これは ${answer}。もういちど きいてみよう`,()=>{el.classList.remove('bad');play()})}}$('listen').onclick=play;$('high').onclick=()=>pick('high',$('high'));$('low').onclick=()=>pick('low',$('low'));$('again').onclick=()=>{q=0;busy=false;$('done').classList.remove('show');render()};document.addEventListener('norimono-started',()=>{ac();speak('たかい おとと、ひくい おと。おとを きいて、どっちか えらんでね',render)});})();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
