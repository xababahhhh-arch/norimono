<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かたちで のりもの</title>
<meta name="theme-color" content="#1d5a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:linear-gradient(#8dd8ff 0 64%,#b9e98a 64% 100%);overflow:hidden;color:#123}
button{font:inherit}
.app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px}
.top{display:flex;align-items:center;justify-content:center;min-height:46px;position:relative}
h1{font-size:25px;letter-spacing:.04em;color:#103b5e;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.stars{position:absolute;right:4px;top:4px;font-size:20px;letter-spacing:2px;white-space:nowrap}
.say{min-height:38px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;color:#164e76;background:rgba(255,255,255,.72);border-radius:18px;padding:7px 12px;box-shadow:0 3px 0 rgba(16,59,94,.18)}
.stage{position:relative;flex:1;min-height:0;border-radius:28px;background:rgba(255,255,255,.22);overflow:hidden;border:3px solid rgba(255,255,255,.5)}
.road{position:absolute;left:0;right:0;bottom:0;height:30%;background:#59616b}
.road:after{content:"";position:absolute;left:0;right:0;top:47%;height:8px;background:repeating-linear-gradient(90deg,#ffe45c 0 34px,transparent 34px 62px)}
.vehicle{position:absolute;left:50%;top:49%;width:min(78vw,390px);height:min(42vw,210px);transform:translate(-50%,-50%);transition:transform .8s cubic-bezier(.32,.72,.19,1)}
.vehicle.drive{transform:translate(110vw,-50%)}
.slot,.placed{position:absolute;display:flex;align-items:center;justify-content:center}
.slot{border:4px dashed rgba(20,69,103,.48);background:rgba(255,255,255,.2)}
.slot.hot{animation:pulse .75s infinite alternate}
.placed{filter:drop-shadow(0 4px 2px rgba(0,0,0,.2));animation:pop .22s ease-out}
.circle{border-radius:50%}
.square,.rect{border-radius:14%}
.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}
.semi{border-radius:999px 999px 12px 12px}
@keyframes pulse{to{transform:scale(1.08);background:rgba(255,255,255,.5)}}
@keyframes pop{0%{transform:scale(.45)}80%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tray{min-height:122px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 8px;background:rgba(255,255,255,.78);border-radius:26px;box-shadow:0 6px 0 rgba(25,74,105,.18)}
.piece{width:82px;height:82px;border:0;background:rgba(255,255,255,.3);border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(21,66,95,.18);touch-action:none}
.piece:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(21,66,95,.18)}
.shape{width:58px;height:58px;pointer-events:none;filter:drop-shadow(0 3px 1px rgba(0,0,0,.18))}
.piece.selected{outline:6px solid #ffda3c;animation:bounce .65s infinite}
.dragging{position:fixed;z-index:9998;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.12);width:88px;height:88px;display:flex;align-items:center;justify-content:center}
.win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:50;background:rgba(255,255,255,.1);pointer-events:none}
.win.show{display:flex}
.win span{font-size:76px;animation:pop .35s ease-out}
.help{font-size:12px;text-align:center;font-weight:700;color:#21485f;opacity:.8}
@media (max-height:650px){h1{font-size:21px}.tray{min-height:96px}.piece{width:66px;height:66px}.shape{width:46px;height:46px}.say{font-size:17px;min-height:32px}.vehicle{top:48%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>かたちで のりもの</h1><div class="stars" id="stars">☆ ☆ ☆</div></div>
  <div class="say" id="say">かたちを えらんでね</div>
  <main class="stage" id="stage" aria-label="のりものをつくる場所">
    <div class="road"></div>
    <div class="vehicle" id="vehicle"></div>
    <div class="win" id="win"><span>⭐️</span></div>
  </main>
  <div class="tray" id="tray" aria-label="かたちを選ぶ場所"></div>
  <div class="help">さわって はこぶ ／ かたちをタップ → ばしょをタップ</div>
</div>
<script>
(() => {
  'use strict';
  const COLORS={red:'#ff5b4d',blue:'#2588e6',yellow:'#ffd23f',green:'#58bf58',dark:'#263441',white:'#f7fbff'};
  const ROUNDS=[
    {name:'くるま',voice:'くるまを つくろう',pieces:[
      {kind:'rect',x:18,y:47,w:64,h:28,color:'red'},
      {kind:'semi',x:34,y:28,w:36,h:25,color:'blue'},
      {kind:'circle',x:24,y:68,w:18,h:18,color:'dark'},
      {kind:'circle',x:62,y:68,w:18,h:18,color:'dark'}
    ]},
    {name:'バス',voice:'バスを つくろう',pieces:[
      {kind:'rect',x:13,y:27,w:74,h:45,color:'yellow'},
      {kind:'square',x:23,y:36,w:19,h:19,color:'blue'},
      {kind:'square',x:47,y:36,w:19,h:19,color:'blue'},
      {kind:'circle',x:22,y:67,w:18,h:18,color:'dark'},
      {kind:'circle',x:64,y:67,w:18,h:18,color:'dark'}
    ]},
    {name:'でんしゃ',voice:'でんしゃを つくろう',pieces:[
      {kind:'rect',x:15,y:31,w:68,h:38,color:'green'},
      {kind:'triangle',x:72,y:31,w:20,h:38,color:'green'},
      {kind:'square',x:28,y:39,w:18,h:18,color:'white'},
      {kind:'square',x:51,y:39,w:18,h:18,color:'white'},
      {kind:'circle',x:27,y:65,w:17,h:17,color:'dark'},
      {kind:'circle',x:63,y:65,w:17,h:17,color:'dark'}
    ]}
  ];
  const vehicle=document.getElementById('vehicle');
  const tray=document.getElementById('tray');
  const say=document.getElementById('say');
  const stars=document.getElementById('stars');
  const win=document.getElementById('win');
  let roundIndex=0, filled=new Set(), selected=null, drag=null, pointerId=null;

  const pct=n=>n+'%';
  function speak(text){
    say.textContent=text;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.replace(/ /g,''));
      u.lang='ja-JP'; u.rate=.86; u.pitch=1.08; u.volume=.9;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function shapeEl(p,extra=''){
    const d=document.createElement('div');
    d.className='shape '+p.kind+' '+extra;
    d.style.background=COLORS[p.color]||p.color;
    return d;
  }
  function renderRound(){
    filled.clear(); selected=null; drag=null; pointerId=null;
    vehicle.classList.remove('drive');
    vehicle.innerHTML=''; tray.innerHTML=''; win.classList.remove('show');
    const round=ROUNDS[roundIndex];
    stars.textContent=ROUNDS.map((_,i)=>i<roundIndex?'★':'☆').join(' ');
    round.pieces.forEach((p,i)=>{
      const slot=document.createElement('button');
      slot.type='button'; slot.className='slot '+p.kind; slot.dataset.i=i; slot.dataset.kind=p.kind;
      slot.setAttribute('aria-label',p.kind+' の おきば');
      Object.assign(slot.style,{left:pct(p.x),top:pct(p.y),width:pct(p.w),height:pct(p.h)});
      slot.addEventListener('click',()=>{ if(selected) tryPlace(selected,slot); });
      vehicle.appendChild(slot);
    });
    const order=[...round.pieces.keys()].sort(()=>Math.random()-.5);
    order.forEach(i=>{
      const p=round.pieces[i];
      const b=document.createElement('button');
      b.type='button'; b.className='piece'; b.dataset.i=i; b.dataset.kind=p.kind;
      b.setAttribute('aria-label',p.kind+' の かたち');
      b.appendChild(shapeEl(p));
      b.addEventListener('click',()=>selectPiece(b));
      b.addEventListener('pointerdown',e=>startDrag(e,b));
      tray.appendChild(b);
    });
    setTimeout(()=>speak(round.voice),180);
  }
  function selectPiece(b){
    if(!b || !b.isConnected) return;
    document.querySelectorAll('.piece').forEach(x=>x.classList.remove('selected'));
    selected=b; b.classList.add('selected');
    highlight(b.dataset.kind);
    speak(shapeName(b.dataset.kind)+'を おいてみよう');
  }
  function highlight(kind){
    vehicle.querySelectorAll('.slot').forEach(s=>s.classList.toggle('hot',!filled.has(+s.dataset.i)&&s.dataset.kind===kind));
  }
  function shapeName(kind){return ({circle:'まる',square:'しかく',rect:'ながしかく',triangle:'さんかく',semi:'まるい かたち'})[kind]||'かたち'}
  function startDrag(e,b){
    pointerId=e.pointerId;
    b.setPointerCapture?.(e.pointerId);
    selectPiece(b);
    const ghost=document.createElement('div'); ghost.className='dragging'; ghost.appendChild(b.firstElementChild.cloneNode(true));
    document.body.appendChild(ghost); drag={ghost,b}; moveGhost(e.clientX,e.clientY);
    b.addEventListener('pointermove',moveDrag); b.addEventListener('pointerup',endDrag,{once:true}); b.addEventListener('pointercancel',endDrag,{once:true});
    e.preventDefault();
  }
  function moveDrag(e){if(!drag||e.pointerId!==pointerId)return;moveGhost(e.clientX,e.clientY);e.preventDefault()}
  function moveGhost(x,y){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px'}
  function endDrag(e){
    if(!drag||e.pointerId!==pointerId)return;
    const b=drag.b; drag.ghost.remove(); drag=null; pointerId=null;
    const candidates=[...vehicle.querySelectorAll('.slot')].filter(s=>!filled.has(+s.dataset.i)&&s.dataset.kind===b.dataset.kind);
    const target=candidates.find(s=>{const r=s.getBoundingClientRect();return e.clientX>=r.left-18&&e.clientX<=r.right+18&&e.clientY>=r.top-18&&e.clientY<=r.bottom+18;});
    if(target) tryPlace(b,target); else selectPiece(b);
  }
  function tryPlace(b,slot){
    if(!b||!slot||filled.has(+slot.dataset.i)) return;
    if(b.dataset.kind!==slot.dataset.kind){speak('ちがう かたちだよ');return;}
    const round=ROUNDS[roundIndex], i=+slot.dataset.i, p=round.pieces[i];
    filled.add(i); slot.style.visibility='hidden';
    const placed=shapeEl(p,'placed'); placed.className='placed '+p.kind;
    Object.assign(placed.style,{left:pct(p.x),top:pct(p.y),width:pct(p.w),height:pct(p.h),background:COLORS[p.color]||p.color});
    vehicle.appendChild(placed);
    b.remove(); selected=null; highlight('');
    if(filled.size===round.pieces.length) finishRound(); else speak('せいかい！');
  }
  function finishRound(){
    stars.textContent=ROUNDS.map((_,i)=>i<=roundIndex?'★':'☆').join(' ');
    win.classList.add('show'); speak('できた！ '+ROUNDS[roundIndex].name+'！');
    setTimeout(()=>{win.classList.remove('show');vehicle.classList.add('drive');},650);
    setTimeout(()=>{roundIndex=(roundIndex+1)%ROUNDS.length;renderRound();},1700);
  }
  window.addEventListener('contextmenu',e=>e.preventDefault());
  renderRound();
})();
</script>
<script src="../../back.js" data-home="../../index.html"></script>
</body>
</html>
