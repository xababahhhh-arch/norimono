<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>のりもの なおそう</title>
<meta name="theme-color" content="#7fd3ff">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:linear-gradient(#86d9ff 0 68%,#b8ed7f 68%);color:#123c5a;-webkit-tap-highlight-color:transparent}button{font:inherit}.app{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px}.top{min-height:48px;display:flex;align-items:center;justify-content:center;position:relative}h1{margin:0;font-size:24px;font-weight:900}.stars{position:absolute;right:0;top:9px;font-size:15px;letter-spacing:1px;white-space:nowrap}.prompt{background:#ffffffe8;border-radius:20px;padding:10px 12px;text-align:center;font-size:20px;font-weight:900;box-shadow:0 4px 0 #194e6e24}.stage{position:relative;min-height:400px;flex:1;border-radius:28px;border:4px solid #ffffffb8;overflow:hidden;background:linear-gradient(#ffffff22 0 66%,#606975 66%)}.stage:after{content:"";position:absolute;left:0;right:0;bottom:16%;height:7px;background:repeating-linear-gradient(90deg,#ffe36a 0 42px,transparent 42px 76px)}.example{position:absolute;left:10px;top:10px;width:116px;z-index:12;background:#fffffff2;border:3px solid #fff;border-radius:17px;padding:5px 6px 7px;box-shadow:0 4px 0 #194e6e26}.example b{display:block;text-align:center;font-size:13px;margin-bottom:1px}.example svg{display:block;width:100%;height:auto}.vehicle{position:absolute;left:50%;top:55%;width:min(88%,430px);transform:translate(-50%,-50%);transition:transform .75s cubic-bezier(.2,.7,.2,1)}.vehicle.drive{transform:translate(115%,-50%)}.vehicle svg{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 3px #0003)}.target{position:absolute;z-index:8;border:5px dashed #fff;background:#ffffff2e;box-shadow:0 0 0 7px #ffd83c9e,0 0 28px #ffd83ceb;animation:pulse .65s ease-in-out infinite alternate;touch-action:manipulation}.target.circle{border-radius:50%}.target.rect{border-radius:14px}.target.hidden{border-color:transparent;background:transparent;box-shadow:none;animation:none}.target.hint{border-color:#fff;background:#ffffff2e;box-shadow:0 0 0 7px #ffd83c9e,0 0 28px #ffd83ceb;animation:pulse .65s ease-in-out infinite alternate}.pointer{position:absolute;z-index:9;font-size:44px;filter:drop-shadow(0 3px 2px #0003);animation:point .65s ease-in-out infinite alternate;pointer-events:none}.celebrate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none}.celebrate.show{display:flex}.celebrate span{font-size:88px;animation:pop .28s ease-out}.bottom{background:#ffffffe2;border-radius:22px;padding:10px 12px;text-align:center;box-shadow:0 5px 0 #194e6e22}.bottom .big{font-size:18px;font-weight:900}.bottom .small{font-size:13px;font-weight:700;opacity:.74;margin-top:3px}.actions{display:flex;justify-content:center;gap:8px;margin-top:8px}.voice,.restart{border:0;border-radius:16px;padding:10px 15px;background:#195f92;color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 #0f3c5d}.restart{display:none}.restart.show{display:inline-block}@keyframes pulse{to{transform:scale(1.08);background:#ffffff61}}@keyframes point{to{transform:translateY(10px)}}@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.15)}100%{transform:scale(1)}}@media(max-width:430px){.stage{min-height:370px}.prompt{font-size:18px}.example{width:100px}.vehicle{top:57%}}@media(max-height:700px){.stage{min-height:315px}.example{width:90px}.vehicle{top:58%}.bottom{padding:8px 10px}}@media(prefers-reduced-motion:reduce){.target,.pointer,.celebrate span{animation:none}.vehicle{transition:none}}
</style>
<script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head>
<body>
<div class="app">
  <div class="top"><h1>のりもの なおそう</h1><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div></div>
  <div class="prompt" id="prompt" aria-live="polite">おてほんと おなじに しよう！</div>
  <main class="stage" id="stage" aria-label="のりものをなおすゲーム">
    <div class="example"><b>おてほん</b><div id="example"></div></div>
    <div class="vehicle" id="vehicle"></div>
    <div class="celebrate" id="celebrate"><span>⭐️</span></div>
  </main>
  <div class="bottom">
    <div class="big" id="guide">ひかっている ところを タッチ！</div>
    <div class="small" id="subguide">おてほんを みて なおしてね</div>
    <div class="actions"><button class="voice" id="voice" type="button">🔊 もういちど</button><button class="restart" id="restart" type="button">もういちど あそぶ</button></div>
  </div>
</div>
<script src="../../shared/vehicles-legacy.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const defs=[
  {id:'bus',name:'バス',say:'バス',missing:'まど',cls:'rect',hole:{x:80,y:55,w:39,h:32},pos:[23,32,18,27],pointer:[27,13]},
  {id:'keikyu',name:'でんしゃ',say:'電車',missing:'パンタグラフ',cls:'rect',hole:{x:105,y:12,w:63,h:32},pos:[30,3,25,31],pointer:[36,-8]},
  {id:'shobosha',name:'しょうぼうしゃ',say:'しょうぼうしゃ',missing:'はしご',cls:'rect',hole:{x:53,y:22,w:163,h:27},pos:[15,10,55,27],pointer:[36,-7]},
  {id:'kyukyusha',name:'きゅうきゅうしゃ',say:'きゅうきゅうしゃ',missing:'あかいライト',cls:'rect',hole:{x:91,y:24,w:68,h:19},pos:[27,11,25,25],pointer:[32,-7]},
  {id:'patocar',name:'パトカー',say:'パトカー',missing:'あかいライト',cls:'rect',hole:{x:135,y:22,w:52,h:16},pos:[40,8,22,25],pointer:[44,-9]},
  {id:'airplane',name:'ひこうき',say:'飛行機',missing:'つばさ',cls:'rect',hole:{kind:'part',part:'wing',x:150,y:96,w:112,h:46},pos:[44,57,42,36],pointer:[61,42]}
];
function shared(id){return (window.VEHICLES||[]).find(v=>v.id===id)}
function punch(svg,h,key){
  if(h.kind==='part'){const document=new DOMParser().parseFromString(svg,'image/svg+xml');const part=document.querySelector('[data-nori-part="'+h.part+'"]');if(!part)throw new Error('Missing repair part: '+h.part);part.remove();return new XMLSerializer().serializeToString(document.documentElement);}
  const a=svg.indexOf('>'),b=svg.lastIndexOf('</svg>');if(a<0||b<0)return svg;
  const mid=svg.slice(a+1,b),mask='repair-'+key+'-'+Math.random().toString(36).slice(2,8);
  const cut=h.kind==='circle'?`<circle cx="${h.cx}" cy="${h.cy}" r="${h.r}" fill="#000"/>`:`<rect x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="7" fill="#000"/>`;
  return svg.slice(0,a+1)+`<defs><mask id="${mask}" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="160"><rect x="0" y="0" width="320" height="160" fill="#fff"/>${cut}</mask></defs><g mask="url(#${mask})">${mid}</g></svg>`;
}
const V=defs.map(d=>{const s=shared(d.id);return s?{...d,full:s.svg,missingSvg:punch(s.svg,d.hole,d.id)}:null}).filter(Boolean);
const vehicle=$('vehicle'),example=$('example'),prompt=$('prompt'),stars=$('stars'),celebrate=$('celebrate'),guide=$('guide'),subguide=$('subguide'),voice=$('voice'),restart=$('restart');
let quiz=[],index=0,locked=false,hintTimer=null,currentSpeech='',speechToken=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(){quiz=shuffle([...V]).slice(0,5);index=0}
function speak(t,cb){return NoriVoice.speak(t,cb);}
function levelInfo(level,r){if(level===0)return{hidden:false,pointer:true,prompt:'おてほんと おなじに しよう！',guide:r.missing+'を タッチ！',sub:'ひかっている ところだよ',voice:'おてほんと おなじに しよう。'+r.missing+'を タッチ！',delay:0};if(level===1)return{hidden:false,pointer:true,prompt:r.missing+'は どこかな？',guide:'ひかっている ところを タッチ！',sub:'おてほんも みてね',voice:r.missing+'は どこかな？ ひかっている ところを タッチ！',delay:0};if(level===2)return{hidden:false,pointer:false,prompt:'おてほんと くらべてみよう',guide:'ちがう ところは どこ？',sub:'ひかっている ところが ヒント',voice:'おてほんと くらべてみよう。ちがう ところは どこかな？',delay:0};if(level===3)return{hidden:true,pointer:false,prompt:'どこが ちがうかな？',guide:'おてほんを よくみてね',sub:'6びょう まつと ヒントがでるよ',voice:'どこが ちがうかな？ おてほんを よくみてね',delay:6000};return{hidden:true,pointer:false,prompt:'さいごの もんだい！',guide:'おてほんと おなじに してね',sub:'8びょう まつと ヒントがでるよ',voice:'さいごの もんだい。おてほんと おなじに してね',delay:8000}}
function render(){clearTimeout(hintTimer);locked=false;celebrate.classList.remove('show');restart.classList.remove('show');voice.style.display='inline-block';guide.style.display='';subguide.style.display='';vehicle.classList.remove('drive');const r=quiz[index],info=levelInfo(index,r);stars.textContent=Array.from({length:5},(_,i)=>i<index?'★':'☆').join(' ');example.innerHTML=r.full;vehicle.innerHTML=r.missingSvg;prompt.textContent=info.prompt;guide.textContent=info.guide;subguide.textContent=info.sub;const t=document.createElement('button');t.type='button';t.className='target '+r.cls+(info.hidden?' hidden':'');t.setAttribute('aria-label',r.missing+'をつける');Object.assign(t.style,{left:r.pos[0]+'%',top:r.pos[1]+'%',width:r.pos[2]+'%',height:r.pos[3]+'%'});let p=null;if(info.pointer){p=document.createElement('div');p.className='pointer';p.textContent='👆';p.style.left=r.pointer[0]+'%';p.style.top=r.pointer[1]+'%';vehicle.appendChild(p)}t.addEventListener('click',()=>complete(t,p));vehicle.appendChild(t);setTimeout(()=>speak(info.voice),180);if(info.delay){hintTimer=setTimeout(()=>{if(!locked){t.classList.remove('hidden');t.classList.add('hint');guide.textContent='ヒント！ ここかな？';subguide.textContent=r.missing+'を さがしてみよう';speak('ヒント。'+r.missing+'は ここかな？')}},info.delay)}}
function complete(t,p){if(locked)return;locked=true;clearTimeout(hintTimer);if(p)p.remove();t.remove();const r=quiz[index];vehicle.innerHTML=r.full;prompt.textContent='できた！ '+r.name+'！';guide.textContent='できた！';subguide.textContent='つぎも やってみよう';stars.textContent=Array.from({length:5},(_,i)=>i<=index?'★':'☆').join(' ');celebrate.classList.add('show');speak('できた！ '+r.say+'！',()=>{celebrate.classList.remove('show');vehicle.classList.add('drive');setTimeout(()=>{if(index<4){index++;render()}else{prompt.textContent='5もん できた！';guide.textContent='ぜんぶ なおせた！';subguide.textContent='もういちどで ちがう のりものが でるよ';voice.style.display='none';restart.classList.add('show');speak('5もん できた！ ぜんぶ なおせた！ すごい！')}},500)})}
voice.addEventListener('click',()=>speak(currentSpeech));restart.addEventListener('click',()=>{newQuiz();render()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)NoriVoice.stop()});newQuiz();render();
})();
</script>
<script src="../../back.js" data-home="../../index.html"></script>
</body>
</html>
