<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おとの じゅんばん</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#e8f6ff,#fff3d5);color:#17324a;user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:21px;font-weight:900;text-align:center}.slots{height:48px;display:flex;gap:10px;align-items:center}.slot{width:38px;height:38px;border:4px solid #fff;border-radius:50%;background:#cbd8df;box-shadow:0 3px 0 #17324a22}.slot.done{background:#ffd45d;transform:scale(1.08)}.listen{border:0;border-radius:18px;background:#fff;padding:10px 20px;font:900 18px inherit;box-shadow:0 5px 0 #17324a22}.pads{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:stretch}.pad{position:relative;border:4px solid #fff;border-radius:27px;font:900 17px inherit;color:#17324a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 7px 0 #17324a20;touch-action:manipulation}.pad:active,.pad.flash{transform:translateY(5px) scale(.98);filter:brightness(1.08)}.pad[data-n="0"]{background:#ffc4c4}.pad[data-n="1"]{background:#c9e7ff}.pad[data-n="2"]{background:#d5efc5}.icon{font-size:57px}.hand{position:absolute;right:3px;top:3px;font-size:34px;animation:tap .8s infinite}.status{height:32px;font-size:20px;font-weight:900}.star{position:fixed;pointer-events:none;font-size:28px;z-index:20;animation:fly .7s forwards}.donebox{position:fixed;inset:0;display:none;place-items:center;background:#fff9e9f2;text-align:center;z-index:30}.donebox.show{display:grid}.donebox b{font-size:29px}.donebox button{margin-top:16px;border:0;border-radius:18px;padding:14px 24px;background:#59bf78;color:#fff;font:900 18px inherit}@keyframes tap{50%{transform:translateY(8px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:390px){.icon{font-size:48px}.pad{font-size:14px;border-radius:21px}.guide{font-size:19px}}@media(max-height:680px){.icon{font-size:42px}.slots{height:40px}.slot{width:32px;height:32px}.listen{padding:7px 18px}}</style></head><body><main class="app"><div class="progress" id="progress"></div><div class="guide">きこえた じゅんに タッチ</div><div class="slots" id="slots"></div><button class="listen" id="listen">🔊 おてほん</button><div class="pads"><button class="pad" data-n="0"><span class="icon">🔔</span><span>ベル</span><span class="hand" id="hand">👆</span></button><button class="pad" data-n="1"><span class="icon">💧</span><span>ポン</span></button><button class="pad" data-n="2"><span class="icon">⭐</span><span>キラ</span></button></div><div class="status" id="status"></div></main><div class="donebox" id="done"><div>🎉 🎶 🎉<br><b>じゅんばん ばっちり！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),pads=[...document.querySelectorAll('.pad')],names=['ベル','ポン','キラ'];let ctx,q=0,answer=[],input=[],playing=false,busy=false;function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function note(n){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=n===1?'sine':n===2?'triangle':'sine';o.frequency.value=[660,440,880][n];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(g).connect(c.destination);o.start();o.stop(t+.36);pads[n].classList.add('flash');setTimeout(()=>pads[n].classList.remove('flash'),220)}function fx(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=ok?760:330;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(c.destination);o.start();o.stop(t+.18)}function speak(t,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),450);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.96;u.pitch=1;u.volume=.8;u.onend=()=>setTimeout(()=>cb&&cb(),250);u.onerror=u.onend;speechSynthesis.speak(u)}function make(){const len=q<2?2:3;answer=[];while(answer.length<len){const n=Math.floor(Math.random()*3);if(answer.length===0||n!==answer[answer.length-1])answer.push(n)}input=[];$('slots').innerHTML=answer.map(()=>'<span class="slot"></span>').join('');$('progress').textContent=`${q+1} / 6`;$('status').textContent='';$('hand').style.display=q===0?'block':'none'}function demo(){if(playing||busy)return;playing=true;input=[];[...$('slots').children].forEach(x=>x.classList.remove('done'));$('status').textContent='👂 きいてね';answer.forEach((n,i)=>setTimeout(()=>note(n),i*650));setTimeout(()=>{playing=false;$('status').textContent='👆 じゅんばんに タッチ'},answer.length*650+250)}function stars(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*150-75)+'px');s.style.setProperty('--y',(-30-Math.random()*120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function tap(n,el){if(playing||busy)return;note(n);$('hand').style.display='none';const pos=input.length;if(n!==answer[pos]){busy=true;fx(false);$('status').textContent='🙂 もういちど';speak(`${names[n]} だったね。おてほんを もういちど きこう`,()=>{busy=false;input=[];demo()});return}input.push(n);$('slots').children[pos].classList.add('done');if(input.length===answer.length){busy=true;fx(true);stars(el);$('status').textContent='⭐ せいかい！';speak('せいかい。じゅんばん ばっちり！',()=>{q++;if(q>=6){$('done').classList.add('show');speak('ぜんぶ できた。おとの じゅんばんが わかったね！')}else{busy=false;make();setTimeout(demo,400)}})}}pads.forEach((p,i)=>p.onclick=()=>tap(i,p));$('listen').onclick=demo;$('again').onclick=()=>{q=0;busy=false;$('done').classList.remove('show');make();setTimeout(demo,350)};document.addEventListener('norimono-started',()=>{ac();make();speak('おとの じゅんばん。おてほんを きいて、きこえた じゅんに タッチしてね',()=>demo())});make();})();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
