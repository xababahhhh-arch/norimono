<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>どっちが さき？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef8ff;color:#17324a;user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:22px;font-weight:900;text-align:center;min-height:30px}.scene{width:min(94vw,430px);height:145px;border-radius:24px;background:#fff;box-shadow:0 6px 18px #17405a18;display:flex;align-items:center;justify-content:center;gap:12px}.step{font-size:58px}.arrow{font-size:34px}.choices{width:min(94vw,430px);display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-items:center}.choice{position:relative;border:4px solid #fff;border-radius:24px;background:#dff2df;min-height:145px;font-size:70px;box-shadow:0 7px 0 #7db58b;touch-action:manipulation}.choice:active{transform:translateY(5px);box-shadow:0 2px 0 #7db58b}.choice.hint{animation:glow 1s infinite}.finger{position:absolute;right:4px;top:-22px;font-size:40px}.status{min-height:34px;font-size:21px;font-weight:900;text-align:center}.stars{position:fixed;pointer-events:none;font-size:30px;animation:fly .75s forwards;z-index:20}.done{position:fixed;inset:0;display:none;place-items:center;background:#fffdf4f2;text-align:center;z-index:30}.done.show{display:grid}.done b{font-size:31px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#55b878;color:#fff;font:900 18px inherit}@keyframes glow{50%{box-shadow:0 0 0 9px #ffd85c,0 7px 0 #7db58b}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-height:700px){.scene{height:112px}.step{font-size:48px}.choice{min-height:112px;font-size:58px}}</style><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head><body><main class="app"><div class="progress" id="progress">1 / 6</div><div class="guide" id="guide">どっちが さき？</div><div class="scene" id="scene"></div><div class="choices" id="choices"></div><div class="status" id="status"></div></main><div class="done" id="done"><div>🎉 ⏰ 🎉<br><b>じゅんばん ばっちり！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const sets=[{a:'🚦',b:'🚗',sayA:'しんごうを みる',sayB:'くるまが すすむ'},{a:'☁️',b:'🌧️',sayA:'くもが でる',sayB:'あめが ふる'},{a:'🥚',b:'🐣',sayA:'たまご',sayB:'ひよこ'},{a:'🌱',b:'🌷',sayA:'めが でる',sayB:'はなが さく'},{a:'🌙',b:'☀️',sayA:'よる',sayB:'あさ'},{a:'🧼',b:'✨',sayA:'あらう',sayB:'きれいになる'}];let q=0,busy=false,ctx=null,round=[];const $=id=>document.getElementById(id);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=ok?720:300;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(c.destination);o.start();o.stop(t+.2)}function fanfare(){[523,659,784].forEach((f,i)=>setTimeout(()=>{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(c.destination);o.start();o.stop(t+.24)},i*130))}function voice(t,cb){return NoriVoice.speak(t,cb);}function burst(){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='stars';s.textContent='⭐';s.style.left='50%';s.style.top='55%';s.style.setProperty('--x',(Math.random()*200-100)+'px');s.style.setProperty('--y',(-50-Math.random()*160)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}function makeRound(){const base=sets[q];const showBoth=q<2;$('scene').innerHTML=showBoth?`<span class="step">${base.a}</span><span class="arrow">➡️</span><span class="step">${base.b}</span>`:`<span class="step">${base.a}</span><span class="arrow">➡️</span><span class="step">❓</span>`;round=Math.random()<.5?[base.a,base.b]:[base.b,base.a];$('choices').innerHTML=round.map((x,i)=>`<button class="choice ${q<2&&x===base.a?'hint':''}" data-v="${x}">${x}${q===0&&x===base.a?'<span class="finger">👆</span>':''}</button>`).join('');$('choices').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.v));$('progress').textContent=`${q+1} / 6`;$('guide').textContent=q<2?'みてね。どっちが さき？':'このあと どうなる？';$('status').textContent='';busy=false;if(q<2)voice(`${base.sayA}。そのあと、${base.sayB}。さきは どっちかな？`);else voice(`${base.sayA}。このあと どうなるかな？`)}function pick(v){if(busy)return;ac();const s=sets[q];if(v===s.a){busy=true;tone(true);burst();$('status').textContent='⭐ そう！ さき！';voice(`そう。${s.sayA}が さきだね`,()=>{q++;if(q>=6){fanfare();$('done').classList.add('show');voice('ぜんぶ できた。じゅんばん ばっちり！')}else makeRound()})}else{tone(false);$('status').textContent='🙂 もういちど';voice(`${s.sayB}は あとだね。さきは どっちかな？`)}}$('again').onclick=()=>{ac();q=0;$('done').classList.remove('show');makeRound()};document.addEventListener('norimono-started',()=>{ac();makeRound()});})();</script><script src="../../back.js" data-home="../../learning.html"></script></body></html>
