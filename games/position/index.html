<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>どこに いる？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#dff4ff,#fff6d9);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:23px;font-weight:900;text-align:center;min-height:34px}.scene{flex:1;min-height:180px;width:min(94vw,430px);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:stretch}.spot{position:relative;border:0;border-radius:24px;background:#fff9;box-shadow:0 5px 0 #17324a18;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;touch-action:manipulation}.spot:active{transform:translateY(3px)}.spot .v{font-size:clamp(54px,17vw,82px);line-height:1}.spot .label{font-size:16px;font-weight:900;margin-top:8px}.spot.hint{animation:glow 1s infinite}.finger{position:absolute;right:4px;top:3px;font-size:38px;animation:tap .7s infinite}.status{min-height:36px;font-size:21px;font-weight:900;text-align:center}.stars{position:fixed;z-index:20;pointer-events:none;font-size:28px;animation:fly .75s forwards}.done{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;background:#fff9e9f4}.done.show{display:grid}.done b{font-size:32px}.done button{border:0;border-radius:20px;background:#55b77b;color:#fff;padding:15px 25px;font:900 19px inherit;margin-top:18px}@keyframes glow{50%{box-shadow:0 0 0 8px #ffd85c88,0 5px 0 #17324a18;transform:scale(1.02)}}@keyframes tap{50%{transform:translateY(10px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:380px){.scene{gap:6px}.spot{border-radius:19px}.spot .label{font-size:14px}.guide{font-size:21px}}</style></head><body><main class="app"><div class="progress" id="progress">1 / 6</div><div class="guide" id="guide">ひだりは どこ？</div><div class="scene" id="scene"></div><div class="status" id="status"></div></main><div class="done" id="done"><div>🎉 🚗 🎉<br><b>ばしょ はかせ！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const qs=['left','right','middle','left','middle','right'],names={left:'ひだり',middle:'まんなか',right:'みぎ'},icons=['🚗','🚌','🚲','🚕','🚜','🚑','🚒'];let q=0,busy=false,ctx=null,round=[];const $=x=>document.getElementById(x);function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok,final=false){const c=audio(),now=c.currentTime,notes=final?[523,659,784]:[ok?660:300];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=now+i*.12;o.frequency.value=f;o.type=ok||final?'sine':'triangle';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(final?.055:.035,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.18)})}function speak(t,cb){if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;u.pitch=1;u.volume=.72;u.onend=()=>setTimeout(()=>cb&&cb(),280);u.onerror=u.onend;speechSynthesis.speak(u)}function shuffle(a){return a.sort(()=>Math.random()-.5)}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const s=document.createElement('span');s.className='stars';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*150-75)+'px');s.style.setProperty('--y',(-40-Math.random()*130)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}function render(){busy=false;$('progress').textContent=`${q+1} / ${qs.length}`;const target=qs[q];$('guide').textContent=`${names[target]}は どこ？`;$('status').textContent='';round=shuffle([...icons]).slice(0,3);const pos=['left','middle','right'];$('scene').innerHTML=pos.map((p,i)=>`<button class="spot ${q<2&&p===target?'hint':''}" data-pos="${p}"><span class="v">${round[i]}</span><span class="label">${names[p]}</span>${q===0&&p===target?'<span class="finger">👆</span>':''}</button>`).join('');$('scene').querySelectorAll('.spot').forEach(b=>b.onclick=()=>choose(b));if(q<2)speak(`${names[target]}を タッチしてね`);else speak(`${names[target]}は どこかな？`)}function choose(b){if(busy)return;audio();const picked=b.dataset.pos,target=qs[q];if(picked===target){busy=true;tone(true);burst(b);b.style.background='#d9f7d9';$('status').textContent='⭐ せいかい！';speak(`${names[target]}。せいかい！`,()=>{q++;if(q===qs.length){tone(true,true);$('done').classList.add('show');speak('ぜんぶ できた。ばしょ はかせ！')}else render()})}else{tone(false);b.style.background='#ffe8e8';$('status').textContent=`🙂 そこは ${names[picked]}`;speak(`そこは ${names[picked]}。${names[target]}を さがしてみよう`,()=>{b.style.background='';$('status').textContent=''})}}$('again').onclick=()=>{audio();q=0;$('done').classList.remove('show');render()};document.addEventListener('norimono-started',render);setTimeout(()=>{if(!window.__noriInteractionStarted)render()},500);})();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
