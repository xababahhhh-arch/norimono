<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ミキサーしゃ ぐるぐる</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#294657;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;user-select:none;touch-action:manipulation}main{max-width:520px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}.home,.sound{width:58px;height:58px;border:0;border-radius:18px;background:#fff;font-size:28px;box-shadow:0 4px #d4d0c8;text-decoration:none;color:#294657;display:grid;place-items:center}.round{text-align:center;font-weight:900;font-size:17px}.scene{position:relative;flex:1;min-height:380px;border-radius:28px;overflow:hidden;background:#bfe1ec;box-shadow:inset 0 0 0 3px #fff9}.scene svg{width:100%;height:100%;display:block}.drum{transform-origin:164px 215px}.spin .drum{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hint{text-align:center;min-height:34px;margin:0;font-size:23px;font-weight:900}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{border:0;border-radius:25px;min-height:84px;font-size:25px;font-weight:900;color:#294657;box-shadow:0 7px #b7a99b}.mix{background:#ffd36f}.pour{background:#8fd0b2}.controls button:active{transform:translateY(4px);box-shadow:0 3px #b7a99b}.cue{animation:pulse .85s infinite}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.08)}}.overlay{position:absolute;inset:0;background:#f6f1e8ed;display:grid;place-content:center;text-align:center;padding:24px;z-index:3}.overlay h2{font-size:32px}.overlay button{border:0;border-radius:22px;padding:20px;font-size:23px;font-weight:900;margin:6px;background:#ffd36f;color:#294657}</style><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script></head><body><main><header><a class="home" href="../../index.html">⌂</a><h1>ミキサーしゃ ぐるぐる</h1><button class="sound" id="sound">🔊</button></header><div class="round" id="round"></div><section class="scene" id="scene"></section><p class="hint" id="hint"></p><div class="controls" id="controls"><button class="mix cue" id="mix">↻ ぐるぐる</button><button class="pour" id="pour">▼ ざーっ</button></div></main><script>(()=>{const $=x=>document.getElementById(x),scene=$('scene'),hint=$('hint'),mix=$('mix'),pour=$('pour'),round=$('round');let r=0,mixed=0,fill=0,busy=false,soundOn=true,ctx;const needMix=[1,2,2],target=[1,2,3];function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}function tone(type){if(!soundOn)return;audio();if(!ctx)return;const fs=type==='final'?[523,659,784,1047]:type==='bad'?[240,210]:[660,880];fs.forEach((f,i)=>{const t=ctx.currentTime+i*.09,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.045,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.16)})}function say(t){hint.textContent=t.replaceAll('。','');if(!soundOn)return Promise.resolve();return NoriVoice.speak(t)}function draw(spin=false){const h=fill*28;scene.className='scene'+(spin?' spin':'');scene.innerHTML=`<svg viewBox="0 0 360 400"><rect width="360" height="400" fill="#bfe1ec"/><circle cx="310" cy="48" r="25" fill="#f7d878"/><path d="M0 290H360V400H0Z" fill="#b6b09e"/><path d="M0 345H360" stroke="#fff3c7" stroke-width="5" stroke-dasharray="25 18"/><g><rect x="65" y="225" width="220" height="70" rx="18" fill="#ef9b67"/><rect x="230" y="185" width="62" height="70" rx="12" fill="#f4b77f"/><rect x="244" y="196" width="34" height="27" rx="5" fill="#a7d7e4"/><circle cx="105" cy="300" r="27" fill="#43525b"/><circle cx="255" cy="300" r="27" fill="#43525b"/><g class="drum"><circle cx="164" cy="215" r="61" fill="#f4efe2" stroke="#5f8792" stroke-width="8"/><path d="M115 183L210 247M119 250L207 178" stroke="#e6a25e" stroke-width="13" stroke-linecap="round"/></g><path d="M207 235L247 267" stroke="#647b82" stroke-width="14" stroke-linecap="round"/></g><g><rect x="30" y="320" width="115" height="62" rx="8" fill="#ddd4c2" stroke="#8b8172" stroke-width="4"/><rect x="36" y="${376-h}" width="103" height="${h}" rx="5" fill="#a8a39a"/><path d="M36 ${376-target[r]*28}H139" stroke="#e55f55" stroke-width="5" stroke-dasharray="9 7"/></g>${mixed>=needMix[r]?'<text x="180" y="100" text-anchor="middle" font-size="50">✨</text>':''}</svg>`}function start(){mixed=0;fill=0;busy=false;round.textContent=`${r+1} / 3`;mix.classList.add('cue');pour.classList.remove('cue');draw();say(r===0?'ぐるぐるを おして、まぜよう。':r===1?'コンクリートを まぜよう。':'さいごも ぐるぐる まぜよう。')}async function doMix(){if(busy||mixed>=needMix[r])return;audio();busy=true;mix.classList.remove('cue');mixed++;draw(true);tone('ok');await say(mixed>=needMix[r]?'まざったよ。つぎは、ざーっ！':'いいね。もういちど ぐるぐる！');setTimeout(()=>{draw(false);busy=false;if(mixed>=needMix[r])pour.classList.add('cue');else mix.classList.add('cue')},420)}async function doPour(){if(busy)return;audio();if(mixed<needMix[r]){tone('bad');await say('まだだよ。さきに ぐるぐる まぜよう。');mix.classList.add('cue');return}busy=true;pour.classList.remove('cue');fill++;draw();if(fill<target[r]){tone('ok');await say('いいね。もうすこし！');busy=false;pour.classList.add('cue');return}tone('ok');await say('ぴったり！ できた！');setTimeout(()=>{r++;if(r<3)start();else finish()},650)}function finish(){tone('final');$('controls').hidden=true;scene.innerHTML=`<div class="overlay"><div style="font-size:50px">★ ✨ ★</div><h2>ぜんぶ できたね！</h2><button id="again">もういっかい</button><button id="home2">おうちへ</button></div>`;hint.textContent='';say('ぜんぶ できたね！');$('again').onclick=()=>{r=0;$('controls').hidden=false;start()};$('home2').onclick=()=>location.href='../../index.html'}mix.onclick=doMix;pour.onclick=doPour;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(!soundOn)NoriVoice.stop()};start()})();</script></body></html>
