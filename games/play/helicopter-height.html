<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ヘリコプター たかさを あわせよう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eaf6ff;color:#19384b;font-family:system-ui,-apple-system,sans-serif}main{height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:5px}h1{font-size:18px;margin:0;text-align:center}header a,header button{border:0;background:#fff;border-radius:14px;padding:10px;font-size:22px;color:inherit;text-decoration:none}.progress,.hint{text-align:center;font-weight:900}.hint{font-size:19px;min-height:28px}.scene{position:relative;flex:1;min-height:180px;border-radius:24px;overflow:hidden;background:linear-gradient(#91d5ff,#e5f7ff 75%,#8ccf8b 75%)}.cloud{position:absolute;font-size:34px;opacity:.65}.target{position:absolute;right:5%;width:35%;height:18%;border:5px dashed #f9b323;border-radius:24px;background:#fff9b7b8;display:grid;place-items:center;font-size:34px;transition:top .35s}.target:after{content:'ここ！';position:absolute;bottom:-22px;font-size:15px;color:#755016;font-weight:900}.heli{position:absolute;left:9%;top:67%;width:45%;font-size:clamp(62px,19vw,98px);text-align:center;transition:top .4s;filter:drop-shadow(0 4px 2px #426a7c33)}.heli.good{animation:pop .45s}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}.controls button,.overlay button{border:0;border-radius:19px;min-height:76px;font-size:21px;font-weight:900;color:#19384b;background:#ffdf7b;box-shadow:0 5px #cbb05c;touch-action:manipulation}.controls button:last-child{background:#9be4ae;box-shadow:0 5px #72b789}.controls button:disabled{opacity:.45}.overlay{position:absolute;inset:0;background:#eaf6fff2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;padding:20px;text-align:center}.overlay h2{font-size:27px;margin:0}.overlay button{padding:0 24px;min-height:60px}.spark{position:absolute;font-size:32px;animation:rise .9s forwards;pointer-events:none}@keyframes rise{to{transform:translateY(-80px);opacity:0}}@keyframes pop{50%{transform:scale(1.14)}}@media(max-width:360px){h1{font-size:16px}.controls button{font-size:18px;min-height:70px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうち">⌂</a><h1>🚁 たかさを あわせよう</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><section class="scene" id="scene"><span class="cloud" style="top:14%;left:9%">☁️</span><span class="cloud" style="top:39%;left:52%">☁️</span><div class="target" id="target">⭐</div><div class="heli" id="heli">🚁</div></section><div class="hint" id="hint"></div><div class="controls"><button id="up">⬆️ うえ</button><button id="down">⬇️ した</button><button id="go">⭐ とどける</button></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),heli=$('heli'),target=$('target'),hint=$('hint'),up=$('up'),down=$('down'),go=$('go');let round=0,level=0,busy=false,seq=0,ctx;const stages=[{start:2,goal:1},{start:1,goal:2},{start:2,goal:0}];const tops=[9,37,65];function tone(fs,volume=.025){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();fs.forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.11;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch{}}async function say(s){const token=++seq;hint.textContent=s;try{if(window.NoriVoice?.speak)await NoriVoice.speak(s);else if('speechSynthesis'in window){speechSynthesis.cancel();await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.86;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}}catch{}return token===seq}function positions(){heli.style.top=tops[level]+'%';target.style.top=tops[stages[round].goal]+'%';up.disabled=busy||level===0;down.disabled=busy||level===2;go.disabled=busy}function start(){busy=false;level=stages[round].start;$('progress').textContent=(round+1)+' / 3';positions();say(round===0?'うえを おして、ほしの たかさに あわせよう。':round===1?'したを おして、ほしの たかさに あわせよう。':'ほしと おなじ たかさに してね。')}function move(d){if(busy)return;level=Math.max(0,Math.min(2,level+d));tone([390,470],.012);positions();hint.textContent=level===stages[round].goal?'ぴったり！ とどけよう！':'ほしの たかさに あわせてね'}function stars(){for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent='⭐';s.style.left=(20+Math.random()*65)+'%';s.style.top=(20+Math.random()*55)+'%';scene.append(s);setTimeout(()=>s.remove(),950)}}async function deliver(){if(busy)return;busy=true;positions();if(level!==stages[round].goal){tone([320,290],.012);await say(level<stages[round].goal?'もうすこし しただよ。':'もうすこし うえだよ。');busy=false;positions();return}tone([523,659,784]);heli.classList.add('good');stars();await say('ぴったり！ ほしを とどけたよ！');heli.classList.remove('good');setTimeout(()=>{round++;if(round<stages.length)start();else finish()},450)}function finish(){tone([523,659,784,1047]);scene.insertAdjacentHTML('beforeend','<div class="overlay"><h2>🎉 ぜんぶ とどけたね！</h2><p>ヘリコプター だいかつやく！</p><button id="again">もういちど</button><button id="home">おうちへ</button></div>');say('ぜんぶ とどけたね！ やったね！');$('again').onclick=()=>{scene.querySelector('.overlay').remove();round=0;stages[2].goal=Math.random()<.5?0:1;start()};$('home').onclick=()=>location.href='../../index.html'}up.onclick=()=>move(-1);down.onclick=()=>move(1);go.onclick=deliver;$('repeat').onclick=()=>say('ほしと おなじ たかさに して、とどけるを おしてね。');start()})();</script></body></html>
