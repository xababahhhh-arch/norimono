<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フェリーに のせよう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#eaf7ff;color:#19364b}main{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0}a,button{touch-action:manipulation}header a,header button{background:white;border:0;border-radius:12px;padding:10px;font-size:24px;color:inherit;text-decoration:none}.progress{text-align:center;font-weight:800}.scene{flex:1;min-height:160px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#a6ddfa 0 58%,#48b4d8 58%)}.ferry{position:absolute;bottom:17%;left:13%;width:74%;height:26%;background:#fff9e6;border:5px solid #38657b;border-radius:12px 12px 48% 48%;display:flex;align-items:flex-start;justify-content:center;gap:5px;padding:7px;transition:transform .8s}.ferry:before{content:"⛴️";position:absolute;top:-68px;left:36%;font-size:55px}.slot{width:27%;height:75%;border:3px dashed #75a6bc;border-radius:12px;display:grid;place-items:center;font-size:clamp(26px,9vw,50px);background:#e4f6ff}.slot.filled{border:3px solid #80c6a2;background:#d6f9df}.dock{position:absolute;bottom:5%;left:0;right:0;height:10%;background:#b68b65}.hint{text-align:center;min-height:46px;font-size:20px;font-weight:900;display:grid;place-items:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices button{border:0;border-radius:18px;min-height:68px;background:#fff3c7;font-size:clamp(32px,10vw,52px);box-shadow:0 4px #cdbb89}.choices button:disabled{opacity:.45}.overlay{position:absolute;inset:0;background:#e9f8fff5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;z-index:4}.overlay h2{font-size:29px}.overlay button{font-size:24px;background:#ffe18a;border:0;border-radius:18px;padding:18px}.star{position:absolute;pointer-events:none;font-size:32px;animation:rise .8s forwards}@keyframes rise{to{transform:translateY(-85px);opacity:0}}@media(max-height:600px){.choices button{min-height:62px}.hint{min-height:30px;font-size:17px}.ferry:before{top:-48px;font-size:40px}}</style></head><body><main><header><a href="../../index.html" aria-label="ゲームいちらん">⌂</a><h1>⛴️ フェリーに のせよう</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><div class="scene" id="scene"><div class="dock"></div><div class="ferry" id="ferry"></div></div><div class="hint" id="hint"></div><div class="choices" id="choices"></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),ferry=$('ferry'),choices=$('choices'),hint=$('hint');const items=[['🚗','くるま'],['🚌','バス'],['🚜','トラクター'],['🚕','タクシー'],['🚚','トラック'],['🚙','じどうしゃ']];let round=0,loaded=0,targets=[],busy=false,seq=0,ctx;const wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(notes,volume=.025){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();notes.forEach((f,i)=>{const t=ctx.currentTime+i*.12,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}catch{}}async function speak(s){const n=++seq;hint.textContent=s;try{if('speechSynthesis'in window){speechSynthesis.cancel();await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.82;let done=false;const end=()=>{if(!done){done=true;resolve()}};u.onend=end;u.onerror=end;speechSynthesis.speak(u);setTimeout(end,4500)})}}catch{}await wait(250);return n===seq}function stars(){for(let i=0;i<6;i++){const el=document.createElement('span');el.className='star';el.textContent='⭐';el.style.left=(15+Math.random()*70)+'%';el.style.top=(25+Math.random()*40)+'%';scene.append(el);setTimeout(()=>el.remove(),850)}}async function render(){busy=true;loaded=0;ferry.style.transform='none';scene.querySelectorAll('.star,.overlay').forEach(e=>e.remove());const pool=[...items].sort(()=>Math.random()-.5);targets=pool.slice(0,round===0?1:round===1?2:3);ferry.innerHTML=targets.map(()=>'<div class="slot">＋</div>').join('');$('progress').textContent=(round+1)+' / 3';drawChoices();busy=false;await speak('さいしょは '+targets[0][1]+'を のせよう！')}function drawChoices(){const options=[...targets.slice(loaded),...items.filter(x=>!targets.some(y=>y[0]===x[0])).slice(0,Math.max(0,6-targets.slice(loaded).length))].sort(()=>Math.random()-.5);choices.innerHTML='';options.forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.setAttribute('aria-label',x[1]);b.onclick=()=>choose(x,b);choices.append(b)})}async function choose(x,b){if(busy)return;const wanted=targets[loaded];if(x[0]!==wanted[0]){busy=true;tone([310,275],.012);b.style.background='#ffdad9';await speak(x[1]+'だね。 '+wanted[1]+'を のせよう！');b.style.background='';busy=false;return}busy=true;b.disabled=true;ferry.children[loaded].textContent=x[0];ferry.children[loaded].classList.add('filled');tone([523,659,784]);stars();loaded++;await speak('せいかい！ '+x[1]+'が のったよ！');if(loaded<targets.length){drawChoices();await speak('つぎは '+targets[loaded][1]+'を のせよう！');busy=false;return}ferry.style.transform='translateX(12%)';await speak('しゅっぱつ！ みんな のれたね！');await wait(650);round++;if(round<3)render();else finish()}async function finish(){tone([523,659,784,1047],.035);scene.insertAdjacentHTML('beforeend','<div class="overlay"><h2>🎉 ぜんぶ のれたよ！</h2><button id="again">もういちど</button><button id="home">おうちへ</button></div>');choices.innerHTML='';await speak('やったね！ フェリーの たびに しゅっぱつ！');$('again').onclick=()=>{round=0;render()};$('home').onclick=()=>location.href='../../index.html'}$('repeat').onclick=()=>{if(!busy)speak(loaded<targets.length?targets[loaded][1]+'を のせよう！':'フェリーに のせよう！')};render()})();</script></body></html>
