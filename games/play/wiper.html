<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e8f1f5"><title>あめのひ ワイパー</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#28495b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;user-select:none;touch-action:manipulation}main{max-width:520px;margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}.round{font-size:18px;font-weight:900}.home,.sound{width:62px;height:62px;border:0;border-radius:20px;background:white;font-size:30px;box-shadow:0 4px #ccd5d5;text-decoration:none;color:#28495b;display:grid;place-items:center}.scene{position:relative;border-radius:30px;overflow:hidden;background:#a9d4e6;min-height:430px;flex:1;box-shadow:inset 0 0 0 3px #fff8}.scene svg{width:100%;height:100%;display:block}.hint{text-align:center;font-size:25px;font-weight:900;min-height:38px;margin:0}.wipe{border:0;border-radius:28px;background:#ef9b68;color:#243f50;font-size:30px;font-weight:900;min-height:92px;box-shadow:0 8px #b96e4e}.wipe:active{transform:translateY(5px);box-shadow:0 3px #b96e4e}.wipe.cue{animation:pulse .85s infinite}.wiper{transform-origin:180px 333px;transition:transform .32s ease-in-out}.wiper.go{transform:rotate(-68deg)}.drop{transition:opacity .3s,transform .3s}.clear .drop{opacity:0;transform:translateY(-8px)}.star{opacity:0}.clear .star{animation:pop .6s forwards}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.08)}}@keyframes pop{40%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}.overlay{position:absolute;inset:0;background:#f7f2e8ee;display:grid;place-content:center;text-align:center;padding:28px;z-index:3}.overlay h2{font-size:34px;margin:12px}.overlay p{font-size:22px;font-weight:800}.overlay button{margin-top:12px;border:0;border-radius:24px;padding:22px 18px;font-size:24px;font-weight:900;background:#ef9b68;color:#28495b}.overlay .secondary{background:white}.confetti{font-size:44px;letter-spacing:10px}@media(max-width:380px){h1{font-size:21px}.scene{min-height:360px}.hint{font-size:22px}.wipe{min-height:82px;font-size:27px}}</style><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script></head><body><main><header><a class="home" href="../../index.html" aria-label="おうち">⌂</a><h1>あめのひ ワイパー</h1><button class="sound" id="sound" aria-label="おと">🔊</button></header><div class="round" id="round"></div><section class="scene" id="scene"></section><p class="hint" id="hint"></p><button class="wipe cue" id="wipe">☝️ ワイパー！</button></main><script>(()=>{const $=id=>document.getElementById(id),scene=$('scene'),hint=$('hint'),wipe=$('wipe'),roundEl=$('round');let r=0,step=0,busy=false,soundOn=true,ctx;const needs=[1,2,3];function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}function tone(ok=true,final=false){if(!soundOn)return;audio();if(!ctx)return;const fs=final?[523,659,784,1047]:ok?[660,880]:[260,220];fs.forEach((f,i)=>{let t=ctx.currentTime+i*.1,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.055,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}function say(t){hint.textContent=t.replaceAll('。','');if(!soundOn)return Promise.resolve();return NoriVoice.speak(t)}function drops(n){const pos=[[105,125],[245,145],[170,195],[80,230],[270,235],[135,270],[225,275]];return pos.slice(0,n+2).map((p,i)=>`<g class="drop"><path d="M${p[0]} ${p[1]-14}q-13 18 0 28q13-10 0-28" fill="#5aa9d1"/><circle cx="${p[0]-4}" cy="${p[1]+3}" r="3" fill="#dff5ff"/></g>`).join('')}function draw(clear=false){scene.className='scene'+(clear?' clear':'');scene.innerHTML=`<svg viewBox="0 0 360 400" aria-label="あめの車のまど"><rect width="360" height="400" fill="#9ccde0"/><g stroke="#7aa9bd" stroke-width="3" opacity=".55">${Array.from({length:10},(_,i)=>`<path d="M${20+i*38} 5l-35 65"/>`).join('')}</g><path d="M38 86Q180 36 322 86L300 330H60Z" fill="#dff3f7" stroke="#557985" stroke-width="12"/><path d="M55 315H305L325 390H35Z" fill="#e98f68"/><circle cx="80" cy="360" r="18" fill="#ffe89b"/><circle cx="280" cy="360" r="18" fill="#ffe89b"/>${drops(r*2+1)}<g class="wiper ${clear?'go':''}"><path d="M180 333L86 250" stroke="#344f5b" stroke-width="10" stroke-linecap="round"/><circle cx="180" cy="333" r="11" fill="#344f5b"/></g><text class="star" x="180" y="180" text-anchor="middle" font-size="64">★</text></svg>`}function start(){busy=false;step=0;roundEl.textContent=`${r+1} / 3`;wipe.classList.add('cue');draw();say(r===0?'ワイパーを おして、あめを ふこう。':r===1?'もういちど。ワイパーで きれいにしよう。':'あめが いっぱい。ワイパーで きれいにしよう。')}async function hit(){if(busy)return;audio();wipe.classList.remove('cue');step++;const done=step>=needs[r];if(!done){busy=true;scene.querySelector('.wiper')?.classList.add('go');tone(true);await say('いいね。もういちど！');setTimeout(()=>{draw();busy=false},250);return}busy=true;draw(true);tone(true);await say('ピカピカ！ よくみえるね。');setTimeout(()=>{r++;if(r<3)start();else finish()},700)}function finish(){tone(true,true);roundEl.textContent='3 / 3';scene.innerHTML=`<div class="overlay"><div class="confetti">★ ✨ ★</div><h2>ぜんぶ できたね！</h2><p>あめのひも あんしん！</p><button id="again">もういっかい</button><button class="secondary" id="home2">おうちへ</button></div>`;hint.textContent='';wipe.hidden=true;say('ぜんぶ できたね！');$('again').onclick=()=>{r=0;wipe.hidden=false;start()};$('home2').onclick=()=>location.href='../../index.html'}wipe.onclick=hit;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(!soundOn)NoriVoice.stop();else say('ワイパーを おしてね。')};scene.addEventListener('click',()=>{if(!busy){tone(false);say('オレンジの ワイパーボタンを おしてね。')}});start()})();</script></body></html>
