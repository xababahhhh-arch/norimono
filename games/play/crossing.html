<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#dff2ff"><title>ふみきり まてるかな？</title><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#dff2ff;color:#17324a;touch-action:manipulation}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{height:100%;display:flex;flex-direction:column}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 10px}header a,header button{width:46px;height:42px;border:0;border-radius:15px;background:#fff;color:#17324a;font-size:24px;font-weight:900;box-shadow:0 3px 0 #aac5d2;text-decoration:none;display:grid;place-items:center}h1{font-size:19px;margin:0;text-align:center}.progress{height:16px;display:flex;justify-content:center;gap:7px}.progress i{width:10px;height:10px;border-radius:50%;background:#fff}.progress i.on{background:#57a86b}.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#9dd9f3 0 52%,#9fd081 52% 100%)}.road{position:absolute;left:0;right:0;bottom:0;height:34%;background:#67747d}.road:before,.road:after{content:"";position:absolute;left:0;right:0;height:5px;background:#fff;opacity:.7}.road:before{top:24%}.road:after{bottom:24%}.rail{position:absolute;left:48%;top:0;bottom:0;width:26%;background:#a98768;transform:skewX(-5deg)}.rail:before,.rail:after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#58616a}.rail:before{left:20%}.rail:after{right:20%}.gate{position:absolute;left:11%;bottom:34%;width:38%;height:14px;background:repeating-linear-gradient(90deg,#f4d84b 0 22px,#333 22px 44px);transform-origin:left center;transition:transform .5s;border-radius:8px;z-index:5}.gate.down{transform:rotate(82deg)}.signal{position:absolute;left:7%;bottom:39%;width:50px;height:80px;background:#38444d;border-radius:18px;z-index:6}.lamp{width:27px;height:27px;border-radius:50%;margin:8px auto;background:#772f31}.signal.clear .lamp{background:#258eea;box-shadow:0 0 18px #258eea}.signal.stop .lamp{background:#ff4b4f;box-shadow:0 0 18px #ff4b4f}.train{position:absolute;width:58%;left:53%;top:-35%;z-index:4;transition:top 2.2s linear}.train.go{top:105%}.train svg,.car svg{width:100%;height:auto;display:block}.car{position:absolute;width:43%;left:-45%;bottom:7%;z-index:3;transition:left 1.4s ease}.car.ready{left:3%}.car.cross{left:105%}.stopline{position:absolute;left:43%;bottom:0;width:7px;height:34%;background:#fff;z-index:2}.big{height:96px;padding:8px 12px;display:flex;gap:10px;background:#f7fbfd}.big button{flex:1;border:0;border-radius:24px;font-size:22px;font-weight:900;color:#17324a;box-shadow:0 5px 0 #9fb4bd}.wait{background:#ffd66b}.go{background:#85c8f5}header h1{flex:1;min-width:0;font-size:clamp(14px,3.7vw,19px)}header #repeat{width:60px;display:flex;flex-direction:column;font-size:12px;gap:0}#repeat svg{width:23px;height:23px}header>a,header>div{flex-shrink:0}.big button:active{transform:translateY(3px);box-shadow:0 2px 0 #9fb4bd}.hint{text-align:center;font-weight:900;font-size:17px;min-height:30px;margin:5px}.overlay{position:absolute;inset:0;z-index:20;background:#f7fbfdee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center}.overlay h2{font-size:27px;margin:0}.overlay p{font-size:18px;font-weight:800;line-height:1.6;margin:0}.overlay button{width:min(300px,88%);min-height:58px;border:0;border-radius:22px;font-size:18px;font-weight:900;background:#82c8e8;color:#17324a;box-shadow:0 5px 0 #699db5}.overlay button.secondary{background:#e6edf0}.finger{font-size:42px;animation:bob .8s infinite alternate}@keyframes bob{to{transform:translateY(8px)}}.spark{position:absolute;font-size:30px;z-index:12;animation:pop .8s forwards}@keyframes pop{to{transform:translate(var(--x),-70px) scale(1.5);opacity:0}}@media(max-height:600px){header{height:46px}h1{font-size:16px}.big{height:82px}.big button{font-size:19px}.hint{font-size:15px;margin:2px}.overlay{gap:8px}.overlay h2{font-size:23px}.overlay p{font-size:16px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうちへ">⌂</a><h1>ふみきり まてるかな？</h1><div style="display:flex;gap:6px"><button id="sound" aria-label="おとを オン オフ">🔊</button><button id="repeat" aria-label="もういちど きく"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h5l6-5v16l-6-5H3Z" fill="currentColor"/><path d="M17 7q7 5 0 10" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>きく</span></button></div></header><div class="progress" id="progress"></div><section class="scene" id="scene"></section><p class="hint" id="hint"></p><div class="big" id="controls"></div></main><script>const $=s=>document.querySelector(s),scene=$('#scene'),hint=$('#hint'),controls=$('#controls'),progress=$('#progress');let round=0,busy=false,ctx,timers=[],bellTimer=null,soundOn=true;const rounds=[true,false,true,true,false];function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch{}}function tone(ok=true,final=false){if(!soundOn)return;audio();if(!ctx)return;(final?[523,659,784,1047]:ok?[660,880]:[260]).forEach((f,i)=>{const t=ctx.currentTime+i*.1,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(ok?.07:.035,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}function bellHit(){if(!soundOn)return;audio();if(!ctx)return;[920,1320].forEach((f,i)=>{const t=ctx.currentTime+i*.035,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.78,t+.13);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.11,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.22)})}function startBell(){stopBell();if(!soundOn)return;bellHit();bellTimer=setInterval(bellHit,560)}function stopBell(){if(bellTimer){clearInterval(bellTimer);bellTimer=null}}function speak(t){if(!soundOn)return Promise.resolve();NoriVoice.stop();return NoriVoice.speak(t)}function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t)}function clear(){timers.forEach(clearTimeout);timers=[];stopBell();NoriVoice.stop()}function art(id){return NoriVehicles.artwork(id)}function dots(){progress.innerHTML=rounds.map((_,i)=>`<i class="${i<=round?'on':''}"></i>`).join('')}function base(){scene.innerHTML='<div class="rail"></div><div class="road"></div><div class="stopline"></div><div class="gate"></div><div class="signal"><div class="lamp"></div></div><div class="train">'+art('train')+'</div><div class="car">'+art('car')+'</div>';controls.innerHTML='<button class="wait">● まつ</button><button class="go">▶ すすむ</button>';$('.wait').onclick=()=>choose(false);$('.go').onclick=()=>choose(true);$('.car').classList.add('ready')}function setSignal(wait){const signal=$('.signal');signal.classList.toggle('stop',wait);signal.classList.toggle('clear',!wait);signal.dataset.state=wait?'wait':'go';signal.setAttribute('role','img');signal.setAttribute('aria-label',wait?'あか・まってね':'あお・すすめるよ');$('.gate').classList.toggle('down',wait)}function startRound(){clear();busy=false;dots();base();const trainComing=rounds[round];if(trainComing){setSignal(true);$('.train').classList.add('go');hint.textContent='どうする？';startBell();speak('でんしゃが くるよ。どうする？')}else{setSignal(false);$('.train').style.display='none';hint.textContent='どうする？';speak('ふみきりは あいているよ。どうする？')}if(round===0){const f=document.createElement('div');f.className='finger';f.textContent='☝';f.style.cssText='position:absolute;left:19%;bottom:3%;z-index:10';scene.append(f)}}function sparkle(){for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.cssText=`left:${35+Math.random()*30}%;top:${45+Math.random()*20}%;--x:${(Math.random()-.5)*140}px`;scene.append(s);later(()=>s.remove(),900)}}function choose(go){if(busy)return;audio();const trainComing=rounds[round],correct=trainComing?!go:go;if(!correct){tone(false);hint.textContent=trainComing?'でんしゃが くるよ。まってね':'あいているよ。すすめるよ';speak(hint.textContent);const b=go?$('.go'):$('.wait');b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:280});return}busy=true;controls.querySelectorAll('button').forEach(b=>b.disabled=true);tone(true);sparkle();if(trainComing){hint.textContent='じょうずに まてたね！';speak('じょうずに まてたね。でんしゃが とおりすぎるまで まとう。');later(()=>{stopBell();setSignal(false)},2300);later(()=>$('.car').classList.add('cross'),2900);later(next,4300)}else{hint.textContent='きをつけて しゅっぱつ！';speak('そうだね。きをつけて しゅっぱつ！');$('.car').classList.add('cross');later(next,1900)}}function next(){round++;if(round<rounds.length)startRound();else finish()}function finish(){clear();tone(true,true);scene.innerHTML='<div class="overlay"><h2>ぜんぶ できたね！</h2><p>ふみきりで<br>じょうずに まてたね</p><button id="again">↻ もういっかい</button><button class="secondary" id="home2">おうちへ</button></div>';controls.innerHTML='';hint.textContent='';$('#again').onclick=()=>{audio();round=0;startRound()};$('#home2').onclick=()=>location.href='../../index.html';speak('すごい！ふみきりで じょうずに まてたね。')}function intro(){dots();scene.innerHTML='<div class="overlay"><h2>ふみきり まてるかな？</h2><p>でんしゃが くるときは「まつ」<br>あいていたら「すすむ」</p><div class="finger">☝</div><button id="listen">▷ せつめいを きく</button><button class="secondary" id="skip">≫ せつめいを スキップ</button></div>';controls.innerHTML='';$('#listen').onclick=async()=>{audio();$('#listen').disabled=true;await speak('ふみきりを みてね。でんしゃが くるときは まつ。あいていたら すすむ。');startRound()};$('#skip').onclick=()=>{audio();startRound()}}$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇';$('#sound').setAttribute('aria-label',soundOn?'おとを オフ':'おとを オン');if(!soundOn){stopBell();NoriVoice.stop()}else{audio();const trainComing=round<rounds.length&&rounds[round]&&!busy;if(trainComing)startBell()}};$('#repeat').onclick=()=>speak(hint.textContent||'ふみきりを みてね');addEventListener('pagehide',clear);intro();</script></body></html>
