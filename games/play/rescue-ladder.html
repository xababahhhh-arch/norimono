<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>はしごしゃ たすけよう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef6f2;color:#17324a}button,a{touch-action:manipulation}main{height:100%;max-width:850px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}header a,header button{width:48px;height:48px;flex-shrink:0;border:0;border-radius:16px;background:#fff;color:#17324a;font-size:23px;text-decoration:none;display:grid;place-items:center;box-shadow:0 3px #bfd0ca}h1{font-size:clamp(16px,4vw,21px);margin:0}.progress,.hint{text-align:center;font-weight:900}.progress{font-size:14px}.hint{font-size:clamp(17px,4vw,21px);min-height:31px;margin:0}.scene{position:relative;flex:1;min-height:0;border-radius:25px;overflow:hidden;background:linear-gradient(#bde5f5,#d9f2f9 75%,#b9dbb5);box-shadow:inset 0 0 0 3px #fff}.scene svg{width:100%;height:100%;display:block}.scene .ladder-beam{transition:opacity .15s}.scene .ladder-rungs{stroke:#667d89;stroke-width:4;stroke-linecap:round}.scene .target-window{fill:#9bd7e8;stroke:#fff;stroke-width:6}.scene .target-window.ready{fill:#ffe99a;stroke:#f2ae46}.scene .rescued{opacity:0}.scene .rescued.visible{opacity:1}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{min-height:76px;border:0;border-radius:23px;font-size:clamp(19px,5vw,25px);font-weight:900;color:#17324a;box-shadow:0 6px #b7c9c5}.up{background:#ffd86b}.help{background:#8ed9a8}.controls button:disabled{opacity:.48}.cue{animation:pulse .8s infinite}@keyframes pulse{50%{filter:brightness(1.09)}}.overlay{position:absolute;inset:0;background:#eef6f2f5;z-index:10;display:grid;place-content:center;text-align:center;padding:25px;gap:12px}.overlay h2{font-size:29px;margin:0}.overlay p{font-size:19px;font-weight:800;line-height:1.5;margin:0}.overlay button{min-height:62px;border:0;border-radius:21px;background:#8ed9a8;font-size:20px;font-weight:900}.overlay .secondary{background:#fff}@media(max-height:500px){.controls button{min-height:54px}.hint{min-height:23px}main{gap:4px}}
</style></head><body><main><header><a href="../../index.html" aria-label="おうち">⌂</a><h1>はしごしゃ たすけよう</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><section class="scene" id="scene"></section><p class="hint" id="hint"></p><div class="controls" id="controls"><button class="up" id="up">⬆️ はしご</button><button class="help" id="help">🤝 たすける</button></div></main><script>(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),hint=$('hint'),progress=$('progress'),up=$('up'),help=$('help');
let round=0,step=0,busy=false,ctx,token=0;
const levels=[{need:1,y:260},{need:2,y:190},{need:3,y:120}];
const pivot={x:166,y:350},rest={x:216,y:335};
function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}
function notes(fs,vol=.035){audio();if(!ctx)return;fs.forEach((f,i)=>{const t=ctx.currentTime+i*.1,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}
function say(t){hint.textContent=t.replaceAll('。','');return NoriVoice.speak(t)}
function sceneMarkup(){const level=levels[round];return `<svg viewBox="0 0 500 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="左に消防車、右に建物。消防車から右上の窓へはしごを伸ばす"><rect x="0" y="385" width="500" height="55" fill="#91b4a0"/><path d="M0 390H500" stroke="#fff6da" stroke-width="6"/><rect x="294" y="40" width="178" height="346" rx="8" fill="#e9c78e" stroke="#a57c52" stroke-width="5"/><path d="M282 42H484" stroke="#a57c52" stroke-width="12"/><rect x="325" y="300" width="65" height="54" rx="5" fill="#a8c6d2" stroke="#fff" stroke-width="5"/><rect x="325" y="220" width="65" height="54" rx="5" fill="#a8c6d2" stroke="#fff" stroke-width="5"/><rect x="325" y="140" width="65" height="54" rx="5" fill="#a8c6d2" stroke="#fff" stroke-width="5"/><rect id="target-window" class="target-window" x="298" y="${level.y-32}" width="70" height="64" rx="8"/><text id="person" x="333" y="${level.y+13}" font-size="38" text-anchor="middle">🙋</text><text id="rescued" class="rescued" x="333" y="${level.y+13}" font-size="38" text-anchor="middle">😊</text><g aria-label="消防車"><rect x="35" y="322" width="198" height="57" rx="12" fill="#dc554b" stroke="#8b3f38" stroke-width="4"/><rect x="173" y="302" width="58" height="56" rx="8" fill="#e86654" stroke="#8b3f38" stroke-width="4"/><rect x="188" y="309" width="33" height="23" rx="3" fill="#bde5f5"/><rect x="54" y="337" width="92" height="22" rx="4" fill="#f1a89a"/><circle cx="81" cy="379" r="17" fill="#344d5a" stroke="#dce4e8" stroke-width="6"/><circle cx="198" cy="379" r="17" fill="#344d5a" stroke="#dce4e8" stroke-width="6"/><text x="84" y="317" font-size="16" fill="#fff" font-weight="bold">🚒 はしごしゃ</text></g><g id="ladder" aria-label="伸びるはしご"><line id="ladder-left" stroke="#657b86" stroke-width="10" stroke-linecap="round"/><line id="ladder-right" stroke="#657b86" stroke-width="10" stroke-linecap="round"/><g id="rungs" class="ladder-rungs"></g><line id="ladder-center" stroke="#f8f2d2" stroke-width="3" stroke-dasharray="5 8"/></g><circle cx="166" cy="350" r="13" fill="#f3d98b" stroke="#657b86" stroke-width="5"/><circle id="landing" cx="294" cy="${level.y}" r="15" fill="none" stroke="#f4af4b" stroke-width="5" stroke-dasharray="5 5"/><text x="387" y="${level.y-44}" font-size="17" text-anchor="middle" fill="#6b482a" font-weight="bold">ここを たすけよう！</text></svg>`}
function updateLadder(){const level=levels[round],fraction=step/level.need;const end={x:rest.x+(294-rest.x)*fraction,y:rest.y+(level.y-rest.y)*fraction};const dx=end.x-pivot.x,dy=end.y-pivot.y,len=Math.hypot(dx,dy),nx=-dy/len*7,ny=dx/len*7;const point=(p,x,y)=>{p.setAttribute('x1',x);p.setAttribute('y1',y)};const line=(id,a,b)=>{const el=$(id);point(el,a.x,a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)};line('ladder-left',{x:pivot.x+nx,y:pivot.y+ny},{x:end.x+nx,y:end.y+ny});line('ladder-right',{x:pivot.x-nx,y:pivot.y-ny},{x:end.x-nx,y:end.y-ny});line('ladder-center',pivot,end);$('rungs').innerHTML=Array.from({length:Math.max(3,Math.floor(len/21))},(_,i)=>{const t=(i+1)/(Math.max(3,Math.floor(len/21))+1),x=pivot.x+dx*t,y=pivot.y+dy*t;return `<line x1="${x+nx}" y1="${y+ny}" x2="${x-nx}" y2="${y-ny}"/>`}).join('');$('target-window').classList.toggle('ready',fraction===1);$('landing').style.opacity=fraction===1?'1':'.35'}
function state(){progress.textContent=`${round+1} / 3　はしご ${step} / ${levels[round].need}`;up.disabled=busy||step>=levels[round].need;help.disabled=busy||step<levels[round].need;up.classList.toggle('cue',!up.disabled);help.classList.toggle('cue',!help.disabled);hint.textContent=step<levels[round].need?'みぎうえの まどへ はしごを のばそう':'まどに とどいた！ たすけよう！'}
function draw(){scene.innerHTML=sceneMarkup();updateLadder();state()}
function start(){token++;NoriVoice.stop();busy=false;step=0;draw();say(round===0?'ひだりの はしごしゃから、みぎうえの まどへ はしごを のばそう。とどいたら たすけるを おしてね。':'みぎの まどへ はしごを のばして たすけよう。')}
up.onclick=async()=>{if(busy||up.disabled)return;busy=true;up.disabled=true;help.disabled=true;audio();step++;notes([520,690],.023);updateLadder();await say(step>=levels[round].need?'まどに とどいた！ たすけるを おしてね。':'いいね。まどに むかって もういちど のばそう。');busy=false;state()};
help.onclick=async()=>{if(busy||help.disabled)return;busy=true;up.disabled=help.disabled=true;notes([523,659,784]);$('person').style.opacity='0';$('rescued').classList.add('visible');const t=++token;await say('たすけられた！ やったね！');if(t!==token)return;setTimeout(()=>{if(t!==token)return;round++;if(round<levels.length)start();else finish()},450)};
function finish(){token++;notes([523,659,784,1047],.04);scene.innerHTML='<div class="overlay"><h2>みんな たすけたね！ 🎉</h2><p>はしごしゃ だいかつやく！</p><button id="again">もういちど</button><button class="secondary" id="home2">おうちへ</button></div>';up.disabled=help.disabled=true;hint.textContent='';say('みんな たすけたね！ すごい！');$('again').onclick=()=>{round=0;start()};$('home2').onclick=()=>location.href='../../index.html'}
$('repeat').onclick=()=>{audio();say(step<levels[round]?.need?'みぎうえの まどへ はしごを のばしてね。':'たすけるを おしてね。')};
scene.addEventListener('click',e=>{if(e.target===scene&&!busy)say('したの ひかる ボタンを おしてね。')});
scene.innerHTML='<div class="overlay"><h2>はしごしゃ たすけよう</h2><p>ひだりの はしごしゃから、みぎの まどへ はしごを のばそう！</p><button id="begin">▶️ はじめる</button></div>';up.disabled=help.disabled=true;$('begin').onclick=()=>{audio();start()};
})();</script></body></html>
