<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>はしごしゃ たすけよう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef6f2;color:#17324a;touch-action:manipulation}main{height:100%;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between}header a,header button{width:48px;height:48px;border:0;border-radius:16px;background:#fff;color:#17324a;font-size:23px;text-decoration:none;display:grid;place-items:center;box-shadow:0 3px #bfd0ca}h1{font-size:19px;margin:0}.progress,.hint{text-align:center;font-weight:900}.progress{font-size:14px}.hint{font-size:21px;min-height:31px;margin:0}.scene{position:relative;flex:1;min-height:0;border-radius:25px;overflow:hidden;background:linear-gradient(#bde5f5 0 64%,#8bc783 64%);box-shadow:inset 0 0 0 3px #fff}.building{position:absolute;right:5%;bottom:17%;width:39%;height:67%;background:#e9c78e;border:4px solid #a57c52;border-radius:9px}.window{position:absolute;right:11%;width:21%;height:14%;background:#9bd7e8;border:4px solid #fff;border-radius:7px;display:grid;place-items:center;font-size:29px;transition:.25s}.window.glow{box-shadow:0 0 24px 10px #ffe56d;animation:pulse .8s infinite}.truck{position:absolute;left:5%;bottom:8%;width:44%;height:18%;background:#e96352;border:4px solid #8b3f38;border-radius:16px 28px 9px 9px}.truck:before{content:'🚒';position:absolute;font-size:54px;left:12%;top:-8px}.ladder{position:absolute;left:31%;bottom:22%;width:12px;height:36%;background:#dfe6e8;border:3px solid #6e7f86;border-radius:8px;transform-origin:bottom center;transition:transform .45s,height .45s}.ladder:after{content:'';position:absolute;inset:4px -7px;border-left:3px solid #6e7f86;border-right:3px solid #6e7f86}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{min-height:76px;border:0;border-radius:23px;font-size:25px;font-weight:1000;color:#17324a;box-shadow:0 6px #b7c9c5}.up{background:#ffd86b}.help{background:#8ed9a8}.controls button:disabled{opacity:.45}.cue{animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.08)}}.star{position:absolute;font-size:30px;animation:fly .8s forwards;pointer-events:none}@keyframes fly{to{opacity:0;transform:translateY(-90px) scale(1.5)}}.overlay{position:absolute;inset:0;background:#eef6f2f3;z-index:10;display:grid;place-content:center;text-align:center;padding:25px;gap:12px}.overlay h2{font-size:31px;margin:0}.overlay p{font-size:20px;font-weight:800;line-height:1.5;margin:0}.overlay button{min-height:62px;border:0;border-radius:21px;background:#8ed9a8;font-size:20px;font-weight:900}.overlay .secondary{background:#fff}@media(max-width:360px){h1{font-size:17px}.controls button{min-height:68px;font-size:22px}.window{font-size:25px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうち">⌂</a><h1>はしごしゃ たすけよう</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><section class="scene" id="scene"></section><p class="hint" id="hint"></p><div class="controls" id="controls"><button class="up" id="up">⬆️ はしご</button><button class="help" id="help">🤝 たすける</button></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),hint=$('hint'),progress=$('progress'),up=$('up'),help=$('help');let round=0,step=0,busy=false,ctx;const cfg=[{top:58,need:1},{top:38,need:2},{top:18,need:3}];function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}function notes(fs,vol=.045){audio();if(!ctx)return;fs.forEach((f,i)=>{const t=ctx.currentTime+i*.09,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}function say(t){hint.textContent=t.replaceAll('。','');return NoriVoice.speak(t)}function draw(){const c=cfg[round];scene.innerHTML=`<div class="building"><div class="window glow" style="top:${c.top}%">👋</div></div><div class="truck"></div><div class="ladder" id="ladder"></div>`;const ladder=$('ladder');ladder.style.height=(28+step*12)+'%';ladder.style.transform=`rotate(${step?-(12+step*7):0}deg)`}function state(){progress.textContent=`${round+1} / 3`;up.disabled=step>=cfg[round].need;help.disabled=step<cfg[round].need;up.classList.toggle('cue',!up.disabled);help.classList.toggle('cue',!help.disabled);hint.textContent=step<cfg[round].need?'はしごを のばそう！':'とどいた！ たすけよう！'}function start(){busy=false;step=0;draw();state();say(round===0?'はしごを おして のばしてね。とどいたら、たすけるを おそう。':'はしごを のばして、たすけに いこう。')}function burst(){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(38+Math.random()*30)+'%';s.style.top=(28+Math.random()*35)+'%';scene.append(s);setTimeout(()=>s.remove(),850)}}up.onclick=()=>{if(busy||up.disabled)return;audio();step++;notes([520,690],.035);draw();state();say(step>=cfg[round].need?'とどいた！ たすけるを おしてね。':'いいね。もういちど はしご！')};help.onclick=async()=>{if(busy||help.disabled)return;busy=true;notes([523,659,784]);burst();scene.querySelector('.window').textContent='😊';hint.textContent='たすけられた！ ★';await say('たすけられた！ やったね！');setTimeout(()=>{round++;round<cfg.length?start():finish()},450)};function finish(){notes([523,659,784,1047],.05);scene.innerHTML='<div class="overlay"><h2>みんな たすけたね！ 🎉</h2><p>はしごしゃ だいかつやく！</p><button id="again">もういちど</button><button class="secondary" id="home2">おうちへ</button></div>';up.disabled=help.disabled=true;hint.textContent='';say('みんな たすけたね！ すごい！');$('again').onclick=()=>{round=0;start()};$('home2').onclick=()=>location.href='../../index.html'}$('repeat').onclick=()=>say(step<cfg[round]?.need?'はしごを のばしてね。':'たすけるを おしてね。');scene.addEventListener('click',e=>{if(e.target===scene&&!busy){notes([280],.025);say('したの ひかる ボタンを おしてね。')}});start()})();</script></body></html>
