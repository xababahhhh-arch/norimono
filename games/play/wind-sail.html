<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>かぜで ふねを すすめよう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#e8f5ff;color:#17324a;font-family:system-ui,-apple-system,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}a,.repeat{background:white;border:0;border-radius:12px;padding:12px;font-size:21px;color:inherit;text-decoration:none}h1{font-size:19px;margin:0;text-align:center}.progress{text-align:center;font-weight:800}.scene{flex:1;min-height:140px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#a5ddf8 0 58%,#56b7e2 58%)}.wind{position:absolute;top:10%;width:100%;text-align:center;font-size:clamp(35px,13vw,65px);font-weight:900}.boat{position:absolute;left:10%;bottom:15%;font-size:clamp(60px,22vw,110px);transition:left .7s}.goal{position:absolute;right:6%;bottom:16%;font-size:48px}.hint{text-align:center;font-size:20px;font-weight:900;min-height:30px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls button,.overlay button{border:0;border-radius:20px;background:#ffdf7a;color:#17324a;min-height:78px;font-size:24px;font-weight:900;box-shadow:0 5px #cfb463;touch-action:manipulation}.controls button:last-child{background:#a4e6b5;box-shadow:0 5px #7bb98a}.controls button:disabled{opacity:.5}.overlay{position:absolute;inset:0;z-index:5;background:#e8f5fff5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center}.overlay h2{font-size:28px;margin:0}.overlay p{font-size:19px;font-weight:800}.overlay button{min-height:58px;padding:0 24px}.spark{position:absolute;font-size:36px;animation:fly .8s forwards}@keyframes fly{to{transform:translateY(-80px);opacity:0}}@media(max-height:560px){.controls button{min-height:60px}.scene{min-height:100px}.hint{font-size:17px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうちへ">⌂</a><h1>⛵ かぜで すすめよう</h1><button class="repeat" id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><div class="scene" id="scene"><div class="wind" id="wind"></div><div class="boat" id="boat">⛵</div><div class="goal">🏝️</div></div><div class="hint" id="hint"></div><div class="controls"><button id="left">⬅️ ひだり</button><button id="right">みぎ ➡️</button></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),wind=$('wind'),boat=$('boat'),hint=$('hint'),left=$('left'),right=$('right');let round=0,busy=false,voiceSeq=0,ctx;const directions=[1,-1,1];function tone(freqs,vol=.035){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();freqs.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.19)})}catch{}}async function speak(s){const n=++voiceSeq;hint.textContent=s;try{if(window.NoriVoice?.speak)await NoriVoice.speak(s);else if('speechSynthesis'in window){speechSynthesis.cancel();await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.85;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}}catch{}return n===voiceSeq}function render(){busy=false;left.disabled=right.disabled=false;boat.style.left='10%';$('progress').textContent=(round+1)+' / 3';wind.textContent=(directions[round]===1?'➡️':'⬅️')+' 💨';speak(round===0?'かぜは みぎ！ みぎを おしてね。':round===1?'かぜは ひだり！ ひだりを おしてね。':'かぜの むきを みて おしてね。')}function sparkle(){for(let i=0;i<7;i++){let s=document.createElement('span');s.className='spark';s.textContent='⭐';s.style.left=(20+Math.random()*60)+'%';s.style.top=(25+Math.random()*45)+'%';scene.append(s);setTimeout(()=>s.remove(),850)}}async function choose(dir){if(busy)return;busy=true;left.disabled=right.disabled=true;if(dir!==directions[round]){tone([330,290],.018);await speak('おしい！ かぜの やじるしを みてね。');busy=false;left.disabled=right.disabled=false;return}tone([523,659,784]);boat.style.left='57%';sparkle();await speak('せいかい！ ふねが すすんだ！');setTimeout(()=>{round++;if(round<3)render();else finish()},600)}function finish(){tone([523,659,784,1047]);left.disabled=right.disabled=true;scene.insertAdjacentHTML('beforeend','<div class="overlay"><h2>🎉 しまに ついたよ！</h2><p>かぜを よめたね！</p><button id="again">もういちど</button><button id="home">おうちへ</button></div>');speak('しまに ついたよ！ やったね！');$('again').onclick=()=>{scene.querySelector('.overlay').remove();round=0;directions[0]=Math.random()<.5?1:-1;directions[1]=-directions[0];directions[2]=Math.random()<.5?1:-1;render()};$('home').onclick=()=>location.href='../../index.html'}left.onclick=()=>choose(-1);right.onclick=()=>choose(1);$('repeat').onclick=()=>speak('かぜは '+(directions[round]===1?'みぎ':'ひだり')+'に ふいているよ。');render()})();</script></body></html>
