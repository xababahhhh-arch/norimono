<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>でんしゃ ドアしめ</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef5f7;color:#17324a;overflow:hidden}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);gap:8px}.top{display:flex;align-items:center;justify-content:space-between}.home,.repeat{width:48px;height:48px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #bfd0ca;text-decoration:none;color:#17324a;display:grid;place-items:center;font-size:24px}.title{font-size:20px;font-weight:900}.progress,.msg{text-align:center;font-weight:900}.progress{font-size:14px}.msg{height:34px;font-size:20px}.scene{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#bde5f5 0 52%,#b9d39b 52% 62%,#777 62% 78%,#d9d4c6 78%);box-shadow:inset 0 0 0 3px #fff}.cloud{position:absolute;top:9%;left:12%;width:74px;height:25px;border-radius:30px;background:#fff9}.cloud:after{content:'';position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;left:19px;top:-15px}.train{position:absolute;left:5%;right:5%;top:38%;height:37%;border-radius:28px 45px 12px 12px;background:#f8f5e8;border:4px solid #35515c33;box-shadow:0 7px 0 #52656c}.stripe{position:absolute;left:0;right:0;bottom:17%;height:12%;background:#6b9f98}.window{position:absolute;top:13%;width:15%;height:25%;border-radius:7px;background:#9fd5e4;border:3px solid #52727d}.w1{left:8%}.w2{left:30%}.w3{left:52%}.w4{left:74%}.door{position:absolute;top:43%;width:16%;height:49%;border:4px solid #60747a;border-radius:7px;background:#e8eadf;overflow:hidden;touch-action:manipulation}.door:before,.door:after{content:'';position:absolute;top:0;bottom:0;width:50%;background:#e9e5d6;border:2px solid #8a9898;transition:transform .35s}.door:before{left:0}.door:after{right:0}.door.open:before{transform:translateX(-88%)}.door.open:after{transform:translateX(88%)}.door.open{background:#37434a;box-shadow:0 0 22px 8px #ffe477}.door.closed{box-shadow:0 0 0 4px #79d391}.d1{left:18%}.d2{left:42%}.d3{left:66%}.finger{position:absolute;font-size:38px;z-index:4;animation:tap 1s infinite;pointer-events:none}@keyframes tap{50%{transform:translateY(8px) scale(.9)}}.wheels{position:absolute;left:10%;right:10%;bottom:-10px;display:flex;justify-content:space-between}.wheel{width:28px;height:28px;border-radius:50%;background:#263e50;border:7px solid #aab9ba}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:30px;animation:fly .8s forwards}@keyframes fly{to{opacity:0;transform:translateY(-90px) scale(1.4)}}.finish{position:absolute;inset:0;background:#eef6f2f2;display:none;place-items:center;text-align:center;padding:28px;z-index:8}.finish.show{display:grid}.finish h2{font-size:34px;margin:0 0 12px}.again{border:0;border-radius:22px;padding:18px 28px;background:#66bd82;color:#fff;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #3d8d57}@media(max-width:360px){.title{font-size:18px}.door{width:18%}.d1{left:16%}.d2{left:41%}.d3{left:66%}}</style></head><body><main class="app"><div class="top"><a class="home" href="../../index.html" aria-label="ホーム">⌂</a><div class="title">でんしゃ ドアしめ</div><button class="repeat" id="repeat" aria-label="もういちどきく">🔊</button></div><div class="progress" id="progress">1 / 5</div><section class="scene"><div class="cloud"></div><div class="train"><div class="stripe"></div><i class="window w1"></i><i class="window w2"></i><i class="window w3"></i><i class="window w4"></i><button class="door d1" data-i="0" aria-label="ドア1"></button><button class="door d2" data-i="1" aria-label="ドア2"></button><button class="door d3" data-i="2" aria-label="ドア3"></button><div class="wheels"><i class="wheel"></i><i class="wheel"></i><i class="wheel"></i></div></div><div class="finger" id="finger">👇</div><div class="stars" id="stars"></div><div class="finish" id="finish"><div><h2>しゅっぱつ！ 🚆</h2><p>ぜんぶ しめられたね！</p><button class="again" id="again">もういちど</button></div></div></section><div class="msg" id="msg">ひかる ドアを タッチ！</div></main><script>(()=>{'use strict';const doors=[...document.querySelectorAll('.door')],msg=document.getElementById('msg'),progress=document.getElementById('progress'),finger=document.getElementById('finger'),stars=document.getElementById('stars');let round=0,need=new Set(),locked=false,audio=null;const counts=[1,1,2,2,3];function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.1,delay=0,v=.045){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}function ok(){tone(523,.08);tone(659,.11,.08)}function fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.16,i*.11,.055))}function speak(t,done){if(!('speechSynthesis'in window)){setTimeout(done||(()=>{}),500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.88;u.pitch=1.1;u.volume=.78;u.onend=()=>setTimeout(done||(()=>{}),250);u.onerror=()=>setTimeout(done||(()=>{}),250);speechSynthesis.speak(u)}function burst(i){const r=doors[i].getBoundingClientRect(),s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(r.left+r.width/2-15)+'px';s.style.top=(r.top-25)+'px';stars.appendChild(s);setTimeout(()=>s.remove(),850)}function setup(){locked=false;need.clear();doors.forEach(d=>d.className=d.className.replace(/ open| closed/g,''));const ids=[0,1,2].sort(()=>Math.random()-.5).slice(0,counts[round]);ids.forEach(i=>{need.add(i);doors[i].classList.add('open')});progress.textContent=`${round+1} / 5`;msg.textContent=round<2?'ひかる ドアを タッチ！':'あいている ドアを ぜんぶ しめよう';finger.style.display=round===0?'block':'none';if(round===0){const d=doors[ids[0]];finger.style.left=`calc(${d.offsetLeft+d.offsetWidth/2}px - 18px)`;finger.style.top='66%';speak('あいている ドアを タッチして、しめてね。')}}function tap(i){if(locked)return;ac();if(!need.has(i)){tone(300,.09);msg.textContent='そこは しまってるよ';speak('そこは しまってるよ');return}need.delete(i);doors[i].classList.remove('open');doors[i].classList.add('closed');finger.style.display='none';ok();burst(i);msg.textContent='しめられた！ ★';if(need.size)return speak('しめられた！ つぎの ドアは どこかな');locked=true;speak('ぜんぶ しまったよ。しゅっぱつ！',()=>setTimeout(()=>{round++;if(round===5){fanfare();document.getElementById('finish').classList.add('show');speak('ぜんぶ できた！ しゅっぱつ しんこう！')}else setup()},350))}doors.forEach(d=>d.onclick=()=>tap(+d.dataset.i));document.getElementById('repeat').onclick=()=>{ac();speak(need.size>1?'あいている ドアを ぜんぶ タッチしてね':'あいている ドアを タッチしてね')};document.getElementById('again').onclick=()=>{document.getElementById('finish').classList.remove('show');round=0;setup()};setup()})();</script></body></html>
