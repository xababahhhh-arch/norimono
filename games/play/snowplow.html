<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ゆきかきしゃ みちを ひらこう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#e8f6ff;color:#153750}main{height:100dvh;display:flex;flex-direction:column;gap:9px;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px)}header{display:flex;justify-content:space-between;align-items:center;gap:6px}header a,header button{border:0;border-radius:14px;background:white;padding:10px;font-size:23px;text-decoration:none;color:inherit;min-width:48px;min-height:48px}h1{font-size:18px;margin:0;text-align:center}.progress,.hint{text-align:center;font-weight:900}.hint{font-size:21px;min-height:35px}.scene{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(#a5dfff 0 58%,#d8f1ff 58%)}.sun{position:absolute;top:9%;right:10%;font-size:48px}.road{position:absolute;left:0;right:0;bottom:12%;height:33%;background:#6d7b8b;border-top:6px solid #e5eaf0;border-bottom:6px solid #e5eaf0;display:flex;align-items:center;justify-content:space-around}.road:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:5px dashed #fff9}.snow{position:relative;z-index:2;border:3px solid #b1d6ec;background:#fff;border-radius:26px;min-width:0;width:29%;height:85%;font-size:clamp(32px,12vw,54px);box-shadow:0 5px #8bbdd6;touch-action:manipulation;animation:pulse 1.2s infinite}.snow:active{transform:scale(.95)}.snow.done{animation:none;opacity:0;pointer-events:none;transition:opacity .35s}.truck{position:absolute;left:5%;bottom:45%;font-size:clamp(62px,23vw,100px);filter:drop-shadow(0 5px 1px #91afc3)}.truck:after{content:'❄️';font-size:22px}.star{position:absolute;z-index:4;font-size:34px;animation:fly .8s forwards;pointer-events:none}@keyframes fly{to{opacity:0;transform:translateY(-75px)}}@keyframes pulse{50%{filter:brightness(.93);transform:scale(1.04)}}.overlay{position:absolute;inset:0;z-index:10;background:#e8f6fff5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center;padding:15px}.overlay h2{font-size:29px}.overlay button{border:0;border-radius:18px;background:#ffda75;min-height:60px;padding:10px 20px;font-size:22px;font-weight:900}.overlay button:last-child{background:white}.foot{text-align:center;font-size:15px;font-weight:800;min-height:20px}@media(max-height:570px){.truck{bottom:46%;font-size:60px}.snow{height:90%}.hint{font-size:18px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうち">⌂</a><h1>🚜 ゆきかきしゃ</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><section class="scene" id="scene"><div class="sun">☀️</div><div class="truck">🚜</div><div class="road" id="road"></div></section><div class="hint" id="hint"></div><div class="foot">❄️ を タッチして みちを ひらこう</div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),scene=$('scene'),road=$('road'),hint=$('hint');let round=0,left=0,busy=false,seq=0,ctx;const total=3;function sound(notes,volume=.03){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.11;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch{}}function speak(text){const token=++seq;hint.textContent=text;return new Promise(resolve=>{if(!('speechSynthesis'in window)){resolve();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.83;u.volume=.75;let done=false;const finish=()=>{if(!done){done=true;resolve()}};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,4500)}).then(()=>token===seq)}function stars(x,y){for(let i=0;i<5;i++){const el=document.createElement('span');el.className='star';el.textContent='⭐';el.style.left=(x+(Math.random()-.5)*80)+'px';el.style.top=(y+(Math.random()-.5)*60)+'px';scene.append(el);setTimeout(()=>el.remove(),850)}}function start(){busy=false;left=round+1;$('progress').textContent=(round+1)+' / '+total;road.innerHTML='';const slots=[0,1,2].sort(()=>Math.random()-.5).slice(0,left).sort((a,b)=>a-b);for(let i=0;i<3;i++){const slot=document.createElement('div');slot.style.cssText='width:29%;height:85%;display:grid;place-items:center;position:relative;z-index:2';if(slots.includes(i)){const b=document.createElement('button');b.className='snow';b.textContent='❄️';b.setAttribute('aria-label','ゆきを どかす');b.style.width='100%';b.onclick=()=>clear(b);slot.append(b)}road.append(slot)}speak(round===0?'ゆきを タッチして、みちを あけよう！':'ゆきを '+left+'こ どかそう！')}async function clear(b){if(busy||b.disabled)return;busy=true;b.disabled=true;b.classList.add('done');left--;sound([523,659],.027);const r=b.getBoundingClientRect(),s=scene.getBoundingClientRect();stars(r.left-s.left+r.width/2,r.top-s.top+r.height/2);if(left){await speak('やった！ あと '+left+'こ！');busy=false}else{sound([659,784,988],.03);await speak('みちが あいた！ やったね！');setTimeout(()=>{round++;if(round<total)start();else finish()},500)}}function finish(){sound([523,659,784,1047],.035);scene.insertAdjacentHTML('beforeend','<div class="overlay"><h2>🎉 ぜんぶ ピカピカ！</h2><div style="font-size:72px">🚜✨</div><button id="again">もういちど</button><button id="home">おうちへ</button></div>');speak('ぜんぶの みちが あいたよ！ すごい！');$('again').onclick=()=>{scene.querySelector('.overlay').remove();round=0;start()};$('home').onclick=()=>location.href='../../index.html'}$('repeat').onclick=()=>{if(round<total)speak('しろい ゆきを タッチしてね！')};start()})();</script></body></html>
