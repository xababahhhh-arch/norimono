<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#e8f4ff"><title>クレーンで つりあげよう</title><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#e8f4ff;color:#17324a;touch-action:manipulation}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{height:100%;display:flex;flex-direction:column}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:7px 10px}header a,header button{width:48px;height:44px;border:0;border-radius:15px;background:#fff;color:#17324a;font-size:22px;font-weight:900;box-shadow:0 3px 0 #aac5d2;text-decoration:none;display:grid;place-items:center}h1{font-size:19px;margin:0}.progress{height:18px;display:flex;justify-content:center;gap:8px}.progress i{width:11px;height:11px;border-radius:50%;background:#fff}.progress i.on{background:#57a86b}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#9edcf5 0 62%,#d6bd8b 62%)}.beam{position:absolute;left:4%;right:4%;top:10%;height:16px;background:#f1c94b;border:3px solid #8c6c22;border-radius:6px}.hook{position:absolute;top:12%;left:8%;width:54px;height:46%;transform:translateX(-50%);will-change:left}.hook:before{content:"";position:absolute;left:25px;top:0;width:5px;height:78%;background:#4f5962}.hook:after{content:"J";position:absolute;left:16px;bottom:0;font:bold 43px Arial;color:#4f5962;transform:rotate(8deg)}.target{position:absolute;bottom:12%;width:28%;height:24%;display:grid;place-items:end center}.target svg{width:100%;height:100%}.mark{position:absolute;bottom:8%;width:32%;height:9px;border-radius:50%;background:#ffe45e;box-shadow:0 0 18px #ffe45e}.hint{text-align:center;font-size:18px;font-weight:900;min-height:32px;margin:5px}.controls{height:104px;padding:9px 14px;background:#f8fbfd}.controls button{width:100%;height:82px;border:0;border-radius:27px;background:#ffd35f;color:#17324a;font-size:27px;font-weight:900;box-shadow:0 6px 0 #c69f38}.controls button:active{transform:translateY(4px);box-shadow:0 2px 0 #c69f38}.overlay{position:absolute;inset:0;z-index:20;background:#f8fbfdf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px;text-align:center}.overlay h2{font-size:28px;margin:0}.overlay p{font-size:18px;font-weight:800;line-height:1.55;margin:0}.overlay button{width:min(310px,90%);min-height:60px;border:0;border-radius:22px;font-size:18px;font-weight:900;background:#7dc8e8;color:#17324a;box-shadow:0 5px 0 #609bb5}.overlay button.secondary{background:#e5ecef}.finger{font-size:42px;animation:bob .75s infinite alternate}@keyframes bob{to{transform:translateY(8px)}}.star{position:absolute;z-index:15;font-size:30px;animation:pop .8s forwards}@keyframes pop{to{transform:translateY(-70px) scale(1.5);opacity:0}}@media(max-height:620px){header{height:48px}.controls{height:88px}.controls button{height:68px}.overlay{gap:8px}.overlay h2{font-size:24px}.overlay p{font-size:16px}}</style></head><body><main><header><a href="../../learning.html" aria-label="おうちへ">⌂</a><h1>クレーンで つりあげよう</h1><button id="repeat" aria-label="もういちど きく">♪</button></header><div class="progress" id="progress"></div><section class="stage" id="stage"></section><p class="hint" id="hint"></p><div class="controls" id="controls"></div></main><script>const $=s=>document.querySelector(s),stage=$('#stage'),hint=$('#hint'),controls=$('#controls'),progress=$('#progress');let round=0,busy=false,ctx,timers=[],moveRAF=0,moveStart=0;const cfg=[{x:50,s:3.2,w:34},{x:35,s:2.7,w:27},{x:68,s:2.25,w:23}];function unlock(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}}function tone(ok=true,final=false){unlock();if(!ctx)return;(final?[523,659,784,1047]:ok?[660,880]:[280]).forEach((f,i)=>{const t=ctx.currentTime+i*.1,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(ok?.065:.03,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}function say(t){NoriVoice.stop();return NoriVoice.speak(t)}function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t)}function stopMove(){if(moveRAF)cancelAnimationFrame(moveRAF);moveRAF=0}function clear(){timers.forEach(clearTimeout);timers=[];stopMove();NoriVoice.stop()}function dots(){progress.innerHTML=cfg.map((_,i)=>`<i class="${i<=round?'on':''}"></i>`).join('')}function draw(){const c=cfg[round];stage.innerHTML=`<div class="beam"></div><div class="mark" style="left:${c.x-c.w/2}%"></div><div class="target" style="left:${c.x-14}%">${NoriVehicles.artwork('car')}</div><div class="hook" id="hook"></div>`;controls.innerHTML='<button id="lift">👆 つりあげる！</button>';$('#lift').onclick=lift;if(round===0){const f=document.createElement('div');f.className='finger';f.textContent='☝';f.style.cssText='position:absolute;right:18%;bottom:3%;z-index:12';stage.append(f)}}function startMove(){stopMove();moveStart=performance.now();const h=$('#hook'),c=cfg[round];function frame(now){if(busy||!h.isConnected)return;const cycle=c.s*1000*2,p=((now-moveStart)%cycle)/cycle,triangle=p<.5?p*2:(1-p)*2;h.style.left=(8+triangle*84)+'%';moveRAF=requestAnimationFrame(frame)}moveRAF=requestAnimationFrame(frame)}function start(){clear();busy=false;dots();draw();startMove();hint.textContent='クルマの うえで タッチ！';say('クレーンが クルマの うえに きたら、つりあげるを タッチしてね。')}function lift(){if(busy)return;unlock();const h=$('#hook'),t=stage.querySelector('.target'),hr=h.getBoundingClientRect(),tr=t.getBoundingClientRect(),hx=hr.left+hr.width/2,tx=tr.left+tr.width/2,tol=tr.width*(round===0?.72:round===1?.58:.48);if(Math.abs(hx-tx)>tol){tone(false);hint.textContent=hx<tx?'もうすこし みぎ！':'もうすこし ひだり！';say(hint.textContent);h.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(.9)'},{transform:'translateX(-50%) scale(1)'}],{duration:260});return}busy=true;stopMove();tone(true);hint.textContent='つれた！';for(let i=0;i<8;i++){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(35+Math.random()*30)+'%';s.style.top=(45+Math.random()*20)+'%';stage.append(s)}t.animate([{transform:'translateY(0)'},{transform:'translateY(-150px)'}],{duration:850,fill:'forwards',easing:'ease-out'});say('つれた！じょうず！');later(()=>{round++;round<cfg.length?start():finish()},1500)}function finish(){clear();tone(true,true);stage.innerHTML='<div class="overlay"><h2>ぜんぶ つれたね！</h2><p>クレーンの タイミング<br>ばっちり！</p><button id="again">↻ もういっかい</button><button class="secondary" id="home2">おうちへ</button></div>';controls.innerHTML='';hint.textContent='';$('#again').onclick=()=>{unlock();round=0;start()};$('#home2').onclick=()=>location.href='../../learning.html';say('すごい！ぜんぶ つれたね！')}function intro(){dots();stage.innerHTML='<div class="overlay"><h2>クレーンで つりあげよう</h2><p>うごく クレーンが<br>クルマの うえに きたら タッチ！</p><div class="finger">☝</div><button id="listen">▷ せつめいを きく</button><button class="secondary" id="skip">≫ せつめいを スキップ</button></div>';controls.innerHTML='';$('#listen').onclick=async()=>{unlock();$('#listen').disabled=true;await say('うごく クレーンを みてね。クルマの うえに きたら、つりあげるを タッチしよう。');start()};$('#skip').onclick=()=>{unlock();start()}}$('#repeat').onclick=()=>{unlock();say(hint.textContent||'クレーンを よく みてね。')};addEventListener('pagehide',clear);intro();</script></body></html>
