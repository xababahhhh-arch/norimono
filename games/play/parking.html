<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ぴったり パーキング</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef6f2;color:#17324a;overflow:hidden}button,a{font:inherit;-webkit-tap-highlight-color:transparent}.app{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);gap:8px}.top{display:flex;align-items:center;justify-content:space-between}.home,.repeat{width:48px;height:48px;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #bfd0ca;text-decoration:none;color:#17324a;display:grid;place-items:center;font-size:24px}.title{font-size:20px;font-weight:900}.progress{text-align:center;font-weight:900;font-size:14px}.scene{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#bde5f5 0 38%,#8bc783 38% 57%,#69757a 57% 100%);box-shadow:inset 0 0 0 3px #fff}.cloud{position:absolute;top:8%;left:12%;width:70px;height:25px;border-radius:30px;background:#fff9}.cloud:after{content:'';position:absolute;width:34px;height:34px;border-radius:50%;background:#fff;left:18px;top:-15px}.roadline{position:absolute;left:0;right:0;top:78%;border-top:5px dashed #f5e5a4}.bay{position:absolute;top:59%;bottom:7%;border:5px solid #fff;border-radius:12px;background:#a8d7b766;box-shadow:0 0 0 5px #75d89a55;transition:.25s}.bay:after{content:'P';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:44px;opacity:.8}.bay.good{background:#8de6a5aa;box-shadow:0 0 28px 12px #ffe782}.car{position:absolute;top:68%;width:104px;height:55px;transform:translateX(-50%);transition:top .15s}.car svg{width:100%;height:100%;filter:drop-shadow(0 5px 2px #263e5040)}.finger{position:absolute;left:50%;bottom:2%;font-size:36px;animation:tap 1s infinite;pointer-events:none}.finger.hide{display:none}@keyframes tap{50%{transform:translateY(8px) scale(.9)}}.msg{height:34px;text-align:center;font-size:20px;font-weight:1000}.msg.ok{color:#158347;animation:pop .35s}.msg.retry{color:#a86622;animation:pop .35s}@keyframes pop{50%{transform:scale(1.14)}}.stop{height:72px;border:0;border-radius:24px;background:#ef6c5b;color:#fff;font-size:25px;font-weight:1000;box-shadow:0 6px 0 #b9473d}.stop:active{transform:translateY(4px);box-shadow:0 2px 0 #b9473d}.stop:disabled{opacity:.55}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:30px;animation:fly .8s forwards}@keyframes fly{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-100px) scale(1.4)}}.finish{position:absolute;inset:0;background:#eef6f2f2;display:none;place-items:center;text-align:center;padding:30px;z-index:5}.finish.show{display:grid}.finish h2{font-size:34px;margin:0 0 12px}.again{border:0;border-radius:22px;padding:18px 28px;background:#66bd82;color:#fff;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #3d8d57}@media(max-width:360px){.title{font-size:18px}.stop{height:66px}.car{width:92px}}</style></head><body><main class="app"><div class="top"><a class="home" href="../../index.html" aria-label="ホーム">⌂</a><div class="title">ぴったり パーキング</div><button class="repeat" id="repeat" aria-label="もういちどきく">🔊</button></div><div class="progress" id="progress">1 / 5</div><section class="scene" id="scene"><div class="cloud"></div><div class="roadline"></div><div class="bay" id="bay"></div><div class="car" id="car"><svg viewBox="0 0 180 90" aria-label="くるま"><path d="M12 64V51q0-12 17-16l27-5 20-22h45l24 23 23 7q8 3 8 13v13Z" fill="#e87856" stroke="#35515c" stroke-width="3"/><path d="M80 14h35l20 19H64Z" fill="#a4d9e7"/><circle cx="48" cy="66" r="15" fill="#263e50"/><circle cx="48" cy="66" r="7" fill="#b9cbd0"/><circle cx="139" cy="66" r="15" fill="#263e50"/><circle cx="139" cy="66" r="7" fill="#b9cbd0"/></svg></div><div class="finger" id="finger">👇</div><div class="stars" id="stars"></div><div class="finish" id="finish"><div><h2>できた！ 🎉</h2><p>ぜんぶ ぴったり！</p><button class="again" id="again">もういちど</button></div></div></section><div class="msg" id="msg">ひかる ところで とめよう</div><button class="stop" id="stop">🅿️ とめる！</button></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),car=$('car'),bay=$('bay'),stop=$('stop'),msg=$('msg'),progress=$('progress'),finger=$('finger'),stars=$('stars');let round=0,x=8,dir=1,last=0,playing=true,raf=0,audio=null;const rounds=[{w:38,s:17},{w:34,s:19},{w:29,s:22},{w:25,s:25},{w:22,s:28}];function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(freq,dur=.1,delay=0,vol=.055){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(vol,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur)}function okSound(){tone(523,.09);tone(659,.1,.09);tone(784,.16,.18)}function retrySound(){tone(330,.1);tone(294,.14,.11)}function fanfare(){[523,659,784,1047].forEach((n,i)=>tone(n,.18,i*.12,.06))}function speak(t,done){if(!('speechSynthesis'in window)){setTimeout(done||(()=>{}),450);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;u.pitch=1.12;u.volume=.8;u.onend=()=>setTimeout(done||(()=>{}),260);u.onerror=()=>setTimeout(done||(()=>{}),260);speechSynthesis.speak(u)}function setup(){const r=rounds[round],left=round<2?54-r.w/2:20+Math.random()*(60-r.w);bay.style.left=left+'%';bay.style.width=r.w+'%';bay.dataset.left=left;bay.classList.remove('good');x=round<2?8:(Math.random()<.5?8:88);dir=x<50?1:-1;car.style.left=x+'%';playing=true;stop.disabled=false;finger.classList.toggle('hide',round>0);msg.className='msg';msg.textContent=round===0?'ひかる ところで とめよう':'ぴったり とめよう！';progress.textContent=`${round+1} / ${rounds.length}`;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(move);if(round===0)speak('くるまが うごくよ。ひかる ところに きたら、とめるを おしてね。')}function move(t){if(!playing)return;const dt=Math.min(32,t-last);last=t;const speed=rounds[round].s;x+=dir*speed*dt/1000;if(x>92){x=92;dir=-1}else if(x<8){x=8;dir=1}car.style.left=x+'%';raf=requestAnimationFrame(move)}function burst(){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='★';s.style.left=(35+Math.random()*30)+'%';s.style.top=(50+Math.random()*25)+'%';stars.appendChild(s);setTimeout(()=>s.remove(),850)}}function press(){if(!playing)return;ac();playing=false;cancelAnimationFrame(raf);finger.classList.add('hide');const left=+bay.dataset.left,right=left+rounds[round].w,carLeft=x-8,carRight=x+8;const good=carLeft>=left-3&&carRight<=right+3;if(good){bay.classList.add('good');msg.className='msg ok';msg.textContent='ぴったり！ ★';okSound();burst();stop.disabled=true;speak('ぴったり！じょうず！',()=>setTimeout(()=>{round++;if(round>=rounds.length){fanfare();$('finish').classList.add('show');speak('ぜんぶ ぴったり！やったね！')}else setup()},350))}else{msg.className='msg retry';msg.textContent=x<left?'もうすこし まえ！':'すこし もどろう！';retrySound();speak(x<left?'もうすこし まえだよ':'すこし もどろう',()=>setTimeout(()=>{playing=true;stop.disabled=false;last=performance.now();raf=requestAnimationFrame(move)},300))}}stop.addEventListener('click',press);$('repeat').onclick=()=>{ac();speak(round===0?'ひかる ところに きたら、とめるを おしてね':'ひかる ところで、ぴったり とめよう')};$('again').onclick=()=>{$('finish').classList.remove('show');round=0;setup()};setup()})();</script></body></html>
