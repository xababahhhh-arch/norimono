<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ふねの バランス</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#17324a;background:#eaf6fc}main{height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}header a,header button{border:0;background:white;border-radius:14px;min-width:48px;height:48px;font-size:24px;display:grid;place-items:center;text-decoration:none;color:#17324a}h1{font-size:20px;margin:0}.progress{text-align:center;font-weight:900}.scene{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#a9e2fa 0 65%,#5eb6dc 65%);display:flex;align-items:center;justify-content:center;flex-direction:column}.sun{position:absolute;right:14%;top:9%;font-size:48px}.boat{width:min(94%,500px);height:170px;position:relative;margin-top:80px;transition:transform .35s}.deck{position:absolute;left:5%;right:5%;top:18px;height:100px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.hold{border:4px dashed #d8e8ed;border-radius:18px;background:#ffffffaa;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px;padding:7px;font-size:34px}.hull{position:absolute;bottom:0;left:0;right:0;height:60px;background:#d77855;border:5px solid #8b4c39;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}.mast{position:absolute;bottom:60px;left:49%;width:8px;height:115px;background:#8b6046;border-radius:5px}.hint{font-size:21px;font-weight:900;text-align:center;min-height:32px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls button{min-height:78px;border:0;border-radius:20px;font-size:23px;font-weight:900;box-shadow:0 5px #b7d3d9;background:#ffe19c;color:#17324a}.controls button:disabled{opacity:.5}.go{grid-column:1/-1;background:#a1e5ae!important;min-height:65px!important}.cue{animation:pulse .8s infinite}@keyframes pulse{50%{filter:brightness(1.09);transform:scale(1.025)}}.overlay{position:absolute;inset:0;background:#eaf6fcf5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center;padding:20px;z-index:2}.overlay h2{font-size:28px}.overlay button{background:#a1e5ae;border:0;border-radius:18px;padding:17px 26px;font-size:21px;font-weight:900}.star{position:absolute;font-size:34px;animation:fly .8s forwards}@keyframes fly{to{opacity:0;transform:translateY(-90px)}}@media(max-width:360px){h1{font-size:17px}.controls button{font-size:20px;min-height:65px}.hold{font-size:27px}.boat{height:155px}}</style></head><body><main><header><a href="../../index.html" aria-label="ゲームいちらん">⌂</a><h1>🚢 ふねの バランス</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div class="progress" id="progress"></div><section class="scene" id="scene"><div class="sun">☀️</div><div class="boat" id="boat"><div class="mast"></div><div class="deck"><div class="hold" id="left"></div><div class="hold" id="right"></div></div><div class="hull"></div></div></section><div class="hint" id="hint"></div><div class="controls"><button id="addLeft">👈 ひだり</button><button id="addRight">みぎ 👉</button><button class="go" id="go">🚢 しゅっぱつ！</button></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let round=0,left=0,right=0,busy=false,ctx,seq=0;const max=[1,2,3];function sound(fs,vol=.035){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();fs.forEach((f,i)=>{const t=ctx.currentTime+i*.1,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.18)})}catch{}}async function say(t){const n=++seq;try{await NoriVoice.speak(t)}catch{}return n===seq}function render(){const n=max[round];$('progress').textContent=(round+1)+' / 3';$('left').textContent='📦'.repeat(left);$('right').textContent='📦'.repeat(right);$('boat').style.transform='rotate('+Math.max(-9,Math.min(9,(right-left)*5))+'deg)';$('addLeft').disabled=busy||left>=n;$('addRight').disabled=busy||right>=n;$('go').disabled=busy||left!==n||right!==n;$('addLeft').classList.toggle('cue',!busy&&left<right);$('addRight').classList.toggle('cue',!busy&&right<left);$('go').classList.toggle('cue',!$('go').disabled);$('hint').textContent=left===n&&right===n?'ぴったり！ しゅっぱつ！':left===right?'りょうほうに はこを のせよう':'かたむいた！ すくない ほうに のせよう'}function start(){busy=false;left=right=0;render();say(round===0?'ひだりと みぎに、ひとつずつ はこを のせよう。':'ひだりと みぎを、おなじ かずに しよう。')}function add(side){if(busy)return;const n=max[round];if(side==='left'&&left<n)left++;else if(side==='right'&&right<n)right++;else return;sound([490,660],.025);render();if(left===n&&right===n)say('おなじ かず！ しゅっぱつを おしてね。');else if(left!==right)say('すくない ほうに はこを のせよう。')}function stars(){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(15+Math.random()*70)+'%';s.style.top=(20+Math.random()*50)+'%';$('scene').append(s);setTimeout(()=>s.remove(),850)}}async function finish(){sound([523,659,784,1047],.035);$('scene').insertAdjacentHTML('beforeend','<div class="overlay" id="overlay"><h2>🎉 だいせいこう！</h2><p>ふねが げんきに はしったよ！</p><button id="again">もういちど</button><button id="home">ゲームいちらんへ</button></div>');$('again').onclick=()=>{round=0;$('overlay').remove();start()};$('home').onclick=()=>location.href='../../index.html';say('だいせいこう！ また あそぼう！')}$('addLeft').onclick=()=>add('left');$('addRight').onclick=()=>add('right');$('go').onclick=async()=>{if(busy||left!==max[round]||right!==max[round])return;busy=true;render();sound([523,659,784]);stars();$('boat').style.transform='translateY(-8px)';$('hint').textContent='やったね！';await say('やったね！ しゅっぱつ！');setTimeout(()=>{round++;round<3?start():finish()},350)};$('repeat').onclick=()=>say('ひだりと みぎに おなじ かずの はこを のせよう。');start()})();</script></body></html>
