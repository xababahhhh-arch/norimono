<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>きゅうきゅうしゃの みちを あけよう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#eef8ff;color:#17334c}main{height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 12px);gap:10px}header{display:flex;justify-content:space-between;align-items:center;gap:5px}header a,header button{font-size:23px;background:white;border:0;border-radius:14px;padding:10px;min-width:46px;min-height:46px;text-decoration:none;color:inherit}h1{font-size:18px;text-align:center;margin:0}.progress{text-align:center;font-weight:800}.scene{flex:1;min-height:180px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#a8dcf7 0 35%,#8ccc87 35% 65%,#626e7b 65% 93%,#83c88b 93%)}.roadline{position:absolute;left:0;right:0;top:79%;border-top:4px dashed #fff8c2}.ambulance{position:absolute;left:2%;bottom:12%;font-size:clamp(46px,16vw,80px);transition:left .9s;z-index:2}.hospital{position:absolute;right:3%;top:26%;font-size:clamp(46px,16vw,78px)}.car{position:absolute;bottom:13%;width:20%;height:25%;border:3px solid #fff;border-radius:16px;background:#ffcb68;font-size:clamp(32px,12vw,60px);display:grid;place-items:center;transition:transform .45s,opacity .45s;box-shadow:0 4px 0 #384b5a;touch-action:manipulation}.car:focus-visible{outline:5px solid #ffd94d}.car.glow{animation:pulse .8s infinite}.car.cleared{transform:translateY(-150%) scale(.7);opacity:0;pointer-events:none}.hint{text-align:center;min-height:55px;font-size:21px;font-weight:900;display:grid;place-items:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button,.overlay button{border:0;border-radius:18px;min-height:65px;font-size:20px;font-weight:900;background:#ffe18a;color:#17334c}.actions button:last-child{background:#b0ebbd}.overlay{position:absolute;inset:0;background:#eff9fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;padding:20px;z-index:5}.overlay h2{font-size:28px;margin:0}.overlay button{padding:0 22px}.star{position:absolute;font-size:30px;animation:fly .8s forwards;pointer-events:none}@keyframes pulse{50%{filter:brightness(1.2);transform:scale(1.05)}}@keyframes fly{to{opacity:0;transform:translateY(-80px)}}@media(max-height:560px){.hint{min-height:36px;font-size:17px}.actions button{min-height:52px}.scene{min-height:120px}}</style></head><body><main><header><a href="../../index.html" aria-label="ゲームいちらん">⌂</a><h1>🚑 みちを あけよう</h1><button id="repeat" aria-label="もういちど きく">🔊</button></header><div id="progress" class="progress"></div><div id="scene" class="scene"></div><div id="hint" class="hint"></div><div class="actions"><button id="go">🚑 しゅっぱつ！</button><button id="retry">🔄 はじめから</button></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),scene=$('scene'),hint=$('hint'),go=$('go');let round=0,cleared=0,busy=false,seq=0,ctx;const cars=['🚗','🚙','🚕','🚐'];function sound(freqs,vol=.035){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();freqs.forEach((f,i)=>{const t=ctx.currentTime+i*.12,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}catch{}}async function say(s){const id=++seq;hint.textContent=s;try{if(window.NoriVoice?.speak)await NoriVoice.speak(s);else if('speechSynthesis'in window){speechSynthesis.cancel();await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.85;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}}catch{}return id===seq}function stars(){for(let i=0;i<7;i++){const el=document.createElement('span');el.className='star';el.textContent='⭐';el.style.left=(20+Math.random()*60)+'%';el.style.top=(35+Math.random()*30)+'%';scene.append(el);setTimeout(()=>el.remove(),900)}}function render(){busy=false;cleared=0;go.disabled=false;const count=round+1;scene.innerHTML='<div class="roadline"></div><div class="hospital">🏥</div><div class="ambulance" id="ambulance">🚑</div>';const chosen=[...cars].sort(()=>Math.random()-.5);for(let i=0;i<count;i++){const b=document.createElement('button');b.className='car'+(i===0?' glow':'');b.style.left=(27+i*20)+'%';b.textContent=chosen[i];b.setAttribute('aria-label','くるまを よける');b.onclick=()=>move(b);scene.append(b)}$('progress').textContent=(round+1)+' / 3';say('くるまを タッチして、みちを あけよう！')}async function move(b){if(busy||b.classList.contains('cleared'))return;busy=true;b.classList.add('cleared');sound([480,640],.025);cleared++;const rest=[...scene.querySelectorAll('.car:not(.cleared)')];rest.forEach((e,i)=>e.classList.toggle('glow',i===0));await say(rest.length?'いいね！ つぎの くるまを タッチ！':'みちが あいた！ しゅっぱつを おしてね！');busy=false}go.onclick=async()=>{if(busy)return;if(cleared<round+1){sound([300,270],.015);await say('まだ くるまが いるよ。タッチして よけよう！');return}busy=true;go.disabled=true;sound([523,659,784]);$('ambulance').style.left='74%';stars();await say('やったね！ きゅうきゅうしゃが とおれた！');setTimeout(()=>{round++;if(round<3)render();else finish()},950)};function finish(){sound([523,659,784,1047],.04);scene.insertAdjacentHTML('beforeend','<div class="overlay"><h2>🎉 みんな たすかった！</h2><button id="again">もういちど</button><button id="home">ゲームいちらんへ</button></div>');say('みんな たすかった！ ありがとう！');$('again').onclick=()=>{round=0;render()};$('home').onclick=()=>location.href='../../index.html'}$('repeat').onclick=()=>say(cleared<round+1?'くるまを タッチして みちを あけよう！':'しゅっぱつを おしてね！');$('retry').onclick=()=>{round=0;render()};render()})();</script></body></html>
