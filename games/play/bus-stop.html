<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>バスていで とまろう</title><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eaf6ff;color:#19364a;font-family:system-ui,"Hiragino Sans",sans-serif;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}header{display:flex;align-items:center;justify-content:space-between}a,.small{background:white;border:0;border-radius:14px;padding:12px;font-size:23px;text-decoration:none;color:inherit}h1{font-size:21px;margin:0}.status{text-align:center;font-size:19px;font-weight:900;min-height:50px}.scene{position:relative;flex:1;min-height:180px;border-radius:24px;overflow:hidden;background:linear-gradient(#bceaff 0 67%,#a4d48a 67% 78%,#626c78 78%);border:4px solid white}.sun{position:absolute;top:12%;right:12%;font-size:45px}.stop{position:absolute;left:70%;bottom:22%;font-size:56px;z-index:1}.target{position:absolute;left:64%;width:27%;bottom:8%;height:10%;background:#ffe86e88;border:4px dashed #ffe86e;border-radius:16px}.bus{position:absolute;left:0;bottom:14%;font-size:clamp(66px,19vw,104px);line-height:1;transform:translateX(-100%);will-change:transform;z-index:2}.controls{display:flex;flex-direction:column;gap:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}#stop{border:0;border-radius:25px;background:#ffce55;min-height:90px;font-size:32px;font-weight:900;box-shadow:0 6px #d6a83c}#stop:disabled{opacity:.55}#again{border:0;border-radius:18px;background:#b7e8cb;padding:14px;font-size:19px;font-weight:800}.overlay{position:absolute;inset:0;background:#eaf6ffef;display:grid;place-content:center;text-align:center;gap:14px;padding:20px;z-index:4}.overlay h2{font-size:29px}.overlay button{background:#ffce55;border:0;border-radius:20px;padding:20px;font-size:24px;font-weight:900}.stars{position:absolute;left:40%;top:20%;font-size:45px;animation:pop .65s infinite alternate;z-index:3}@keyframes pop{to{transform:scale(1.3)}}@media(max-height:620px){.status{min-height:30px}#stop{min-height:70px}.scene{min-height:130px}}</style></head><body><main><header><a href="../../index.html" aria-label="おうち">⌂</a><h1>🚌 バスていで とまろう</h1><button class="small" id="repeat" aria-label="もういちど きく">🔊</button></header><div class="status" id="status">バスていで とまろう！</div><section class="scene" id="scene"><span class="sun">☀️</span><div class="stop">🚏</div><div class="target"></div><div class="bus" id="bus">🚌</div><div class="overlay" id="overlay"><h2>🚏 バスていで とまろう</h2><p>バスが きいろい ばしょに きたら<br>「とまれ！」を おしてね</p><button id="begin">▶ はじめる</button></div></section><div class="controls"><button id="stop" disabled>✋ とまれ！</button><button id="again">🔁 もういちど</button></div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),bus=$('bus'),scene=$('scene'),stop=$('stop'),status=$('status'),overlay=$('overlay');let level=0,playing=false,x=0,last=0,frame=0,locked=false,ctx=null;const speeds=[.00019,.00023,.00027];function tone(fs){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();fs.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.11;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2)})}catch{}}function say(s){status.textContent=s;try{return Promise.resolve(NoriVoice.speak(s))}catch{return Promise.resolve()}}function pos(){const width=scene.clientWidth;bus.style.transform='translateX('+Math.round(x*width)+'px)'}function tick(t){if(!playing)return;if(last)x+=Math.min(t-last,50)*speeds[level];last=t;pos();if(x>1.2){playing=false;stop.disabled=true;retry('とおりすぎたね。もういちど！');return}frame=requestAnimationFrame(tick)}function run(){cancelAnimationFrame(frame);locked=false;playing=true;last=0;x=0;pos();stop.disabled=false;status.textContent=(level+1)+' / 3　🚏 とまれ！';frame=requestAnimationFrame(tick)}async function retry(message){locked=true;tone([340,310]);await say(message);setTimeout(()=>{if(locked)run()},750)}async function next(){locked=true;tone([523,659,784]);scene.insertAdjacentHTML('beforeend','<span class="stars" id="stars">⭐✨⭐</span>');await say('ぴったり！ やったね！');setTimeout(()=>{ $('stars')?.remove();level++;if(level===3){tone([523,659,784,1047]);overlay.hidden=false;overlay.innerHTML='<h2>🎉 ぜんぶ とまれた！</h2><p>バスの うんてん めいじん！</p><button id="finishAgain">もういちど</button>';overlay.style.display='grid';$('finishAgain').onclick=reset;say('ぜんぶ とまれた！ すごい！')}else run()},700)}stop.onclick=()=>{if(!playing||locked)return;playing=false;cancelAnimationFrame(frame);stop.disabled=true;const busCenter=x+0.13;if(busCenter>=.59&&busCenter<=.94)next();else retry(busCenter<.59?'まだ はやかったね。もういちど！':'ちょっと おそかったね。もういちど！')};function reset(){playing=false;cancelAnimationFrame(frame);level=0;x=0;pos();overlay.style.display='none';run()}$('begin').onclick=()=>{overlay.style.display='none';tone([440,550]);run()};$('again').onclick=reset;$('repeat').onclick=()=>say('バスが きいろい ばしょに きたら、とまれを おしてね。');window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));pos()})();</script></body></html>
