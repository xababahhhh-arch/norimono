<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おとで あてよう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(#ccecff 0 47%,#d9edbf 47%);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;justify-content:center}.count{font-weight:900;font-size:16px;background:#fff9;padding:6px 13px;border-radius:20px}.title{font-size:24px;font-weight:900;text-align:center}.speaker{width:112px;height:112px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 0 #0002;display:grid;place-items:center;font-size:58px;animation:pulse 1.4s ease-in-out infinite;touch-action:manipulation}.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}.speaker.play{outline:7px solid #ffd65c}@keyframes pulse{50%{transform:scale(1.04)}}.hint{font-size:14px;font-weight:800;background:#fff9;border-radius:16px;padding:5px 10px;min-height:27px}.choices{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:0;border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;padding:5px;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:manipulation}.card svg{width:100%;height:100%;max-height:125px}.card:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}.card.good{outline:7px solid #65d47b;animation:pop .45s}.card.bad{animation:shake .3s}.finger{position:absolute;right:8px;top:5px;font-size:34px;animation:tap 1s infinite}@keyframes tap{50%{transform:translateY(7px)}}@keyframes pop{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.fx{position:fixed;inset:0;pointer-events:none;z-index:20}.star{position:absolute;font-size:30px;animation:fly .7s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}.done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff9;backdrop-filter:blur(5px);z-index:30}.done.show{display:flex}.panel{text-align:center;background:white;padding:28px;border-radius:28px;box-shadow:0 10px 30px #0003}.panel b{font-size:30px}.panel button{margin-top:16px;border:0;border-radius:18px;padding:14px 24px;background:#65c77a;color:#fff;font:900 18px inherit}@media(max-width:380px){.app{gap:5px}.title{font-size:21px}.speaker{width:92px;height:92px;font-size:48px}.choices{gap:7px}.card svg{max-height:105px}}</style></head><body><main class="app"><div class="top"><span class="count" id="count">1 / 6</span></div><div class="title">どの のりものの おと？</div><button class="speaker" id="speaker" aria-label="おとを きく">🔊</button><div class="hint" id="hint">🔊を おして きいてね</div><div class="choices" id="choices"></div></main><div class="fx" id="fx"></div><div class="done" id="done"><div class="panel"><div style="font-size:58px">🎵⭐</div><b>ぜんぶ わかったね！</b><br><button id="again">もういちど</button></div></div><script>
const DATA={fire:{name:'しょうぼうしゃ',sound:'ウー、カンカンカン',tone:'fire'},ambulance:{name:'きゅうきゅうしゃ',sound:'ピーポー、ピーポー',tone:'ambulance'},police:{name:'パトカー',sound:'ウー、ウー',tone:'police'},train:{name:'でんしゃ',sound:'ガタンゴトン、ガタンゴトン',tone:'train'},bus:{name:'バス',sound:'ブーン、プシュー',tone:'bus'},garbage:{name:'ごみしゅうしゅうしゃ',sound:'ブーン、ガーッ',tone:'garbage'}};
let order=['ambulance','fire','train','bus','police','garbage'],q=0,busy=false,ctx=null,speechTimer=null;
function art(k){if(k==='ambulance')return `<svg viewBox="0 0 260 125"><path d="M22 96V45q0-15 15-15h105q14 0 24 13l18 23h42q15 0 15 15v15z" fill="#fff" stroke="#435865" stroke-width="4"/><path d="M24 73h215" stroke="#e74c48" stroke-width="9"/><rect x="49" y="40" width="70" height="25" rx="4" fill="#bfe7fa"/><path d="M145 46v28M131 60h28" stroke="#e74c48" stroke-width="8"/><rect x="84" y="19" width="32" height="10" rx="5" fill="#ef5a55"/><rect x="120" y="19" width="32" height="10" rx="5" fill="#6aa9d5"/>${w(63)}${w(205)}</svg>`;if(k==='fire')return `<svg viewBox="0 0 260 125"><path d="M24 96V50h91l25 18h95v28z" fill="#e84640" stroke="#633" stroke-width="4"/><rect x="42" y="56" width="46" height="22" fill="#bfe7fa"/><rect x="120" y="27" width="110" height="10" rx="5" fill="#e8ecef" stroke="#59636b" stroke-width="3" transform="rotate(-7 120 27)"/><line x1="143" y1="27" x2="145" y2="42" stroke="#59636b" stroke-width="3"/><line x1="171" y1="24" x2="173" y2="39" stroke="#59636b" stroke-width="3"/><line x1="199" y1="21" x2="201" y2="36" stroke="#59636b" stroke-width="3"/>${w(66)}${w(205)}</svg>`;if(k==='police')return `<svg viewBox="0 0 260 125"><path d="M25 96V66h39l27-30h79l29 30h35q14 0 14 14v16z" fill="#fff" stroke="#394c59" stroke-width="4"/><path d="M30 73h211" stroke="#222f38" stroke-width="12"/><path d="M75 65l22-23h30v23zM134 42h29l22 23h-51z" fill="#bfe7fa"/><rect x="111" y="23" width="34" height="10" rx="5" fill="#e95050"/>${w(69)}${w(203)}</svg>`;if(k==='train')return `<svg viewBox="0 0 260 125"><path d="M30 96V28q0-15 15-15h168q17 0 17 17v66z" fill="#e9eef1" stroke="#425762" stroke-width="4"/><rect x="47" y="28" width="42" height="34" rx="4" fill="#9fd3ed"/><rect x="98" y="28" width="42" height="34" rx="4" fill="#9fd3ed"/><rect x="149" y="28" width="42" height="34" rx="4" fill="#9fd3ed"/><path d="M31 70h198" stroke="#4b9dcc" stroke-width="12"/><circle cx="70" cy="102" r="10" fill="#26343e"/><circle cx="194" cy="102" r="10" fill="#26343e"/></svg>`;if(k==='bus')return `<svg viewBox="0 0 260 125"><path d="M22 96V29q0-15 15-15h184q17 0 17 17v65z" fill="#f2c94c" stroke="#5b5135" stroke-width="4"/><rect x="40" y="29" width="151" height="34" rx="4" fill="#bfe7fa"/><path d="M83 29v34M126 29v34M169 29v34" stroke="#5b7180" stroke-width="4"/><rect x="199" y="29" width="25" height="55" rx="4" fill="#d8eef8"/>${w(63)}${w(201)}</svg>`;return `<svg viewBox="0 0 260 125"><rect x="22" y="58" width="82" height="38" rx="8" fill="#79bd70" stroke="#3f5d46" stroke-width="4"/><path d="M102 55h20q10 0 16 9l11 16h-47z" fill="#bfe7fa" stroke="#3f5d46" stroke-width="3"/><path d="M143 38h78q24 0 24 25v33H143z" fill="#5da45a" stroke="#3f5d46" stroke-width="4"/><rect x="231" y="58" width="18" height="28" rx="4" fill="#79bd70" stroke="#3f5d46" stroke-width="3"/>${w(62)}${w(210)}</svg>`}
function w(x){return `<circle cx="${x}" cy="99" r="16" fill="#26343e"/><circle cx="${x}" cy="99" r="6" fill="#dce3e8"/>`}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function beep(f,t,d=.13,v=.035,type='sine'){let c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function vehicleSound(k){let c=audio(),t=c.currentTime;if(k==='ambulance'){[660,440,660,440].forEach((f,i)=>beep(f,t+i*.24,.2,.028))}else if(k==='fire'){[430,520,430].forEach((f,i)=>beep(f,t+i*.25,.21,.03,'square'));[0,.13,.26].forEach(x=>beep(880,t+x,.05,.018))}else if(k==='police'){[520,390,520,390].forEach((f,i)=>beep(f,t+i*.2,.17,.025,'square'))}else if(k==='train'){[130,105,130,105].forEach((f,i)=>beep(f,t+i*.17,.12,.03,'triangle'))}else if(k==='bus'){beep(115,t,.6,.03,'sawtooth');beep(170,t+.62,.16,.018)}else{beep(105,t,.55,.028,'sawtooth');beep(80,t+.58,.38,.025,'square')}}
function good(){let c=audio(),t=c.currentTime;[523,659,784].forEach((f,i)=>beep(f,t+i*.1,.13,.035))}function bad(){let c=audio();beep(250,c.currentTime,.15,.02)}function fanfare(){let c=audio(),t=c.currentTime;[523,659,784,1047].forEach((f,i)=>beep(f,t+i*.13,.2,.04))}
function speak(text,cb){clearTimeout(speechTimer);if(!('speechSynthesis'in window)){speechTimer=setTimeout(cb||(()=>{}),900);return}speechSynthesis.cancel();let done=false,finish=()=>{if(done)return;done=true;clearTimeout(speechTimer);setTimeout(cb||(()=>{}),260)};let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.86;u.pitch=1.05;u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);speechTimer=setTimeout(finish,Math.max(1800,text.length*170))}
function burst(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');fx.appendChild(s);setTimeout(()=>s.remove(),750)}}
function choices(){let correct=order[q],others=Object.keys(DATA).filter(k=>k!==correct).sort(()=>Math.random()-.5),n=q<2?2:3;return [correct,...others.slice(0,n-1)].sort(()=>Math.random()-.5)}
function playSound(){speaker.classList.add('play');vehicleSound(order[q]);setTimeout(()=>speaker.classList.remove('play'),1050)}
function render(){busy=false;count.textContent=`${q+1} / 6`;hint.textContent=q===0?'🔊を おして きいてね':'もういちど きくなら 🔊';choicesEl.innerHTML='';choices().forEach(k=>{let b=document.createElement('button');b.className='card';b.dataset.key=k;b.innerHTML=art(k)+(q===0&&k===order[q]?'<span class="finger">👆</span>':'');b.onclick=()=>pick(b,k);choicesEl.appendChild(b)});speak('おとを きいて、のりものを えらんでね',()=>setTimeout(playSound,220))}
function pick(b,k){if(busy)return;let right=order[q];if(k===right){busy=true;b.classList.add('good');good();burst(b);speak(`せいかい。${DATA[right].name}だよ`,()=>{q++;if(q>=order.length){fanfare();done.classList.add('show');speak('すごい。ぜんぶ おとで わかったね')}else render()})}else{b.classList.add('bad');bad();setTimeout(()=>b.classList.remove('bad'),350);speak(`${DATA[k].name}だね。もういちど おとを きいてみよう`,()=>playSound())}}
const count=document.getElementById('count'),speaker=document.getElementById('speaker'),hint=document.getElementById('hint'),choicesEl=document.getElementById('choices'),fx=document.getElementById('fx'),done=document.getElementById('done');speaker.onclick=playSound;again.onclick=()=>{q=0;done.classList.remove('show');render()};document.addEventListener('pointerdown',audio,{once:true});render();
</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
