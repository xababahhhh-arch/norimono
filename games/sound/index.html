<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おとで あてよう</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(#ccecff 0 47%,#d9edbf 47%);color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;justify-content:center}.count{font-weight:900;font-size:16px;background:#fff9;padding:6px 13px;border-radius:20px}.title{font-size:24px;font-weight:900;text-align:center}.speaker{width:112px;height:112px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 0 #0002;display:grid;place-items:center;font-size:58px;animation:pulse 1.4s ease-in-out infinite;touch-action:manipulation}.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}.speaker.play{outline:7px solid #ffd65c}@keyframes pulse{50%{transform:scale(1.04)}}.hint{font-size:14px;font-weight:800;background:#fff9;border-radius:16px;padding:5px 10px;min-height:27px}.choices{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:0;border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;padding:5px;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:manipulation}.card svg{width:100%;height:100%;max-height:125px}.card:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}.card.good{outline:7px solid #65d47b;animation:pop .45s}.card.bad{animation:shake .3s}.finger{position:absolute;right:8px;top:5px;font-size:34px;animation:tap 1s infinite}@keyframes tap{50%{transform:translateY(7px)}}@keyframes pop{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.fx{position:fixed;inset:0;pointer-events:none;z-index:20}.star{position:absolute;font-size:30px;animation:fly .7s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}.done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff9;backdrop-filter:blur(5px);z-index:30}.done.show{display:flex}.panel{text-align:center;background:white;padding:28px;border-radius:28px;box-shadow:0 10px 30px #0003}.panel b{font-size:30px}.panel button{margin-top:16px;border:0;border-radius:18px;padding:14px 24px;background:#65c77a;color:#fff;font:900 18px inherit}@media(max-width:380px){.app{gap:5px}.title{font-size:21px}.speaker{width:92px;height:92px;font-size:48px}.choices{gap:7px}.card svg{max-height:105px}}</style></head><body><main class="app"><div class="top"><span class="count" id="count">1 / 6</span></div><div class="title">どの のりものの おと？</div><button class="speaker" id="speaker" aria-label="おとを きく">🔊</button><div class="hint" id="hint">🔊を おして きいてね</div><div class="choices" id="choices"></div></main><div class="fx" id="fx"></div><div class="done" id="done"><div class="panel"><div style="font-size:58px">🎵⭐</div><b>ぜんぶ わかったね！</b><br><button id="again">もういちど</button></div></div><script src="../../vehicles.js"></script><script>
const DATA={fire:{name:'しょうぼうしゃ',sound:'ウー、カンカンカン',tone:'fire'},ambulance:{name:'きゅうきゅうしゃ',sound:'ピーポー、ピーポー',tone:'ambulance'},police:{name:'パトカー',sound:'ウー、ウー',tone:'police'},train:{name:'でんしゃ',sound:'ガタンゴトン、ガタンゴトン',tone:'train'},bus:{name:'バス',sound:'ブーン、プシュー',tone:'bus'},garbage:{name:'ごみしゅうしゅうしゃ',sound:'ブーン、ガーッ',tone:'garbage'}};
const SHARED={fire:'shobosha',ambulance:'kyukyusha',police:'patocar',bus:'bus',train:'keikyu',garbage:'gomi'};
let order=['ambulance','fire','train','bus','police','garbage'],q=0,busy=false,ctx=null,speechSeq=0;
function art(k){let v=(window.VEHICLES||[]).find(x=>x.id===SHARED[k]);return v?v.svg:''}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function beep(f,t,d=.13,v=.035,type='sine'){let c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function vehicleSound(k){let c=audio(),t=c.currentTime;if(k==='ambulance'){[660,440,660,440].forEach((f,i)=>beep(f,t+i*.24,.2,.028))}else if(k==='fire'){[430,520,430].forEach((f,i)=>beep(f,t+i*.25,.21,.03,'square'));[0,.13,.26].forEach(x=>beep(880,t+x,.05,.018))}else if(k==='police'){[520,390,520,390].forEach((f,i)=>beep(f,t+i*.2,.17,.025,'square'))}else if(k==='train'){[130,105,130,105].forEach((f,i)=>beep(f,t+i*.17,.12,.03,'triangle'))}else if(k==='bus'){beep(115,t,.6,.03,'sawtooth');beep(170,t+.62,.16,.018)}else{beep(105,t,.55,.028,'sawtooth');beep(80,t+.58,.38,.025,'square')}}
function good(){let c=audio(),t=c.currentTime;[523,659,784].forEach((f,i)=>beep(f,t+i*.1,.13,.035))}function bad(){let c=audio();beep(250,c.currentTime,.15,.02)}function fanfare(){let c=audio(),t=c.currentTime;[523,659,784,1047].forEach((f,i)=>beep(f,t+i*.13,.2,.04))}
function speak(text,cb){const seq=++speechSeq;if(!('speechSynthesis'in window)){if(cb)setTimeout(cb,500);return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.84;u.pitch=1.04;let done=false;const finish=()=>{if(done||seq!==speechSeq)return;done=true;const wait=()=>{if(speechSynthesis.speaking||speechSynthesis.pending){setTimeout(wait,90);return}if(cb)setTimeout(cb,300)};wait()};u.onend=finish;u.onerror=()=>setTimeout(finish,600);speechSynthesis.speak(u);setTimeout(()=>{if(!done&&seq===speechSeq)finish()},15000)}catch(_){if(cb)setTimeout(cb,700)}}
function burst(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');fx.appendChild(s);setTimeout(()=>s.remove(),750)}}
function choices(){let correct=order[q],others=Object.keys(DATA).filter(k=>k!==correct).sort(()=>Math.random()-.5),n=q<2?2:3;return [correct,...others.slice(0,n-1)].sort(()=>Math.random()-.5)}
function playSound(){speaker.classList.add('play');vehicleSound(order[q]);setTimeout(()=>speaker.classList.remove('play'),1050)}
function announce(){speak('おとを きいて、のりものを えらんでね',()=>setTimeout(playSound,220))}
function render(){busy=false;count.textContent=`${q+1} / 6`;hint.textContent=q===0?'🔊を おして きいてね':'もういちど きくなら 🔊';choicesEl.innerHTML='';choices().forEach(k=>{let b=document.createElement('button');b.className='card';b.dataset.key=k;b.innerHTML=art(k)+(q===0&&k===order[q]?'<span class="finger">👆</span>':'');b.onclick=()=>pick(b,k);choicesEl.appendChild(b)});if(window.__noriInteractionStarted)announce()}
function pick(b,k){if(busy)return;let right=order[q];if(k===right){busy=true;b.classList.add('good');good();burst(b);speak(`せいかい。${DATA[right].name}だよ`,()=>{q++;if(q>=order.length){fanfare();done.classList.add('show');speak('すごい。ぜんぶ おとで わかったね')}else render()})}else{b.classList.add('bad');bad();setTimeout(()=>b.classList.remove('bad'),350);speak(`${DATA[k].name}だね。もういちど おとを きいてみよう`,()=>playSound())}}
const count=document.getElementById('count'),speaker=document.getElementById('speaker'),hint=document.getElementById('hint'),choicesEl=document.getElementById('choices'),fx=document.getElementById('fx'),done=document.getElementById('done');speaker.onclick=playSound;again.onclick=()=>{q=0;done.classList.remove('show');render()};document.addEventListener('pointerdown',audio,{once:true});document.addEventListener('norimono-started',()=>{if(!busy)announce()},{once:true});render();
</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
