<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ミニカーロード</title>

<meta name="theme-color" content="#0d1015">
<meta name="description" content="スマホの上をミニカーが走っているように見せるスクロール道路アプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ミニカーロード">
<meta name="format-detection" content="telephone=no">

<link rel="apple-touch-icon" href="../../icons/menu-180.png">
<link rel="icon" href="../../icons/menu-192.png">
<style>
:root{
  --pit:#12161c;          /* ピットレーンの床 */
  --pit-hi:#1d242e;
  --flame:#ff6a00;        /* ダイキャストのフレームオレンジ */
  --flame-dark:#b53f00;
  --nitro:#2fdcf0;
  --nitro-dark:#0b7c8c;
  --brake:#ff2d55;
  --brake-dark:#a30f2c;
  --ink:#f2f5f8;
  --ink-dim:#8d99a8;
  --gap:10px;
}

*{box-sizing:border-box;margin:0;padding:0}

/* .sheet や .install の display 指定が [hidden] に勝ってしまうため明示的に打ち消す */
[hidden]{display:none !important}

html,body{
  height:100%;
  overflow:hidden;
  background:#0d1015;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  overscroll-behavior:none;
}

body{position:fixed;inset:0;width:100%;height:100%}

#game{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
}

/* ── 上部の計器 ───────────────────────────── */
.hud{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 56px);
  left:calc(env(safe-area-inset-left,0px) + 12px);
  right:calc(env(safe-area-inset-right,0px) + 12px);
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;pointer-events:none;
}

.gauge{
  background:rgba(12,15,20,.62);
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  padding:7px 12px 9px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.speed{display:flex;align-items:baseline;gap:5px;line-height:1}
.speed span:first-child{
  font-size:30px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.unit{font-size:11px;color:var(--ink-dim);font-weight:600}

.nitro-bar{
  margin-top:7px;width:104px;height:7px;border-radius:99px;
  background:rgba(255,255,255,.14);overflow:hidden;
}
.nitro-bar i{
  display:block;height:100%;width:100%;
  background:linear-gradient(90deg,var(--nitro-dark),var(--nitro));
  transition:width .12s linear;
}

.hud-btns{
  display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;
  flex:1 1 auto;min-width:0;pointer-events:auto;
}
.icon{
  width:44px;height:44px;border:0;border-radius:14px;
  background:rgba(12,15,20,.62);
  border:1px solid rgba(255,255,255,.10);
  color:var(--ink);font-size:20px;line-height:1;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  touch-action:manipulation;
}
.icon:active{background:rgba(255,255,255,.18)}
.icon.on{background:var(--flame);border-color:var(--flame);color:#150a00}

.fps{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:calc(env(safe-area-inset-left,0px) + 14px);
  font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums;
}

/* ── 下部の操作パネル ─────────────────────── */
.controls{
  position:fixed;
  left:calc(env(safe-area-inset-left,0px) + 10px);
  right:calc(env(safe-area-inset-right,0px) + 10px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;flex-direction:column;gap:var(--gap);
}

.cruise{
  display:flex;align-items:center;gap:12px;
  background:rgba(12,15,20,.62);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:8px 14px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.cruise-label{font-size:13px;font-weight:700;color:var(--ink-dim);flex:none}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  flex:1;height:26px;background:transparent;
}
input[type=range]::-webkit-slider-runnable-track{
  height:10px;border-radius:99px;
  background:linear-gradient(90deg,var(--flame-dark),var(--flame));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:30px;height:30px;margin-top:-10px;border-radius:50%;
  background:#fff;border:4px solid var(--flame);
}

.pads{display:grid;grid-template-columns:1fr 1.25fr 1.25fr 1fr;gap:var(--gap)}

.pad{
  border:0;border-radius:20px;
  height:88px;
  font-size:22px;font-weight:800;letter-spacing:.02em;
  color:#fff;
  background:var(--pit-hi);
  box-shadow:0 6px 0 #0a0d11;
  transition:transform .05s linear, box-shadow .05s linear;
  touch-action:none;
}
.pad:active,.pad.held{transform:translateY(5px);box-shadow:0 1px 0 #0a0d11}

.steer{font-size:32px;background:var(--pit-hi);color:var(--ink)}
.gas{background:var(--flame);box-shadow:0 6px 0 var(--flame-dark);color:#1b0a00}
.gas:active,.gas.held{box-shadow:0 1px 0 var(--flame-dark)}
.brake{background:var(--brake);box-shadow:0 6px 0 var(--brake-dark)}
.brake:active,.brake.held{box-shadow:0 1px 0 var(--brake-dark)}

.nitro{
  border:0;border-radius:20px;height:64px;width:100%;
  font-size:22px;font-weight:800;letter-spacing:.08em;
  color:#04252b;
  background:linear-gradient(180deg,#7ef0ff,var(--nitro));
  box-shadow:0 6px 0 var(--nitro-dark);
  touch-action:none;
}
.nitro:active,.nitro.held{transform:translateY(5px);box-shadow:0 1px 0 var(--nitro-dark)}
.nitro.empty{filter:grayscale(.85) brightness(.7)}

/* ── 設定シート ───────────────────────────── */
.sheet{
  /* 設定を開いているあいだは「← もどる」（z-index:9999）よりも上に出す */
  position:fixed;inset:0;z-index:10000;
  background:rgba(5,7,10,.6);
  display:flex;align-items:flex-end;
}
.sheet-inner{
  width:100%;
  /* 小さい画面・横画面でも すべての項目に届くように、シートの中をスクロールできるようにする */
  max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  background:var(--pit);
  border-top:3px solid var(--flame);
  border-radius:22px 22px 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  display:flex;flex-direction:column;gap:16px;
}
.sheet h2{font-size:18px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.field.row{flex-direction:row;align-items:center;justify-content:space-between}
.field input[type=checkbox]{width:52px;height:32px;accent-color:var(--flame)}
.sheet-actions{display:flex;gap:10px;margin-top:4px}
.sheet-actions button{
  flex:1;height:54px;border:0;border-radius:16px;
  font-size:16px;font-weight:800;
}
.ghost{background:var(--pit-hi);color:var(--ink)}
.solid{background:var(--flame);color:#1b0a00}

/* ── 追加案内 ─────────────────────────────── */
.install{
  position:fixed;z-index:30;
  left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 280px);
  background:rgba(12,15,20,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  font-size:13px;line-height:1.5;
}
.install button{
  flex:none;border:0;border-radius:12px;padding:10px 14px;
  background:var(--flame);color:#1b0a00;font-weight:800;font-size:13px;
}

/* こどもモード：下の操作ボタンを隠し、画面タッチだけで遊ぶ */
body.kids .pads,
body.kids .cruise,
body.kids .nitro,
body.kids .nitro-bar{display:none}
/* こどもモードでも サイレンは押せる（横いっぱいに広げる） */
body.kids .bottom-row{grid-template-columns:1fr}

.icon.holding{background:var(--flame);border-color:var(--flame);color:#150a00}
.field small{font-weight:500;color:var(--ink-dim);font-size:12px}

/* ── ニトロ と サイレン ───────────────────── */
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.siren{
  border:0;border-radius:20px;height:64px;width:100%;
  font-size:21px;font-weight:800;letter-spacing:.04em;
  color:#fff;
  background:linear-gradient(180deg,#ff6b7c,var(--brake));
  box-shadow:0 6px 0 var(--brake-dark);
  touch-action:manipulation;
}
.siren:active{transform:translateY(5px);box-shadow:0 1px 0 var(--brake-dark)}
/* 鳴っているときは 色だけでなく 文字（とめる）と へこみ でも分かるように */
.siren.on{
  background:linear-gradient(180deg,#6fb0ff,#1f64d8);
  box-shadow:0 1px 0 #123a80, inset 0 0 0 4px #fff;
  transform:translateY(5px);
}

/* ── 設定：サイレンの音を選ぶボタン ─────────── */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{
  min-height:54px;padding:6px 8px;
  border:2px solid rgba(255,255,255,.14);border-radius:14px;
  background:var(--pit-hi);color:var(--ink);
  font-size:15px;font-weight:800;line-height:1.3;
  touch-action:manipulation;
}
.seg button.on{background:var(--flame);border-color:var(--flame);color:#1b0a00}
.seg button.on::before{content:"✓ "}

/* ── 一時停止中の表示 ─────────────────────── */
.paused-badge{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:5;
  padding:12px 22px;border-radius:16px;
  background:rgba(12,15,20,.82);border:2px solid rgba(255,255,255,.2);
  font-size:20px;font-weight:800;pointer-events:none;white-space:nowrap;
}

/* ── 横画面：操作パネルを低くして、道路を広く見せる ── */
@media (orientation:landscape) and (max-height:560px){
  .hud{
    top:calc(env(safe-area-inset-top,0px) + 8px);
    left:calc(env(safe-area-inset-left,0px) + 110px);
  }
  .fps{top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 112px)}
  .controls{gap:6px}
  .cruise{padding:2px 12px}
  .pad{height:56px;font-size:18px}
  .steer{font-size:26px}
  .nitro,.siren{height:48px;font-size:18px}
  .install{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 60px)}
}

@media (prefers-reduced-motion:reduce){
  .pad,.nitro,.siren{transition:none}
}
</style>
</head>
<body>

<canvas id="game" aria-label="道路"></canvas>

<div class="hud">
  <div class="gauge">
    <div class="speed"><span id="speedVal">0</span><span class="unit">km/h</span></div>
    <div class="nitro-bar"><i id="nitroFill"></i></div>
  </div>
  <div class="hud-btns">
    <button class="icon" id="btnPause" type="button" aria-pressed="false" aria-label="一時停止（長押し）">⏸️</button>
    <button class="icon" id="btnSound" type="button" aria-label="すべての音を消す">🔊</button>
    <button class="icon" id="btnNight" type="button" aria-label="夜にする">🌙</button>
    <button class="icon" id="btnGuide" type="button" aria-label="ガイドを消す">🅿</button>
    <button class="icon" id="btnMenu" type="button" aria-label="設定（長押しで開く）">⚙</button>
  </div>
  <div class="fps" id="fps" hidden>60fps</div>
</div>

<div class="paused-badge" id="pausedBadge" role="status" hidden>⏸️ いちじ ていし</div>

<div class="controls">
  <div class="cruise">
    <span class="cruise-label">スピード</span>
    <input type="range" id="speedSlider" min="0" max="100" value="40" aria-label="スピード">
  </div>

  <div class="pads">
    <button class="pad steer" id="padLeft" type="button" aria-label="左へ">◀</button>
    <button class="pad brake" id="padBrake" type="button">とまる</button>
    <button class="pad gas" id="padGas" type="button">はしる</button>
    <button class="pad steer" id="padRight" type="button" aria-label="右へ">▶</button>
  </div>

  <div class="bottom-row">
    <button class="nitro" id="padNitro" type="button">ニトロ</button>
    <button class="siren" id="padSiren" type="button" aria-pressed="false">🚨 サイレン</button>
  </div>
</div>

<div class="sheet" id="menu" hidden>
  <div class="sheet-inner" role="dialog" aria-label="設定">
    <h2>設定</h2>

    <label class="field row">
      <span>こどもモード<br><small>画面のどこを触っても左右／自動で走る。<br>走るのを止めるときは ⏸ を長押し</small></span>
      <input type="checkbox" id="kidsMode" checked>
    </label>

    <div class="field">
      <span>サイレンの音</span>
      <div class="seg" id="sirenSeg" role="group" aria-label="サイレンの音">
        <button type="button" data-v="ambulance" class="on" aria-pressed="true">きゅうきゅうしゃ</button>
        <button type="button" data-v="police" aria-pressed="false">パトカー</button>
        <button type="button" data-v="fire" aria-pressed="false">しょうぼうしゃ</button>
        <button type="button" data-v="garbage" aria-pressed="false">ごみしゅうしゅうしゃ</button>
      </div>
    </div>

    <label class="field row">
      <span>エンジン音<br><small>サイレンの音とは別です。すべての音は 右上の 🔊 で消せます</small></span>
      <input type="checkbox" id="engineOn" checked>
    </label>

    <label class="field">
      <span>はしるはやさ</span>
      <input type="range" id="speedSlider2" min="0" max="100" value="40">
    </label>

    <label class="field">
      <span>ミニカーガイドの大きさ <b id="carSizeVal">約16×8mm（目安）</b><br>
        <small>mm は目安です。画面によって 実際の大きさと ずれることがあります</small></span>
      <input type="range" id="carSize" min="8" max="100" value="25">
    </label>

    <label class="field">
      <span>カーブの強さ</span>
      <input type="range" id="curveAmount" min="0" max="100" value="60">
    </label>

    <label class="field row">
      <span>ガイドをずっと表示</span>
      <input type="checkbox" id="guideAlways" checked>
    </label>

    <label class="field row">
      <span>fpsを表示</span>
      <input type="checkbox" id="showFps">
    </label>

    <label class="field row">
      <span>画面を消さない</span>
      <input type="checkbox" id="keepAwake" checked>
    </label>

    <div class="sheet-actions">
      <button class="ghost" id="btnReset" type="button">最初から走る</button>
      <button class="solid" id="btnClose" type="button">とじる</button>
    </div>
  </div>
</div>

<div class="install" id="install" hidden>
  <p>ホーム画面に追加すると全画面で遊べます。<br>共有ボタン → 「ホーム画面に追加」</p>
  <button id="installClose" type="button">わかった</button>
</div>

<script>
'use strict';
/* ミニカーロード ─ 実物のミニカーを画面の上に置いて遊ぶスクロール道路 */
(function () {

  // ── 基本ユーティリティ ─────────────────────────────
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  const cv = $('game');
  const ctx = cv.getContext('2d', { alpha: false, desynchronized: true });

  // ── 画面と車体のサイズ ─────────────────────────────
  // iPhone はおよそ 6 CSSpx ≒ 1mm。Hot Wheels は約 64mm × 30mm。
  const PX_PER_MM = 6;
  const CAR_BASE_L = 64 * PX_PER_MM; // Hot Wheels 実寸 64mm = 384px
  const CAR_BASE_W = 30 * PX_PER_MM; // 同 30mm = 180px
  let carScale = 0.25;               // ガイドの大きさ（実寸に対する比）
  let CAR_L = CAR_BASE_L * carScale, CAR_W = CAR_BASE_W * carScale;
  let TIRE_DX = CAR_W * 0.38, TIRE_W = 8, SMOKE_SCALE = 0.55;

  function applyCarSize() {
    CAR_L = CAR_BASE_L * carScale;
    CAR_W = CAR_BASE_W * carScale;
    TIRE_DX = CAR_W * 0.38;
    TIRE_W = Math.max(5, 22 * carScale);
    SMOKE_SCALE = clamp(carScale * 2.2, 0.45, 1.4);
  }

  let W = 0, H = 0, DPR = 1;
  let ROAD_HALF = 150, SHOULDER = 22, CAR_Y = 400;

  // ── 配色 ───────────────────────────────────────────
  const PALETTE = {
    day: {
      grass: '#4c8f3a', grassAlt: '#437f33',
      shoulder: '#9ba1a8', shoulderDot: 'rgba(255,255,255,.28)',
      road: '#4e535b', roadSeam: '#454a52',
      edge: '#f3f6f9', center: '#ffcf33',
      tree: '#2e6a29', treeAlt: '#255821', trunk: '#4a3320',
      skid: 'rgba(22,18,16,.45)', smokeAlpha: 0.5
    },
    night: {
      grass: '#16311e', grassAlt: '#122a19',
      shoulder: '#3d434a', shoulderDot: 'rgba(255,255,255,.12)',
      road: '#242830', roadSeam: '#1f232a',
      edge: '#9fadbd', center: '#c08c25',
      tree: '#12301a', treeAlt: '#0d2414', trunk: '#241a12',
      skid: 'rgba(0,0,0,.5)', smokeAlpha: 0.38
    }
  };
  let P = PALETTE.day;

  // ── 状態 ───────────────────────────────────────────
  const MAX_SPEED = 1450;            // world px / 秒
  const state = {
    distance: 0,
    speed: 0,
    cruise: 0.40,
    gas: false,
    brake: false,
    steerInput: 0,
    btnSteer: 0,
    touchSteer: 0,
    kids: true,
    steer: 0,
    lateral: 0,
    anchor: 0,
    nitroFuel: 1,
    nitroOn: false,
    nitroLock: false,
    nitroHeld: false,
    night: false,
    guideAlways: true,
    guideTimer: 12,
    curveAmount: 0.6,
    showFps: false,
    keepAwake: true,
    paused: false,
    fps: 60
  };

  // ── 道路の生成（先の形をあらかじめ作っておく）──────
  const road = { step: 24, lastW: 0, samples: [], heading: 0, curv: 0, target: 0, nextAt: 0 };

  function resetRoad() {
    road.samples.length = 0;
    road.lastW = state.distance - 600;
    road.heading = 0; road.curv = 0; road.target = 0;
    road.nextAt = road.lastW + 400;
    road.samples.push({ w: road.lastW, x: 0 });
    ensureRoad(state.distance + H + 300);
  }

  function ensureRoad(uptoW) {
    const maxOff = W * 0.42;
    while (road.lastW < uptoW) {
      road.lastW += road.step;
      if (road.lastW > road.nextAt) {
        road.target = (hash(road.lastW * 0.017) * 2 - 1) * 0.0022 * state.curveAmount;
        road.nextAt = road.lastW + 500 + hash(road.lastW * 0.031) * 900;
      }
      road.curv += (road.target - road.curv) * 0.05;
      road.heading = clamp(road.heading + road.curv * road.step, -0.55, 0.55);

      let x = road.samples[road.samples.length - 1].x + road.heading * road.step;
      if (x > maxOff) { x = maxOff; road.heading = -Math.abs(road.heading) * 0.6; road.target = -Math.abs(road.target); }
      if (x < -maxOff) { x = -maxOff; road.heading = Math.abs(road.heading) * 0.6; road.target = Math.abs(road.target); }
      road.samples.push({ w: road.lastW, x });
    }
    while (road.samples.length > 4 && road.samples[1].w < state.distance - 500) road.samples.shift();
  }

  function roadCenterAt(w) {
    const s = road.samples;
    if (!s.length) return 0;
    const i = (w - s[0].w) / road.step;
    if (i <= 0) return s[0].x;
    if (i >= s.length - 1) return s[s.length - 1].x;
    const i0 = i | 0, f = i - i0;
    return s[i0].x * (1 - f) + s[i0 + 1].x * f;
  }

  // 画面上の y に対応する道路中心の x
  const worldAtY = (y) => state.distance + (H - y);
  // ミニカーの位置で道路が画面中央に来るように全体を平行移動する。
  // カーブは「車より前後の道路が横にずれる」という形で見える。
  const centerAtW = (w) => W / 2 + (roadCenterAt(w) - state.anchor) + state.lateral;
  const centerAtY = (y) => centerAtW(worldAtY(y));
  const screenY = (w) => H - (w - state.distance);

  // ── エフェクト用のデータ ───────────────────────────
  let skidStrokes = [];   // {pts:[{w,dx}]}
  let activeSkid = null;
  let lastSkidW = 0;
  let smoke = [];         // {w,dx,r,life,max,vx,vw,tint}
  let sparks = [];        // ニトロの火花 {w,dx,life,max,vx}

  // ── スプライト（毎フレーム作らずに使い回す）────────
  let smokeSprite = null, glowSprite = null, headlight = null, vignette = null;

  function makeSmokeSprite() {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, 'rgba(255,255,255,.95)');
    rg.addColorStop(.45, 'rgba(255,255,255,.35)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    return c;
  }

  function makeGlowSprite() {
    const s = 256, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, 'rgba(255,226,150,.85)');
    rg.addColorStop(.4, 'rgba(255,206,110,.28)');
    rg.addColorStop(1, 'rgba(255,200,100,0)');
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    return c;
  }

  function makeHeadlight() {
    const w = 560, h = 720, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.beginPath();
    g.moveTo(w / 2 - 70, h);
    g.lineTo(w / 2 + 70, h);
    g.lineTo(w / 2 + 250, 0);
    g.lineTo(w / 2 - 250, 0);
    g.closePath();
    g.clip();
    const lg = g.createLinearGradient(0, h, 0, 0);
    lg.addColorStop(0, 'rgba(255,244,206,.5)');
    lg.addColorStop(.45, 'rgba(255,240,190,.22)');
    lg.addColorStop(1, 'rgba(255,236,180,0)');
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    return c;
  }

  function makeVignette() {
    const c = document.createElement('canvas');
    c.width = Math.max(2, Math.round(W / 4));
    c.height = Math.max(2, Math.round(H / 4));
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(c.width / 2, c.height * 0.5, c.width * 0.25,
      c.width / 2, c.height * 0.5, c.width * 1.15);
    rg.addColorStop(0, 'rgba(0,0,10,0)');
    rg.addColorStop(1, 'rgba(0,0,12,.72)');
    g.fillStyle = rg; g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  // ── 音（すべてWeb Audioで合成。音声ファイルは使わない）────
  // 音のつながり： エンジン音 → engineBus ┐
  //               サイレン   → sirenBus  ┴→ master（🔊ボタンで全体を消音）→ スピーカー
  // エンジン音とサイレンは別々にオン・オフできる。
  const SND = (function () {
    let ctx = null, master = null, engineBus = null, sirenBus = null, ready = false;
    let muted = false, engineOn = true;
    let eng = null, noiseGain = null, whineGain = null;
    const siren = { osc: null, gain: null, timer: null, next: 0, type: 'ambulance', on: false, melIdx: 0 };
    const extra = new Set();   // 予約済みのチャイム・ベル（止めるときに まとめて止める）

    const NOTE = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
      A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25
    };
    // 「故郷の空」（スコットランド民謡・著作権切れ）をチャイム風に
    const MELODY = [
      ['G4', 1], ['E4', 1], ['E4', 1], ['G4', 1], ['A4', 1], ['G4', 1], ['E4', 2],
      ['D4', 1], ['C4', 1], ['D4', 1], ['E4', 1], ['D4', 3],
      [null, 2],
      ['G4', 1], ['E4', 1], ['E4', 1], ['G4', 1], ['A4', 1], ['G4', 1], ['E4', 2],
      ['D4', 1], ['E4', 1], ['D4', 1], ['C4', 1], ['C4', 3],
      [null, 3]
    ];

    function ensure() {
      if (ready) {
        if (ctx.state === 'suspended' && document.visibilityState === 'visible') ctx.resume().catch(() => { });
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ctx.destination);
        engineBus = ctx.createGain();
        engineBus.gain.value = engineOn ? 1 : 0;
        engineBus.connect(master);
        buildEngine();
        buildSiren();
        ready = true;
      } catch (_) { ready = false; }
    }

    function buildEngine() {
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 500; filter.Q.value = 5;
      const gain = ctx.createGain(); gain.gain.value = 0;
      filter.connect(gain); gain.connect(engineBus);

      const o1 = ctx.createOscillator(); o1.type = 'sawtooth';
      const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.detune.value = 14;
      const o3 = ctx.createOscillator(); o3.type = 'square';
      const g3 = ctx.createGain(); g3.gain.value = 0.5;
      o1.connect(filter); o2.connect(filter); o3.connect(g3); g3.connect(filter);
      o1.start(); o2.start(); o3.start();

      // 走行風・路面ノイズ
      const len = Math.floor(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.6;
      noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
      src.connect(bp); bp.connect(noiseGain); noiseGain.connect(engineBus);
      src.start();

      // ニトロの高音
      const w = ctx.createOscillator(); w.type = 'sine'; w.frequency.value = 900;
      whineGain = ctx.createGain(); whineGain.gain.value = 0;
      w.connect(whineGain); whineGain.connect(engineBus); w.start();

      eng = { o1, o2, o3, filter, gain, whine: w };
    }

    function buildSiren() {
      newSirenBus();
      siren.gain = ctx.createGain(); siren.gain.gain.value = 0.0001;
      siren.gain.connect(master);
      siren.osc = ctx.createOscillator(); siren.osc.type = 'square';
      siren.osc.frequency.value = 800;
      const soft = ctx.createBiquadFilter();
      soft.type = 'lowpass'; soft.frequency.value = 2600;
      siren.osc.connect(soft); soft.connect(siren.gain);
      siren.osc.start();
    }

    // チャイム・ベルは この bus を通す。止めるときは bus ごと切りはなすので、
    // すでに予約した音も その場で聞こえなくなる。
    function newSirenBus() {
      if (sirenBus) { try { sirenBus.disconnect(); } catch (_) { } }
      sirenBus = ctx.createGain();
      sirenBus.connect(master);
    }

    function track(node) {
      extra.add(node);
      node.onended = () => extra.delete(node);
    }

    function chime(freq, at, dur) {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.16, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
      const g2 = ctx.createGain(); g2.gain.value = 0.35;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(sirenBus);
      o.start(at); o2.start(at); o.stop(at + dur + 0.05); o2.stop(at + dur + 0.05);
      track(o); track(o2);
    }

    function bell(at) {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1760;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.06, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
      o.connect(g); g.connect(sirenBus);
      o.start(at); o.stop(at + 0.4);
      track(o);
    }

    // 予約済みも含めて、サイレンの音をすべて止める
    function silenceSiren() {
      if (!ready) return;
      const now = ctx.currentTime;
      siren.osc.frequency.cancelScheduledValues(now);
      siren.gain.gain.cancelScheduledValues(now);
      siren.gain.gain.setValueAtTime(0.0001, now);
      extra.forEach((o) => { try { o.stop(now); } catch (_) { } });
      extra.clear();
      newSirenBus();
    }

    function chunk(t) {
      const f = siren.osc.frequency, lv = 0.085;
      if (siren.type === 'ambulance') {           // ピーポー
        siren.gain.gain.setTargetAtTime(lv, t, 0.02);
        f.setValueAtTime(960, t);
        f.setValueAtTime(770, t + 0.62);
        return t + 1.24;
      }
      if (siren.type === 'police') {              // ウーウー（ウェイル）
        siren.gain.gain.setTargetAtTime(lv, t, 0.02);
        f.setValueAtTime(540, t);
        f.linearRampToValueAtTime(1150, t + 1.5);
        f.linearRampToValueAtTime(540, t + 3.0);
        return t + 3.0;
      }
      if (siren.type === 'fire') {                // ウー＋カンカン
        siren.gain.gain.setTargetAtTime(lv * 0.9, t, 0.02);
        f.setValueAtTime(430, t);
        f.linearRampToValueAtTime(880, t + 1.3);
        f.linearRampToValueAtTime(430, t + 2.6);
        bell(t + 0.15); bell(t + 1.0); bell(t + 1.85);
        return t + 2.6;
      }
      // ごみ収集車：チャイムのメロディ（1音ずつ予約して、すぐ止められるようにする）
      siren.gain.gain.setTargetAtTime(0.0001, t, 0.02);
      const note = MELODY[siren.melIdx];
      siren.melIdx = (siren.melIdx + 1) % MELODY.length;
      const b = note[1] * 0.42;
      if (note[0]) chime(NOTE[note[0]], t, Math.min(b * 0.95, 0.9));
      return t + b;
    }

    function pump() {
      if (!siren.on || !ready) return;
      const now = ctx.currentTime;
      let guard = 0;
      while (siren.next < now + 1.2 && guard++ < 8) siren.next = chunk(Math.max(siren.next, now + 0.05));
    }

    function setSiren(on) {
      if (on) {
        ensure();
        if (!ready) return false;
        silenceSiren();
        siren.on = true;
        siren.melIdx = 0;
        siren.next = ctx.currentTime + 0.05;
        pump();
        clearInterval(siren.timer);
        siren.timer = setInterval(pump, 300);
        return true;
      }
      siren.on = false;
      clearInterval(siren.timer); siren.timer = null;
      silenceSiren();
      return false;
    }

    return {
      ensure: ensure,
      isMuted: function () { return muted; },
      setMuted: function (m) {
        muted = m;
        if (ready) master.gain.setTargetAtTime(m ? 0 : 1, ctx.currentTime, 0.05);
      },
      engineEnabled: function () { return engineOn; },
      setEngine: function (on) {
        engineOn = on;
        if (ready) engineBus.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05);
      },
      setSirenType: function (t) {
        siren.type = t;
        if (siren.on) { setSiren(false); setSiren(true); }
      },
      sirenType: function () { return siren.type; },
      sirenOn: function () { return siren.on; },
      setSiren: setSiren,
      pendingSirenSounds: function () { return extra.size; }, // 確認用
      // 速度に合わせてエンジン音を変える
      update: function (norm, nitroOn) {
        if (!ready || ctx.state !== 'running') return;
        const t = ctx.currentTime;
        const f = 34 + norm * 104;                       // アイドリング〜全開
        eng.o1.frequency.setTargetAtTime(f, t, 0.08);
        eng.o2.frequency.setTargetAtTime(f * 1.005, t, 0.08);
        eng.o3.frequency.setTargetAtTime(f * 0.5, t, 0.08);
        eng.filter.frequency.setTargetAtTime(320 + norm * 2400 + (nitroOn ? 900 : 0), t, 0.1);
        eng.gain.gain.setTargetAtTime(0.045 + norm * 0.115, t, 0.12);
        noiseGain.gain.setTargetAtTime(norm * norm * 0.05, t, 0.15);
        eng.whine.frequency.setTargetAtTime(700 + norm * 900, t, 0.1);
        whineGain.gain.setTargetAtTime(nitroOn ? 0.035 : 0, t, 0.08);
      },
      // 画面が見えなくなったとき・ホームへ行くとき：サイレンを止めて、音の処理を休ませる
      pause: function () {
        setSiren(false);
        if (!ready) return;
        eng.gain.gain.cancelScheduledValues(ctx.currentTime);
        eng.gain.gain.setValueAtTime(0, ctx.currentTime);
        whineGain.gain.setValueAtTime(0, ctx.currentTime);
        noiseGain.gain.setValueAtTime(0, ctx.currentTime);
        if (ctx.state === 'running') ctx.suspend().catch(() => { });
      },
      resume: function () {
        if (ready && ctx.state === 'suspended') ctx.resume().catch(() => { });
      },
      contextState: function () { return ready ? ctx.state : 'none'; } // 確認用
    };
  })();


  // ── サイズ調整 ─────────────────────────────────────
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(cv.clientWidth || window.innerWidth || 390);
    H = Math.round(cv.clientHeight || window.innerHeight || 700);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ROAD_HALF = Math.round(W * 0.40);
    SHOULDER = Math.round(W * 0.055);
    // 横画面など 高さが低いときは、操作パネルに重ならない位置にガイドを置く
    CAR_Y = H < 560 ? Math.round(H * 0.40) : clamp(Math.round((H - 170) / 2 + 20), 240, H - 300);

    vignette = makeVignette();
    resetRoad();
  }

  // ── 入力 ───────────────────────────────────────────
  const releasers = [];            // 押しっぱなしボタンを「はなした」ことにする処理
  const screenTouches = new Set(); // 画面をさわっている指

  function holdButton(el, down, up) {
    const start = (e) => {
      e.preventDefault();
      if (el.dataset.held) return;
      el.dataset.held = '1'; el.classList.add('held');
      down();
    };
    const end = () => {
      if (!el.dataset.held) return;
      delete el.dataset.held; el.classList.remove('held');
      up();
    };
    releasers.push(end);
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      el.addEventListener('pointerleave', end);
      el.addEventListener('lostpointercapture', end);
    } else {
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', end);
      el.addEventListener('touchcancel', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }
  }

  // 長押しで動くボタン（小さな子が勝手に押さないように）
  function longPress(el, ms, fn) {
    let timer = null;
    const startLp = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      el.classList.add('holding');
      clearTimeout(timer);
      timer = setTimeout(() => { el.classList.remove('holding'); fn(); }, ms);
    };
    const endLp = () => { clearTimeout(timer); el.classList.remove('holding'); };
    releasers.push(endLp);
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', startLp);
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => el.addEventListener(t, endLp));
    } else {
      el.addEventListener('mousedown', startLp);
      el.addEventListener('touchstart', startLp, { passive: false });
      ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach((t) => el.addEventListener(t, endLp));
    }
  }

  // 押しっぱなし・画面タッチ・長押しを すべて解除する
  function releaseAll() {
    releasers.forEach((fn) => fn());
    screenTouches.clear();
    state.touchSteer = 0;
    state.gas = false; state.brake = false; state.nitroHeld = false; state.btnSteer = 0;
  }

  // 画面のどこでも：左半分をさわると左、右半分をさわると右
  function bindScreenSteer() {
    const setDir = (clientX) => { state.touchSteer = clientX < W / 2 ? -1 : 1; };
    const clear = () => { if (screenTouches.size === 0) state.touchSteer = 0; };

    if (window.PointerEvent) {
      cv.addEventListener('pointerdown', (e) => {
        e.preventDefault(); screenTouches.add(e.pointerId); setDir(e.clientX); kick();
      });
      cv.addEventListener('pointermove', (e) => { if (screenTouches.has(e.pointerId)) setDir(e.clientX); });
      const up = (e) => { screenTouches.delete(e.pointerId); clear(); };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', up);
      cv.addEventListener('pointerleave', up);
    } else {
      cv.addEventListener('touchstart', (e) => {
        e.preventDefault(); screenTouches.add(1); setDir(e.touches[0].clientX); kick();
      }, { passive: false });
      cv.addEventListener('touchmove', (e) => { setDir(e.touches[0].clientX); }, { passive: false });
      const end = () => { screenTouches.clear(); clear(); };
      cv.addEventListener('touchend', end);
      cv.addEventListener('touchcancel', end);
      cv.addEventListener('mousedown', (e) => { screenTouches.add(1); setDir(e.clientX); });
      cv.addEventListener('mousemove', (e) => { if (screenTouches.size) setDir(e.clientX); });
      window.addEventListener('mouseup', () => { screenTouches.clear(); clear(); });
    }
  }

  function setKids(on) {
    state.kids = on;
    document.body.classList.toggle('kids', on);
    if (on) releaseAll();
    $('btnPause').setAttribute('aria-label', pauseLabel());
  }

  // ── 一時停止（こどもモードでは長押し）───────────────
  function pauseLabel() {
    const act = state.paused ? '走りだす' : '一時停止';
    return state.kids ? act + '（長押し）' : act;
  }
  function setPaused(on) {
    state.paused = on;
    if (on) { state.gas = false; state.nitroHeld = false; }
    $('btnPause').textContent = on ? '▶️' : '⏸️';
    $('btnPause').classList.toggle('on', on);
    $('btnPause').setAttribute('aria-pressed', String(on));
    $('btnPause').setAttribute('aria-label', pauseLabel());
    $('pausedBadge').hidden = !on;
  }

  // ── サイレン ────────────────────────────────────────
  function setSirenUI(on) {
    const b = $('padSiren');
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
    b.textContent = on ? '🚨 とめる' : '🚨 サイレン';
  }
  function setSirenType(type) {
    Array.prototype.forEach.call($('sirenSeg').querySelectorAll('button'), (x) => {
      const sel = x.dataset.v === type;
      x.classList.toggle('on', sel);
      x.setAttribute('aria-pressed', String(sel));
    });
    SND.setSirenType(type);   // 鳴っていれば、予約済みの音を止めてから 新しい音に切りかえる
  }

  function sizeLabel() {
    return '約' + Math.round(CAR_L / PX_PER_MM) + '×' + Math.round(CAR_W / PX_PER_MM) + 'mm（目安）';
  }

  function bindUI() {
    bindScreenSteer();
    holdButton($('padGas'), () => { state.gas = true; kick(); }, () => { state.gas = false; });
    holdButton($('padBrake'), () => { state.brake = true; kick(); }, () => { state.brake = false; });
    holdButton($('padLeft'), () => { state.btnSteer = -1; kick(); }, () => { if (state.btnSteer < 0) state.btnSteer = 0; });
    holdButton($('padRight'), () => { state.btnSteer = 1; kick(); }, () => { if (state.btnSteer > 0) state.btnSteer = 0; });
    holdButton($('padNitro'), () => { state.nitroHeld = true; kick(); }, () => { state.nitroHeld = false; });

    $('padSiren').addEventListener('click', () => {
      kick();
      const on = SND.setSiren(!SND.sirenOn());
      setSirenUI(on);
      if (on && SND.isMuted()) setSound(true);   // 消音中に押したら音を戻す
    });

    $('btnSound').addEventListener('click', () => setSound(SND.isMuted()));

    // 一時停止：ふつうはタップ、こどもモードでは長押し
    const pauseBtn = $('btnPause');
    longPress(pauseBtn, 700, () => { if (state.kids) setPaused(!state.paused); });
    pauseBtn.addEventListener('click', () => { if (!state.kids) setPaused(!state.paused); });

    $('speedSlider').addEventListener('input', (e) => {
      state.cruise = e.target.value / 100;
      $('speedSlider2').value = e.target.value;
    });

    $('btnNight').addEventListener('click', () => setNight(!state.night));
    $('btnGuide').addEventListener('click', () => {
      state.guideAlways = !state.guideAlways;
      state.guideTimer = state.guideAlways ? 999 : 3;
      $('guideAlways').checked = state.guideAlways;
      $('btnGuide').classList.toggle('on', state.guideAlways);
      $('btnGuide').setAttribute('aria-label', state.guideAlways ? 'ガイドを消す' : 'ガイドを出す');
    });

    // 設定は長押しで開く（小さな子が勝手に開かないように）
    longPress($('btnMenu'), 700, () => { releaseAll(); $('menu').hidden = false; });
    $('btnClose').addEventListener('click', () => { $('menu').hidden = true; });
    $('menu').addEventListener('click', (e) => { if (e.target === $('menu')) $('menu').hidden = true; });

    $('btnReset').addEventListener('click', () => {
      state.distance = 0; state.speed = 0; state.lateral = 0; state.steer = 0;
      state.nitroFuel = 1; state.nitroLock = false;
      skidStrokes = []; activeSkid = null; smoke = []; sparks = [];
      resetRoad();
      SND.setSiren(false);
      setSirenUI(false);
      setPaused(false);
      $('menu').hidden = true;
    });

    $('curveAmount').addEventListener('input', (e) => { state.curveAmount = e.target.value / 100; });

    $('sirenSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      kick();
      setSirenType(b.dataset.v);
      if (!SND.sirenOn()) {                       // 選んだ音をその場で確認できる
        setSirenUI(SND.setSiren(true));
        if (SND.isMuted()) setSound(true);
      }
    });

    // エンジン音だけのオン・オフ（サイレンや全体の消音とは別）
    $('engineOn').addEventListener('change', (e) => { kick(); SND.setEngine(e.target.checked); });

    $('kidsMode').addEventListener('change', (e) => setKids(e.target.checked));

    $('carSize').addEventListener('input', (e) => {
      carScale = e.target.value / 100;
      applyCarSize();
      $('carSizeVal').textContent = sizeLabel();
    });

    $('speedSlider2').addEventListener('input', (e) => {
      state.cruise = e.target.value / 100;
      $('speedSlider').value = e.target.value;
    });
    $('guideAlways').addEventListener('change', (e) => {
      state.guideAlways = e.target.checked;
      state.guideTimer = state.guideAlways ? 999 : 3;
      $('btnGuide').classList.toggle('on', state.guideAlways);
    });
    $('showFps').addEventListener('change', (e) => {
      state.showFps = e.target.checked;
      $('fps').hidden = !state.showFps;
    });
    $('keepAwake').addEventListener('change', (e) => {
      state.keepAwake = e.target.checked;
      if (state.keepAwake) requestWakeLock(); else releaseWakeLock();
    });

    $('installClose').addEventListener('click', () => { $('install').hidden = true; });

    $('btnGuide').classList.add('on');

    // ブラウザ既定のジェスチャを止める（設定シートの中だけはスクロールできるようにする）
    document.addEventListener('touchmove', (e) => {
      const t = e.target;
      if (t && t.tagName === 'INPUT') return;
      if (t && t.closest && t.closest('.sheet-inner')) return;
      e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // 🔊：すべての音（エンジン音＋サイレン）の消音
  function setSound(on) {
    if (on) SND.ensure();
    SND.setMuted(!on);
    $('btnSound').textContent = on ? '🔊' : '🔇';
    $('btnSound').setAttribute('aria-label', on ? 'すべての音を消す' : 'すべての音を出す');
  }

  function setNight(on) {
    state.night = on;
    P = on ? PALETTE.night : PALETTE.day;
    $('btnNight').textContent = on ? '☀' : '🌙';
    $('btnNight').setAttribute('aria-label', on ? '昼にする' : '夜にする');
    document.querySelector('meta[name=theme-color]').setAttribute('content', on ? '#05070a' : '#0d1015');
  }

  // ── 画面を消さない（対応端末のみ）───────────────────
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && state.keepAwake && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (_) { /* 非対応でも遊べる */ }
  }
  function releaseWakeLock() { if (wakeLock) { wakeLock.release().catch(() => { }); wakeLock = null; } }
  function kick() { requestWakeLock(); SND.ensure(); }

  // ── 画面が見えなくなった・ホームへ移動するとき ────────
  // 音・タイマー・描画を止め、押しっぱなしも解除する。もどってきたら描画を再開。
  function sleep() {
    stopLoop();
    releaseAll();
    SND.pause();
    setSirenUI(false);
    releaseWakeLock();
  }
  function wake() {
    if (!booted || document.visibilityState !== 'visible') return;
    startLoop();
    SND.resume();
    requestWakeLock();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') wake(); else sleep();
  });
  window.addEventListener('pagehide', sleep);
  window.addEventListener('pageshow', (e) => { if (e.persisted) wake(); });
  window.addEventListener('blur', releaseAll);
  // 「← もどる」（back.js）を押したら、ページを離れる前に すぐ止める
  document.addEventListener('click', (e) => {
    if (e.target && e.target.closest && e.target.closest('#backToMenu')) sleep();
  }, true);


  // ── 更新 ───────────────────────────────────────────
  function update(dt) {
    // 画面タッチ優先、ボタンが押されていればそちら
    state.steerInput = state.btnSteer !== 0 ? state.btnSteer : state.touchSteer;
    if (state.paused) state.steerInput = 0;   // 一時停止中は ハンドルも止める

    // ニトロ
    if (state.nitroFuel <= 0.001) state.nitroLock = true;
    if (state.nitroFuel >= 0.30) state.nitroLock = false;
    const canNitro = state.nitroHeld && !state.nitroLock && !state.paused;
    if (canNitro) {
      if (!state.nitroOn) burst();
      state.nitroOn = true;
      state.nitroFuel = Math.max(0, state.nitroFuel - dt * 0.34);
    } else {
      state.nitroOn = false;
      state.nitroFuel = Math.min(1, state.nitroFuel + dt * 0.13);
    }

    // 速度
    let target = MAX_SPEED * state.cruise;
    if (state.gas) target = MAX_SPEED;
    if (state.nitroOn) target = MAX_SPEED * 1.4;
    if (state.brake || state.paused) target = 0;
    const rate = target > state.speed ? (state.nitroOn ? 2800 : 1500) : 2400;
    state.speed += clamp(target - state.speed, -rate * dt, rate * dt);
    state.speed = clamp(state.speed, 0, MAX_SPEED * 1.4);
    state.distance += state.speed * dt;

    // ハンドル（道路のほうを横に流して曲がって見せる）
    state.steer += (state.steerInput - state.steer) * Math.min(1, dt * 9);
    const maxLat = Math.max(40, ROAD_HALF - CAR_W / 2 + SHOULDER * 0.5);
    state.lateral -= state.steer * (150 + state.speed * 0.30) * dt;
    if (Math.abs(state.steerInput) < 0.01) state.lateral *= Math.max(0, 1 - dt * 1.8);
    state.lateral = clamp(state.lateral, -maxLat, maxLat);

    ensureRoad(state.distance + H + 300);
    state.anchor = roadCenterAt(worldAtY(CAR_Y));

    // スキッド判定
    const hardTurn = Math.abs(state.steer) > 0.55 && state.speed > 520;
    const hardBrake = state.brake && state.speed > 620;
    const skidding = hardTurn || hardBrake || (state.nitroOn && state.speed < MAX_SPEED * 0.55);
    updateSkid(skidding);

    // 煙
    if (skidding) {
      const n = 1 + (state.speed > 900 ? 1 : 0);
      for (let i = 0; i < n; i++) puff(hardTurn ? Math.sign(state.steer) : (Math.random() < .5 ? -1 : 1));
    }
    if (state.nitroOn && Math.random() < 0.7) puff(Math.random() < .5 ? -1 : 1, true);

    // 路肩に乗ったら砂ぼこり
    const offRoad = Math.abs(state.lateral) > ROAD_HALF - CAR_W / 2;
    if (offRoad && state.speed > 300 && Math.random() < 0.8) puff(-Math.sign(state.lateral));

    updateParticles(dt);

    // エンジン音（速度・ニトロに追従）
    SND.update(clamp(state.speed / MAX_SPEED, 0, 1.4), state.nitroOn);

    // 説明ラベルの表示時間
    if (state.guideTimer > 0) state.guideTimer -= dt;
  }

  function updateSkid(on) {
    if (on) {
      const w = worldAtY(CAR_Y);
      const cx = centerAtW(w);
      if (!activeSkid) {
        activeSkid = [{ pts: [] }, { pts: [] }];
        skidStrokes.push(activeSkid[0], activeSkid[1]);
        lastSkidW = -1e9;
      }
      if (w - lastSkidW > 10) {
        lastSkidW = w;
        activeSkid[0].pts.push({ w, dx: (W / 2 - TIRE_DX) - cx });
        activeSkid[1].pts.push({ w, dx: (W / 2 + TIRE_DX) - cx });
      }
    } else {
      activeSkid = null;
    }
    // 画面の下に流れ切ったものを捨てる
    if (skidStrokes.length > 60 || Math.random() < 0.1) {
      for (let i = 0; i < skidStrokes.length; i++) {
        const pts = skidStrokes[i].pts;
        while (pts.length > 2 && pts[1].w < state.distance - 140) pts.shift();
      }
      skidStrokes = skidStrokes.filter((s) => {
        if (s === (activeSkid && activeSkid[0]) || s === (activeSkid && activeSkid[1])) return true;
        return s.pts.length && s.pts[s.pts.length - 1].w > state.distance - 120;
      });
    }
  }

  function puff(side, exhaust) {
    if (smoke.length > 150) return;
    const w = worldAtY(CAR_Y + CAR_L * 0.42) - Math.random() * 20;
    const cx = centerAtW(w);
    const dx = (W / 2 + side * (exhaust ? TIRE_DX * 0.45 : TIRE_DX)) - cx + (Math.random() * 16 - 8);
    smoke.push({
      w, dx,
      r: (exhaust ? 14 + Math.random() * 10 : 20 + Math.random() * 16) * SMOKE_SCALE,
      life: exhaust ? 0.5 : 0.9 + Math.random() * 0.5,
      max: exhaust ? 0.5 : 1.4,
      vx: side * (30 + Math.random() * 90),
      vw: -(60 + Math.random() * 140),
      tint: exhaust ? 1 : 0
    });
    if (exhaust && sparks.length < 60) {
      sparks.push({
        w, dx: dx * 0.4,
        life: 0.28, max: 0.28,
        vx: (Math.random() * 2 - 1) * 120
      });
    }
  }

  function burst() {
    for (let i = 0; i < 14; i++) puff(Math.random() < .5 ? -1 : 1, true);
  }

  function updateParticles(dt) {
    for (let i = smoke.length - 1; i >= 0; i--) {
      const p = smoke[i];
      p.life -= dt;
      p.r += dt * (p.tint ? 90 : 55);
      p.dx += p.vx * dt;
      p.w += p.vw * dt;
      if (p.life <= 0 || screenY(p.w) > H + 120) smoke.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      s.dx += s.vx * dt;
      s.w -= 500 * dt;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  // ── 描画 ───────────────────────────────────────────
  const EDGE_STEP = 16;
  let edges = [];

  function computeEdges() {
    edges.length = 0;
    for (let y = H + EDGE_STEP; y >= -EDGE_STEP * 2; y -= EDGE_STEP) {
      edges.push({ y, cx: centerAtY(y) });
    }
  }

  function bandPath(half) {
    ctx.beginPath();
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (i === 0) ctx.moveTo(e.cx - half, e.y); else ctx.lineTo(e.cx - half, e.y);
    }
    for (let i = edges.length - 1; i >= 0; i--) {
      const e = edges[i];
      ctx.lineTo(e.cx + half, e.y);
    }
    ctx.closePath();
  }

  function strokeAlong(offset, width, color, dashRange) {
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (dashRange && (e.y < dashRange[0] || e.y > dashRange[1])) { started = false; continue; }
      const x = e.cx + offset;
      if (!started) { ctx.moveTo(x, e.y); started = true; } else ctx.lineTo(x, e.y);
    }
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawBackground() {
    ctx.fillStyle = P.grass;
    ctx.fillRect(0, 0, W, H);

    // 横じま（速度が伝わるように）
    const band = 190;
    ctx.fillStyle = P.grassAlt;
    let k = Math.floor(state.distance / band) - 1;
    for (; ; k++) {
      const y = screenY(k * band);
      if (y < -band) break;
      if (y > H + band) continue;
      ctx.fillRect(0, y - band * 0.5, W, band * 0.5);
    }
  }

  function drawScenery() {
    const spacing = 240;
    let k = Math.floor((state.distance - 200) / spacing);
    for (; ; k++) {
      const w = k * spacing + hash(k * 1.7) * 120;
      const y = screenY(w);
      if (y < -140) break;
      if (y > H + 140) continue;

      const side = hash(k * 3.1) > 0.5 ? 1 : -1;
      const dist = ROAD_HALF + SHOULDER + 20 + hash(k * 5.3) * 90;
      const x = centerAtY(y) + side * dist;
      if (x < -90 || x > W + 90) continue;

      const type = hash(k * 7.9);
      if (type < 0.72) {
        const r = 26 + hash(k * 11.3) * 16;
        ctx.fillStyle = P.trunk;
        ctx.fillRect(x - 5, y, 10, 22);
        ctx.fillStyle = hash(k * 13.7) > 0.5 ? P.tree : P.treeAlt;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 標識ポール
        ctx.fillStyle = P.trunk;
        ctx.fillRect(x - 3, y - 26, 6, 34);
        ctx.fillStyle = state.night ? '#5c6470' : '#e8eaee';
        ctx.beginPath();
        ctx.arc(x, y - 34, 13, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawRoad() {
    // 路肩
    bandPath(ROAD_HALF + SHOULDER);
    ctx.fillStyle = P.shoulder;
    ctx.fill();

    // 路肩の砂利
    ctx.fillStyle = P.shoulderDot;
    const gs = 46;
    let k = Math.floor(state.distance / gs) - 1;
    for (; ; k++) {
      const w = k * gs;
      const y = screenY(w);
      if (y < -20) break;
      if (y > H + 20) continue;
      const cx = centerAtY(y);
      for (let s = -1; s <= 1; s += 2) {
        const off = ROAD_HALF + 6 + hash(k * (s > 0 ? 2.3 : 4.1)) * (SHOULDER - 10);
        ctx.fillRect(cx + s * off, y, 3, 3);
      }
    }

    // アスファルト
    bandPath(ROAD_HALF);
    ctx.fillStyle = P.road;
    ctx.fill();

    // 舗装の継ぎ目
    ctx.strokeStyle = P.roadSeam;
    ctx.lineWidth = 3;
    const seam = 420;
    let m = Math.floor(state.distance / seam) - 1;
    for (; ; m++) {
      const y = screenY(m * seam);
      if (y < -10) break;
      if (y > H + 10) continue;
      const cx = centerAtY(y);
      ctx.beginPath();
      ctx.moveTo(cx - ROAD_HALF, y);
      ctx.lineTo(cx + ROAD_HALF, y);
      ctx.stroke();
    }
  }

  function drawSkid() {
    ctx.strokeStyle = P.skid;
    ctx.lineWidth = TIRE_W;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < skidStrokes.length; i++) {
      const pts = skidStrokes[i].pts;
      if (pts.length < 2) continue;
      ctx.beginPath();
      let started = false;
      for (let j = 0; j < pts.length; j++) {
        const p = pts[j];
        const y = screenY(p.w);
        if (y < -60 || y > H + 60) { started = false; continue; }
        const x = centerAtW(p.w) + p.dx;
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  function drawLines() {
    // 外側の白線
    strokeAlong(-(ROAD_HALF - 9), 6, P.edge);
    strokeAlong(ROAD_HALF - 9, 6, P.edge);

    // センターライン（破線）
    const period = 190, len = 105;
    ctx.lineWidth = 9;
    ctx.strokeStyle = P.center;
    let k = Math.floor(state.distance / period) - 1;
    for (; ; k++) {
      const w0 = k * period, w1 = w0 + len;
      const yBottom = screenY(w0), yTop = screenY(w1);
      if (yBottom < -40) break;
      if (yTop > H + 40) continue;
      ctx.beginPath();
      const steps = 5;
      for (let i = 0; i <= steps; i++) {
        const y = yTop + (yBottom - yTop) * (i / steps);
        const x = centerAtY(y);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawSmoke() {
    ctx.globalAlpha = 1;
    for (let i = 0; i < smoke.length; i++) {
      const p = smoke[i];
      const y = screenY(p.w);
      if (y < -100 || y > H + 100) continue;
      const x = centerAtW(p.w) + p.dx;
      const a = clamp(p.life / p.max, 0, 1) * P.smokeAlpha * (p.tint ? 0.8 : 1);
      ctx.globalAlpha = a;
      ctx.drawImage(smokeSprite, x - p.r, y - p.r, p.r * 2, p.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawNitro() {
    if (!state.nitroOn && sparks.length === 0) return;

    // 火花
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      const y = screenY(s.w);
      const x = centerAtW(s.w) + s.dx;
      const a = clamp(s.life / s.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = a > 0.6 ? '#bff4ff' : '#3fd2f0';
      ctx.fillRect(x - 2, y - 8, 4, 16);
    }
    ctx.globalAlpha = 1;

    if (state.nitroOn) {
      // 後方の炎
      const baseY = CAR_Y + CAR_L * 0.48;
      const flick = 0.75 + Math.random() * 0.35;
      for (let s = -1; s <= 1; s += 2) {
        const x = W / 2 + s * CAR_W * 0.22;
        const g = ctx.createLinearGradient(x, baseY, x, baseY + 150 * flick);
        g.addColorStop(0, 'rgba(210,250,255,.9)');
        g.addColorStop(.35, 'rgba(70,215,245,.55)');
        g.addColorStop(1, 'rgba(30,120,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(x - 22, baseY);
        ctx.quadraticCurveTo(x, baseY + 170 * flick, x + 22, baseY);
        ctx.closePath();
        ctx.fill();
      }

      // スピードライン
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const x = hash(i * 7.7) * W;
        const len = 70 + hash(i * 3.1) * 140;
        const y = ((state.distance * 2.2 + hash(i * 11.3) * 3000) % (H + 400)) - 200;
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + len);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawNight() {
    // 全体を落とす
    ctx.drawImage(vignette, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 街灯
    const spacing = 900;
    let k = Math.floor((state.distance - 300) / spacing);
    for (; ; k++) {
      const w = k * spacing;
      const y = screenY(w);
      if (y < -200) break;
      if (y > H + 200) continue;
      const x = centerAtY(y) + (ROAD_HALF + SHOULDER * 0.6);
      const r = 210;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(glowSprite, x - r, y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;

    // ヘッドライト
    const hw = W * 1.15, hh = hw * (720 / 560);
    ctx.drawImage(headlight, W / 2 - hw / 2, CAR_Y - CAR_L * 0.45 - hh, hw, hh);

    ctx.globalCompositeOperation = 'source-over';

    // 街灯のポール
    ctx.fillStyle = '#2a2f36';
    const spacing2 = 900;
    let m = Math.floor((state.distance - 300) / spacing2);
    for (; ; m++) {
      const y = screenY(m * spacing2);
      if (y < -60) break;
      if (y > H + 60) continue;
      const x = centerAtY(y) + (ROAD_HALF + SHOULDER * 0.6);
      ctx.fillRect(x - 4, y, 8, 26);
    }
  }

  // 上から見たスポーツカー（ガイド兼、実物を置く目印）
  function drawCarShape(x, y, L, Wd, alpha) {
    const u = (fx, fy) => [fx * Wd, fy * L];
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;

    // タイヤ（前は細く、後ろは太く）
    ctx.fillStyle = 'rgba(14,16,20,.92)';
    [[-0.30, 0.15, 0.15], [0.31, 0.17, 0.17]].forEach((t) => {
      const tw = t[1] * Wd, th = t[2] * L;
      for (let sx = -1; sx <= 1; sx += 2) {
        const x0 = sx > 0 ? 0.40 * Wd : -(0.40 * Wd + tw);
        roundRect(x0, t[0] * L - th / 2, tw, th, Math.max(1.5, tw * 0.3));
        ctx.fill();
      }
    });

    // リアウイング
    ctx.fillStyle = 'rgba(18,20,26,.9)';
    roundRect(-0.48 * Wd, 0.48 * L, 0.96 * Wd, 0.065 * L, Math.max(1.5, L * 0.012));
    ctx.fill();

    // ボディ
    ctx.beginPath();
    ctx.moveTo(...u(0, -0.500));
    ctx.bezierCurveTo(...u(0.14, -0.500), ...u(0.24, -0.478), ...u(0.30, -0.425));
    ctx.bezierCurveTo(...u(0.38, -0.375), ...u(0.475, -0.345), ...u(0.48, -0.275));
    ctx.bezierCurveTo(...u(0.485, -0.195), ...u(0.40, -0.130), ...u(0.40, -0.020));
    ctx.bezierCurveTo(...u(0.40, 0.080), ...u(0.50, 0.130), ...u(0.50, 0.260));
    ctx.bezierCurveTo(...u(0.50, 0.400), ...u(0.46, 0.500), ...u(0.34, 0.500));
    ctx.lineTo(...u(-0.34, 0.500));
    ctx.bezierCurveTo(...u(-0.46, 0.500), ...u(-0.50, 0.400), ...u(-0.50, 0.260));
    ctx.bezierCurveTo(...u(-0.50, 0.130), ...u(-0.40, 0.080), ...u(-0.40, -0.020));
    ctx.bezierCurveTo(...u(-0.40, -0.130), ...u(-0.485, -0.195), ...u(-0.48, -0.275));
    ctx.bezierCurveTo(...u(-0.475, -0.345), ...u(-0.38, -0.375), ...u(-0.30, -0.425));
    ctx.bezierCurveTo(...u(-0.24, -0.478), ...u(-0.14, -0.500), ...u(0, -0.500));
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,106,0,.55)';
    ctx.fill();
    ctx.lineWidth = Math.max(2, L * 0.014);
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.stroke();

    // ドアミラー
    ctx.fillStyle = 'rgba(255,106,0,.85)';
    for (let sx = -1; sx <= 1; sx += 2) {
      const x0 = sx > 0 ? 0.40 * Wd : -0.54 * Wd;
      roundRect(x0, -0.075 * L, 0.14 * Wd, 0.045 * L, Math.max(1, L * 0.008));
      ctx.fill();
    }

    // キャノピー
    ctx.beginPath();
    ctx.moveTo(...u(-0.17, 0.010));
    ctx.lineTo(...u(0.17, 0.010));
    ctx.lineTo(...u(0.25, 0.200));
    ctx.lineTo(...u(-0.25, 0.200));
    ctx.closePath();
    ctx.fillStyle = 'rgba(18,24,32,.8)';
    ctx.fill();

    // リアデッキのルーバー
    ctx.fillStyle = 'rgba(18,20,26,.45)';
    for (let k = 0; k < 3; k++) {
      ctx.fillRect(-0.22 * Wd, (0.25 + k * 0.035) * L, 0.44 * Wd, 0.02 * L);
    }

    // センターストライプ
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fillRect(-0.085 * Wd, -0.42 * L, 0.05 * Wd, 0.36 * L);
    ctx.fillRect(0.035 * Wd, -0.42 * L, 0.05 * Wd, 0.36 * L);

    // ヘッドライトとテールランプ
    ctx.fillStyle = state.night ? '#fff6d0' : 'rgba(255,240,200,.95)';
    for (let sx = -1; sx <= 1; sx += 2) {
      roundRect(sx > 0 ? 0.16 * Wd : -0.30 * Wd, -0.455 * L, 0.14 * Wd, 0.04 * L, Math.max(1, L * 0.008));
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,60,70,.9)';
    roundRect(-0.26 * Wd, 0.44 * L, 0.52 * Wd, 0.035 * L, Math.max(1, L * 0.008));
    ctx.fill();

    ctx.restore();
  }

  function drawGuide() {
    const show = state.guideAlways || state.guideTimer > 0;
    if (!show) return;
    const alpha = state.guideAlways ? 1 : clamp(state.guideTimer, 0, 1);

    drawCarShape(W / 2, CAR_Y, CAR_L, CAR_W, alpha * 0.95);

    // 置き場所がひと目で分かるように、最初だけ説明を出す
    if (state.guideTimer > 0) {
      const a = clamp(state.guideTimer, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      const label = 'ここに ミニカーを おいてね';
      ctx.font = '600 15px -apple-system, "Hiragino Sans", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(label).width + 24;
      // 横画面など 高さが低いときは、操作パネルに かくれないよう 車の上に出す
      const ly = H < 560 ? CAR_Y - CAR_L / 2 - 30 : CAR_Y + CAR_L / 2 + 30;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      roundRect(W / 2 - tw / 2, ly - 17, tw, 34, 17);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(label, W / 2, ly);
      ctx.restore();
    }
  }

  // 画面タッチ中の向きを知らせる
  function drawTouchHint() {
    if (!state.touchSteer) return;
    const dir = state.touchSteer;
    ctx.save();
    const g = ctx.createLinearGradient(dir < 0 ? 0 : W, 0, dir < 0 ? W * 0.45 : W * 0.55, 0);
    g.addColorStop(0, 'rgba(255,255,255,.14)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(dir < 0 ? 0 : W * 0.55, 0, W * 0.45, H);

    const x = dir < 0 ? W * 0.14 : W * 0.86, y = H * 0.8;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x + dir * 30, y);
    ctx.lineTo(x - dir * 18, y - 34);
    ctx.lineTo(x - dir * 18, y + 34);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    computeEdges();
    drawBackground();
    drawScenery();
    drawRoad();
    drawSkid();
    drawLines();
    drawSmoke();
    drawNitro();
    if (state.night) drawNight();
    drawGuide();
    drawTouchHint();
  }

  // ── HUD ────────────────────────────────────────────
  let hudAcc = 0;
  function updateHud() {
    $('speedVal').textContent = Math.round(state.speed * 0.155);
    $('nitroFill').style.width = (state.nitroFuel * 100).toFixed(0) + '%';
    $('padNitro').classList.toggle('empty', state.nitroLock);
    if (state.showFps) $('fps').textContent = state.fps.toFixed(0) + 'fps';
  }

  // ── メインループ ───────────────────────────────────
  let last = performance.now(), frames = 0, fpsAcc = 0;
  let rafId = 0, running = false, booted = false;

  function startLoop() {
    if (running) return;
    running = true;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stopLoop() {
    running = false;
    cancelAnimationFrame(rafId);
  }

  function frame(t) {
    if (!running) return;
    rafId = requestAnimationFrame(frame);
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) return;

    update(dt);
    render();

    frames++; fpsAcc += dt; hudAcc += dt;
    if (fpsAcc >= 0.5) { state.fps = frames / fpsAcc; frames = 0; fpsAcc = 0; }
    if (hudAcc >= 0.1) { hudAcc = 0; updateHud(); }
  }

  // ── 起動 ───────────────────────────────────────────
  function init() {
    try {
      if (!ctx) throw new Error('この端末では 道路の表示（Canvas）が使えません。');
      boot();
      booted = true;
    } catch (err) {
      showError(err);
      return;                       // 初期化に失敗したら 描画ループは始めない
    }
    if (document.visibilityState === 'visible') startLoop();
    // テスト用に 状態を見られるようにする（遊び方には影響しない）
    window.__minicar = { state: state, SND: SND, isRunning: function () { return running; } };
  }

  function showError(err) {
    const box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:12px;right:12px;top:80px;z-index:99;padding:12px 14px;' +
      'background:#ff2d55;color:#fff;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap';
    box.textContent = 'ミニカーロードを はじめられませんでした。\n' + (err && (err.message || err)) +
      '\n左上の「← もどる」で ゲームの一覧に もどれます。';
    document.body.appendChild(box);
  }

  function boot() {
    smokeSprite = makeSmokeSprite();
    glowSprite = makeGlowSprite();
    headlight = makeHeadlight();

    applyCarSize();
    resize();
    bindUI();
    setKids(true);
    setNight(false);
    setPaused(false);
    setSirenUI(false);
    $('carSizeVal').textContent = sizeLabel();
    updateHud();

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 300));

    // ホーム画面追加の案内（Safariで未インストールのときだけ）
    try {
      const standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      let seen = false;
      try { seen = !!localStorage.getItem('installHintSeen'); } catch (_) { seen = false; }
      if (isIOS && !standalone && !seen) {
        $('install').hidden = false;
        $('installClose').addEventListener('click', () => {
          try { localStorage.setItem('installHintSeen', '1'); } catch (_) { }
        });
      }
    } catch (_) { }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();

</script>
<script src="../../back.js" data-home="../../index.html"></script>
</body>
