<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>はやい？ ゆっくり？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#eef8f0;color:#17324a;user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:8px}.p{font-weight:900}.g{font-size:23px;font-weight:900;text-align:center;min-height:32px}.road{width:min(92vw,430px);height:118px;border-radius:24px;background:#d8e2e6;position:relative;overflow:hidden;border:5px solid #fff}.road:after{content:"";position:absolute;left:0;right:0;top:55px;border-top:5px dashed #fff}.car{position:absolute;left:18px;top:25px;font-size:58px;z-index:2}.car.go{animation:drive var(--dur) linear 1}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(94vw,430px)}.choice{border:0;border-radius:24px;min-height:116px;font:900 20px inherit;background:#fff;box-shadow:0 5px 0 #17324a22;position:relative}.choice .ico{display:block;font-size:48px}.choice.hint{animation:glow 1s infinite}.finger{position:absolute;right:5px;top:-18px;font-size:35px}.play{border:0;border-radius:18px;background:#5aa9df;color:#fff;padding:11px 20px;font:900 18px inherit;min-height:48px}.status{min-height:31px;font-size:21px;font-weight:900}.star{position:fixed;font-size:30px;pointer-events:none;animation:fly .75s forwards}.done{position:fixed;inset:0;background:#fffaf0f3;display:none;place-items:center;text-align:center;z-index:20}.done.show{display:grid}.done b{font-size:30px}.done button{border:0;border-radius:18px;background:#5aa9df;color:#fff;padding:14px 22px;font:900 18px inherit;margin-top:18px}@keyframes drive{from{left:18px}to{left:calc(100% - 75px)}}@keyframes glow{50%{transform:scale(1.04);box-shadow:0 0 0 8px #ffd95a88}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-height:700px){.road{height:92px}.car{font-size:48px;top:15px}.road:after{top:43px}.choice{min-height:94px}.choice .ico{font-size:40px}}</style><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head><body><main class="app"><div class="p" id="p">1 / 6</div><div class="g">どっちの はやさ？</div><div class="road"><span class="car" id="car">🚗</span></div><button class="play" id="play">▶️ もういちど みる</button><div class="choices"><button class="choice" data-a="fast"><span class="ico">🏎️💨</span>はやい<span class="finger" id="finger">👆</span></button><button class="choice" data-a="slow"><span class="ico">🚜</span>ゆっくり</button></div><div class="status" id="status"></div></main><div class="done" id="done"><div>🎉 🚗 🎉<br><b>はやさ はかせ！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const rounds=['slow','fast','slow','fast','fast','slow'];let q=0,busy=false,ctx;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.setValueAtTime(ok?620:300,t);if(ok)o.frequency.setValueAtTime(820,t+.08);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.22)}function fanfare(){[523,659,784].forEach((f,i)=>setTimeout(()=>{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.03,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(c.destination);o.start();o.stop(t+.24)},i*130))}function speak(t,cb){return NoriVoice.speak(t,cb);}function burst(){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left='50%';s.style.top='62%';s.style.setProperty('--x',(Math.random()*180-90)+'px');s.style.setProperty('--y',(-40-Math.random()*130)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}function answer(){return rounds[q]}function showRun(){const car=$('#car');car.classList.remove('go');void car.offsetWidth;car.style.setProperty('--dur',answer()==='fast'?'1.15s':'3.1s');car.classList.add('go')}function render(){busy=false;$('#p').textContent=`${q+1} / 6`;$('#status').textContent='';$('#finger').style.display=q===0?'block':'none';$$('.choice').forEach(b=>b.classList.toggle('hint',q<2&&b.dataset.a===answer()));setTimeout(showRun,250)}function choose(e){if(busy)return;ac();busy=true;const a=e.currentTarget.dataset.a;if(a===answer()){tone(true);burst();$('#status').textContent='⭐ せいかい！';speak(a==='fast'?'せいかい。はやいね！':'せいかい。ゆっくりだね！',()=>{q++;if(q===6){fanfare();$('#done').classList.add('show');speak('ぜんぶ できた。はやさ はかせ！')}else render()})}else{tone(false);$('#status').textContent='🙂 もういちど';const name=a==='fast'?'はやい':'ゆっくり';speak(`${name}を えらんだね。もういちど うごきを みてみよう`,()=>{busy=false;showRun()})}}$$('.choice').forEach(b=>b.addEventListener('click',choose));$('#play').addEventListener('click',()=>{ac();showRun()});$('#again').addEventListener('click',()=>{q=0;$('#done').classList.remove('show');render()});document.addEventListener('norimono-started',()=>{ac();if(window.__noriSkipIntro||window.__noriIntroSpoken)render();else speak('くるまの うごきを みて、はやいか ゆっくりか えらんでね',render)});render()})();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
