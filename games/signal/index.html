<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>しんごう できるかな</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;overflow:hidden}body{background:linear-gradient(#bfe7ff 0 58%,#cfe6b6 58% 70%,#59636b 70%);color:#17324a;user-select:none;-webkit-user-select:none}.wrap{height:100%;padding:calc(env(safe-area-inset-top) + 54px) 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center}.top{width:100%;display:flex;justify-content:center;gap:8px}.dot{width:13px;height:13px;border-radius:50%;background:#fff8;box-shadow:inset 0 0 0 2px #17324a22}.dot.on{background:#f6c945}.prompt{font-size:21px;font-weight:900;margin:8px 0 5px}.signal{width:82px;height:166px;border-radius:25px;background:#26343e;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 7px 0 #17232b;position:relative}.lamp{flex:1;border-radius:50%;background:#111b;box-shadow:inset 0 3px 8px #0008}.lamp.red.on{background:#ff4f4f;box-shadow:0 0 22px #ff5a5a}.lamp.yellow.on{background:#ffd84d;box-shadow:0 0 22px #ffd84d}.lamp.green.on{background:#48d36c;box-shadow:0 0 22px #48d36c}.count{position:absolute;right:-62px;top:52px;width:50px;height:50px;border-radius:50%;background:#fff;color:#17324a;display:none;place-items:center;font-size:29px;font-weight:1000;box-shadow:0 4px 0 #0002}.count.show{display:grid;animation:pulse .7s infinite alternate}.road{margin-top:auto;width:100%;height:38%;position:relative;border-top:5px solid #fff6;border-bottom:5px solid #fff6}.road:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px dashed #f7d956}.car{position:absolute;left:10%;bottom:16%;width:145px;height:82px;border:0;background:transparent;padding:0;touch-action:manipulation;filter:drop-shadow(0 5px 2px #0004);transition:left .55s ease,transform .12s}.car:active{transform:scale(.95)}.car.go{left:67%}.car.shake{animation:shake .32s}.car svg{width:100%;height:100%}.hand{position:absolute;left:44%;bottom:7%;font-size:42px;animation:bob .8s infinite alternate;pointer-events:none}.msg{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:#fff;border-radius:18px;padding:8px 15px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 #0002}.stars{position:fixed;inset:0;pointer-events:none}.star{position:absolute;font-size:28px;animation:pop .75s forwards}@keyframes pop{0%{transform:scale(.2);opacity:0}35%{transform:scale(1.3);opacity:1}100%{transform:translateY(-45px) scale(.8);opacity:0}}@keyframes bob{to{transform:translateY(-8px)}}@keyframes pulse{to{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.finish{position:fixed;inset:0;background:#fffdf2ee;display:none;place-items:center;text-align:center;z-index:20}.finish.show{display:grid}.finish h2{font-size:34px;margin:0 0 12px}.finish button{font:900 22px inherit;border:0;border-radius:22px;padding:16px 26px;background:#f6c945;color:#17324a;box-shadow:0 5px 0 #c79b21}@media(max-width:380px){.signal{width:70px;height:142px}.count{right:-55px;top:44px;width:46px;height:46px;font-size:26px}.prompt{font-size:18px}.car{width:126px}.wrap{padding-top:50px}}</style></head><body><div class="wrap"><div class="top" id="dots"></div><div class="prompt" id="prompt">しんごうを みてね</div><div class="signal"><div class="lamp red" id="red"></div><div class="lamp yellow" id="yellow"></div><div class="lamp green" id="green"></div><div class="count" id="count">3</div></div><div class="road"><button class="car" id="car" aria-label="くるまをタップ"><svg viewBox="0 0 180 100"><path d="M18 67v-19c0-8 6-14 14-14h18l18-22h52c8 0 14 3 19 9l14 18 12 4c7 2 11 8 11 15v9z" fill="#ef7f5b" stroke="#8f4635" stroke-width="4"/><path d="M63 34l14-17h39c5 0 9 2 12 6l9 11z" fill="#bfe7ff"/><circle cx="50" cy="70" r="16" fill="#26343e"/><circle cx="50" cy="70" r="7" fill="#dce3e8"/><circle cx="143" cy="70" r="16" fill="#26343e"/><circle cx="143" cy="70" r="7" fill="#dce3e8"/><circle cx="25" cy="51" r="5" fill="#fff3a8"/></svg></button><div class="hand" id="hand">👆</div><div class="msg" id="msg">くるまを タップ！</div></div></div><div class="stars" id="stars"></div><div class="finish" id="finish"><div><div style="font-size:70px">🚦🚗✨</div><h2>できた！</h2><p>しんごう めいじん！</p><button id="again">もういちど</button></div></div><script>const rounds=['green','green','red','green','red'];let q=0,locked=false,ctx,redTimer=null;const $=id=>document.getElementById(id);$('dots').innerHTML=rounds.map(()=>'<i class="dot"></i>').join('');function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(f,t=.12,v=.045,d=0){audio();const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+d;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+t);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+t+.03)}function good(){tone(523,.14);tone(659,.14,.04,.1);tone(784,.2,.04,.2)}function soft(){tone(260,.16,.025);tone(220,.18,.02,.12)}function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,.045,i*.13))}function speak(text,done){if(!('speechSynthesis'in window)){setTimeout(done||(()=>{}),700);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.86;u.pitch=1.06;if(done)u.onend=()=>setTimeout(done,350);speechSynthesis.speak(u)}function lights(c){['red','yellow','green'].forEach(x=>$(x).classList.toggle('on',x===c))}function stars(){for(let i=0;i<8;i++){const s=document.createElement('b');s.className='star';s.textContent='⭐';s.style.left=(28+Math.random()*45)+'%';s.style.top=(45+Math.random()*25)+'%';$('stars').appendChild(s);setTimeout(()=>s.remove(),800)}}function clearRedTimer(){if(redTimer){clearInterval(redTimer);redTimer=null}$('count').classList.remove('show')}function startRedWait(){locked=true;$('hand').style.display='none';$('msg').textContent='あかは とまるよ';let n=3;$('count').textContent=n;$('count').classList.add('show');speak('あか。とまって まとうね');redTimer=setInterval(()=>{n--;if(n>0){$('count').textContent=n;tone(330,.08,.015)}else{clearRedTimer();lights('green');$('prompt').textContent='あお！ すすめ！';$('msg').textContent='くるまを タップ！';$('hand').style.display='block';locked=false;good();speak('あおになったよ。すすめ！')}},1000)}function start(){clearRedTimer();locked=false;$('car').classList.remove('go','shake');$('hand').style.display='block';$('msg').textContent='くるまを タップ！';document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<q));let c=rounds[q];if(q>=2&&Math.random()>.65)c=c==='red'?'green':'red';rounds[q]=c;lights(c);$('prompt').textContent=q<2?'あおなら すすめ！':'しんごうを みてね';if(c==='green')speak('あお。すすめ！');else startRedWait()}function next(){q++;if(q>=rounds.length){clearRedTimer();document.querySelectorAll('.dot').forEach(d=>d.classList.add('on'));fanfare();stars();speak('できた！しんごう めいじん！',()=>$('finish').classList.add('show'));return}start()}$('car').addEventListener('click',()=>{audio();if(locked)return;const isGreen=$('green').classList.contains('on');if(isGreen){locked=true;good();stars();$('car').classList.add('go');$('hand').style.display='none';$('msg').textContent='せいかい！';speak('せいかい！あおは すすめ！',next)}else{soft();$('car').classList.remove('shake');void $('car').offsetWidth;$('car').classList.add('shake');$('msg').textContent='あかは とまるよ';speak('あかだよ。とまろうね')}});$('again').onclick=()=>{q=0;$('finish').classList.remove('show');start()};document.addEventListener('pointerdown',audio,{once:true});setTimeout(start,500)</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
