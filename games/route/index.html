<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>どっちのみち？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#dff2ff;color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:6px}.count{font-weight:900}.prompt{font-size:23px;font-weight:900;text-align:center}.goal{font-size:13px;font-weight:800}.stage{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}.car{font-size:58px;text-align:center;filter:drop-shadow(0 4px 2px #0002)}.roads{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}.road{position:relative;border:0;border-radius:25px;background:#626d75;box-shadow:0 5px 0 #3e474d;min-height:190px;overflow:hidden;touch-action:manipulation}.road:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:5px dashed #fff8}.road:active{transform:translateY(3px)}.thing{position:absolute;left:50%;transform:translateX(-50%);font-size:55px;z-index:2}.thing.one{top:40%}.thing.two{top:68%}.road.good{outline:7px solid #65d47b}.road.bad{animation:shake .3s}.hand{position:absolute;z-index:4;right:10px;top:8px;font-size:38px;animation:tap .9s infinite}.fx{position:fixed;inset:0;pointer-events:none;z-index:9}.star{position:absolute;font-size:30px;animation:fly .7s forwards}.done{position:fixed;inset:0;display:none;place-items:center;background:#fffdf0ee;z-index:10;text-align:center}.done.show{display:grid}.done b{font-size:31px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#65c77a;color:#fff;font:900 18px inherit}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes tap{50%{transform:translateY(7px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:380px){.prompt{font-size:20px}.thing{font-size:48px}.roads{gap:7px}.road{min-height:160px}}</style></head><body><main class="app"><div class="count" id="count"></div><div class="prompt" id="prompt">とおれる みちは どっち？</div><div class="goal" id="goal">🚗 → 🏠</div><div class="stage"><div class="car">🚗</div><div class="roads" id="roads"></div></div></main><div class="fx" id="fx"></div><div class="done" id="done"><div>🎉⭐🚗🏠<br><b>おうちに ついた！</b><br><button id="again">もういちど</button></div></div><script>
const ROUNDS=[{bad:['🪨'],say:'いわ'},{bad:['🚧'],say:'こうじ'},{bad:['🌳'],say:'き'},{bad:['🪨','🪵'],say:'いわと き'},{bad:['🚧','🌳'],say:'こうじと き'}];let q=0,busy=false,ctx=null,seq=0;const $=id=>document.getElementById(id);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,d=.13,v=.025,delay=0){let c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}function good(){tone(560);tone(760,.17,.025,.11)}function soft(){tone(250,.15,.012);tone(210,.14,.01,.11)}function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,.027,i*.12))}function speak(text,cb){let s=++seq;if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),700);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.84;u.pitch=1.04;u.volume=.82;let done=false;const end=()=>{if(done||s!==seq)return;done=true;setTimeout(()=>{if(s===seq&&cb)cb()},320)};u.onend=end;u.onerror=end;speechSynthesis.speak(u);setTimeout(()=>{if(!done&&!speechSynthesis.speaking)end()},6000)}function burst(el){let r=el.getBoundingClientRect();for(let i=0;i<7;i++){let x=document.createElement('span');x.className='star';x.textContent='⭐';x.style.left=(r.left+r.width/2)+'px';x.style.top=(r.top+r.height/2)+'px';x.style.setProperty('--x',(Math.random()*160-80)+'px');x.style.setProperty('--y',(-30-Math.random()*120)+'px');$('fx').appendChild(x);setTimeout(()=>x.remove(),750)}}function render(){busy=false;$('count').textContent=`${q+1} / ${ROUNDS.length}`;$('prompt').textContent=q<2?'とおれる みちは どっち？':'じゃまものが ない みちは？';let correct=Math.random()<.5?0:1,roads=$('roads');roads.innerHTML='';[0,1].forEach(i=>{let b=document.createElement('button');b.className='road';b.dataset.ok=String(i===correct);if(i!==correct)ROUNDS[q].bad.forEach((x,j)=>{b.innerHTML+=`<span class="thing ${j?'two':'one'}">${x}</span>`});if(q===0&&i===correct)b.innerHTML+='<span class="hand">👆</span>';b.onclick=()=>pick(b);roads.appendChild(b)});speak(q<2?'じゃまものが ない、あいている みちを おしてね':'おうちまで とおれる みちは どっちかな？')}function pick(b){if(busy)return;if(b.dataset.ok==='true'){busy=true;b.classList.add('good');good();burst(b);speak('せいかい！ このみちなら とおれるね',()=>{q++;if(q>=ROUNDS.length){fanfare();$('done').classList.add('show');speak('できた！ おうちに ついたよ')}else render()})}else{b.classList.add('bad');soft();setTimeout(()=>b.classList.remove('bad'),350);speak(`ここには ${ROUNDS[q].say}が あるね。もういちど さがそう`)}}$('again').onclick=()=>{q=0;$('done').classList.remove('show');render()};document.addEventListener('pointerdown',ac,{once:true});render();</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
