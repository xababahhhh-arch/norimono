<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#264c57"><link rel="manifest" href="../../manifest.webmanifest"><title>あそぼう</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#294b55;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px)}main{max-width:950px;margin:auto}a{color:inherit;touch-action:manipulation}.back{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 15px;border-radius:16px;background:#fff;text-decoration:none;font-weight:700}.back svg{width:25px;height:25px;fill:currentColor}header{margin:28px 0}header span{font-size:13px;font-weight:700;letter-spacing:.15em;color:#6c8e89}h1{font-size:clamp(28px,5vw,44px);margin:10px 0}header p{font-size:18px;line-height:1.6}.drive-card{display:flex;align-items:center;gap:25px;padding:28px;border-radius:32px;background:#d5e6d8;box-shadow:0 7px 0 #b5cbbc;text-decoration:none}.train-art{width:40%;max-width:290px;flex:none}.train-art svg{width:100%}h2{font-size:clamp(24px,4vw,36px);margin:8px 0}.drive-card p{font-size:17px;line-height:1.7}.play{display:inline-block;padding:14px 25px;border-radius:18px;background:#e58b70;color:#fff6e4;font-size:20px;font-weight:850;box-shadow:0 4px 0 #b96f57}.note{font-size:14px;color:#718882;margin-top:25px}.drive-card:active{transform:translateY(3px)}@media(max-width:500px){header{margin:20px 0}.drive-card{flex-direction:column;gap:5px;text-align:center;padding:22px}.train-art{width:65%;max-width:190px}h2{font-size:27px}.drive-card p{font-size:15px}}</style></head><body><main><a class="back" href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-7v-7h-4v7H3Z"/></svg>トップへ</a><header><span>のりもの あそび</span><h1>あそぼう</h1><p>じぶんで うごかす。<br>きょうは うんてんし！</p></header><div id="games"></div><p class="note">スマートフォン・タブレット対応。横向きがおすすめです。</p></main><script type="module">import{drivingSeries}from'./catalog.js';import{trainFront}from'./train/art.js';document.querySelector('#games').innerHTML=drivingSeries.games.map(g=>`<a class="drive-card" href="${g.url}"><div class="train-art">${trainFront}</div><div><h2>${g.title}</h2><p>${g.subtitle}</p><span class="play">うんてんする</span></div></a>`).join('');if('serviceWorker'in navigator)navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script></body></html>
