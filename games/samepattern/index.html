<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おなじ ならび</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f6f1ff;color:#26354a;user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:22px;font-weight:900;text-align:center}.sample{min-height:105px;width:min(92vw,420px);border:4px solid #fff;background:#fff9;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 #7f6dbb33}.sample span,.choice span{font-size:42px}.arrow{font-size:26px;animation:bounce .8s infinite}.choices{width:min(94vw,460px);display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;align-content:center}.choice{border:4px solid #fff;border-radius:24px;background:#d9ecff;min-height:112px;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 #6688aa33;touch-action:manipulation}.choice:active{transform:translateY(4px)}.choice.hint{animation:glow 1s infinite}.choice.good{background:#bcecc8;transform:scale(1.04)}.choice.bad{animation:shake .25s;background:#ffe1e1}.status{min-height:32px;font-size:20px;font-weight:900;text-align:center}.star{position:fixed;font-size:30px;pointer-events:none;animation:fly .7s forwards}.done{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#fffaf2f5;z-index:30}.done.show{display:grid}.done b{font-size:32px}.done button{border:0;border-radius:18px;background:#6cba83;color:#fff;font:900 20px inherit;padding:14px 25px;margin-top:18px}@keyframes glow{50%{box-shadow:0 0 0 9px #ffd45c88}}@keyframes bounce{50%{transform:translateY(8px)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-height:700px){.sample{min-height:82px}.sample span,.choice span{font-size:34px}.choice{min-height:90px}.guide{font-size:19px}}</style><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head><body><main class="app"><div class="progress" id="progress">1 / 6</div><div class="guide">うえと おなじ ならびは？</div><div class="sample" id="sample"></div><div class="arrow" id="arrow">👇</div><div class="choices" id="choices"></div><div class="status" id="status"></div></main><div class="done" id="done"><div>🎉 ⭐ 🎉<br><b>おなじ ならび みつけた！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const sets=[['🚗','🚌','🚲','🚂'],['🍎','⭐','🌼','⚽'],['🚒','🚑','🚕','🚜']];let q=0,busy=false,ctx=null,answer=[];const $=x=>document.getElementById(x);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.value=ok?660:300;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.2)}function fanfare(){[523,659,784].forEach((f,i)=>setTimeout(()=>{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(c.destination);o.start();o.stop(t+.24)},i*130))}function speak(text,cb){return NoriVoice.speak(text,cb);}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--y',(-30-Math.random()*130)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function make(){busy=false;$('status').textContent='';$('progress').textContent=`${q+1} / 6`;const pool=sets[q<2?0:q<4?1:2],len=q<2?2:q<4?3:4;answer=shuffle(pool).slice(0,len);const wrong=[...answer];if(q<3){[wrong[0],wrong[1]]=[wrong[1],wrong[0]]}else{const i=1+Math.floor(Math.random()*(len-1));wrong[i]=pool.find(x=>!answer.includes(x))||wrong[(i+1)%len]}const opts=Math.random()<.5?[answer,wrong]:[wrong,answer];$('sample').innerHTML=answer.map(x=>`<span>${x}</span>`).join('');$('choices').innerHTML=opts.map((a,i)=>`<button class="choice ${q<2&&a.join('')===answer.join('')?'hint':''}" data-ok="${a.join('')===answer.join('')}">${a.map(x=>`<span>${x}</span>`).join('')}</button>`).join('');$('arrow').style.display=q===0?'block':'none';[...document.querySelectorAll('.choice')].forEach(b=>b.onclick=()=>pick(b));if(q===0)speak('うえと おなじ ならびを タッチしてね')}function pick(b){if(busy)return;ac();if(b.dataset.ok==='true'){busy=true;tone(true);b.classList.add('good');burst(b);$('status').textContent='⭐ おなじ！';speak('せいかい。おなじ ならびだね',()=>{q++;if(q>=6){fanfare();$('done').classList.add('show');speak('ぜんぶ できた。おなじ ならび みつけたね！')}else make()})}else{tone(false);b.classList.add('bad');$('status').textContent='🙂 もういちど';setTimeout(()=>b.classList.remove('bad'),350);speak('おしいね。うえの ならびを もういちど みてみよう')}}$('again').onclick=()=>{ac();q=0;$('done').classList.remove('show');make()};document.addEventListener('norimono-started',()=>{ac();make()});make()})();</script><script src="../../back.js" data-home="../../learning.html"></script></body></html>
