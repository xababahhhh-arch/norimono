<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のりもの かげあて</title>
<meta name="theme-color" content="#f6f2e9">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#f6f2e9;color:#17324a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(90% 48% at 0 0,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(160deg,#faf6ee,#eef4f1 62%,#e7eef2);overflow-x:hidden}
.app{min-height:100vh;max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:96px;min-height:48px}
h1{font-size:23px;line-height:1.15;font-weight:900;letter-spacing:.04em}.stars{font-size:21px;letter-spacing:2px;color:#d7a72b;white-space:nowrap}
.prompt{text-align:center;font-size:22px;font-weight:900;min-height:30px}.sub{text-align:center;font-size:13px;font-weight:800;color:#607487;min-height:18px}
.stage{position:relative;min-height:232px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.86);border-radius:30px;background:linear-gradient(145deg,#dbe7e8,#c8d9dc);box-shadow:0 8px 0 rgba(57,78,91,.10);overflow:hidden}
.stage:before{content:"";position:absolute;left:7%;right:7%;bottom:28px;height:6px;border-radius:99px;background:rgba(63,85,94,.18)}
.shadow-wrap{width:min(82%,430px);position:relative;z-index:1;transition:transform .45s ease}.shadow-wrap svg{display:block;width:100%;height:auto;filter:brightness(.18) saturate(0);transition:filter .35s ease,transform .35s ease}.shadow-wrap.reveal svg{filter:none}.shadow-wrap.go{animation:driveAway .85s ease-in forwards}
@keyframes driveAway{0%{transform:translateX(0) scale(1)}35%{transform:translateX(4%) scale(1.04)}100%{transform:translateX(125%) scale(.94)}}
.question-no{position:absolute;top:12px;right:14px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.78);font-size:13px;font-weight:900;color:#536b78}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:176px}.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{appearance:none;border:2px solid rgba(255,255,255,.9);border-radius:24px;background:#fffaf2;box-shadow:0 6px 0 rgba(57,78,91,.13);min-width:0;min-height:160px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#17324a;font:inherit;touch-action:manipulation;transition:transform .08s ease,box-shadow .08s ease,background .2s ease}
.choice:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(57,78,91,.13)}.choice svg{display:block;width:100%;max-height:112px}.choice .name{font-size:15px;font-weight:900;line-height:1.2}.choice.wrong{animation:shake .28s ease;background:#f9e9e4}.choice.correct{background:#e1f2e7}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{min-height:46px;border:0;border-radius:16px;padding:0 16px;font-size:14px;font-weight:900;background:#fff;color:#17324a;box-shadow:0 4px 0 rgba(57,78,91,.12)}
.finish{display:none;text-align:center;padding:18px 8px 26px}.finish.show{display:block}.finish .big{font-size:33px;font-weight:900}.finish p{margin-top:8px;font-weight:800;color:#607487}.finish button{margin-top:16px;min-height:52px;border:0;border-radius:18px;padding:0 22px;background:#17324a;color:white;font-size:17px;font-weight:900}
@media(max-width:430px){.app{gap:9px;padding-left:10px;padding-right:10px}.top{padding-left:88px}.top h1{font-size:19px}.stars{font-size:17px}.prompt{font-size:19px}.stage{min-height:210px;border-radius:24px}.choices{gap:8px;min-height:154px}.choice{min-height:144px;border-radius:20px;padding:6px 4px}.choice svg{max-height:94px}.choice .name{font-size:13px}.choices.three .choice .name{font-size:12px}}
@media(max-width:350px){.top{padding-left:82px}.top h1{font-size:17px}.choices.three{gap:5px}.choice{min-height:132px}.choice svg{max-height:82px}}
@media(prefers-reduced-motion:reduce){.shadow-wrap,.shadow-wrap svg,.choice{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><h1>のりもの かげあて</h1><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div></div>
  <div class="prompt" id="prompt" aria-live="polite">おなじ かたちは どれかな？</div>
  <div class="sub" id="sub">かげを よくみてね</div>
  <section class="stage" id="stage" aria-label="のりものの かげ">
    <span class="question-no" id="qno">1 / 5</span>
    <div class="shadow-wrap" id="shadow"></div>
  </section>
  <section class="choices" id="choices" aria-label="こたえ"></section>
  <div class="actions"><button type="button" id="voice">🔊 もういちど</button></div>
  <section class="finish" id="finish"><div class="big">⭐️ できた！ ⭐️</div><p>5もん ぜんぶ あそべたよ</p><button type="button" id="again">もういちど あそぶ</button></section>
</div>

<script>
'use strict';
(function(){
  const $=id=>document.getElementById(id);
  const CARS=[
    {id:'car',name:'くるま',say:'くるま',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="138" width="292" height="6" rx="3" fill="#b3b8bf"/><path d="M32 112c0-17 9-24 29-27l42-6 31-28c7-6 16-9 28-9h57c14 0 24 6 32 17l18 25 25 5c13 2 19 9 19 22v9H32z" fill="#e26f5d"/><path d="M141 54h38v27h-68zM187 54h28c9 0 14 4 20 12l11 15h-59z" fill="#a9d9ec"/><circle cx="87" cy="121" r="19" fill="#26313a"/><circle cx="87" cy="121" r="8" fill="#c5ccd1"/><circle cx="244" cy="121" r="19" fill="#26313a"/><circle cx="244" cy="121" r="8" fill="#c5ccd1"/></svg>`},
    {id:'bus',name:'バス',say:'バス',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="138" width="300" height="6" rx="3" fill="#b3b8bf"/><rect x="24" y="38" width="270" height="86" rx="19" fill="#e7b64b"/><rect x="42" y="53" width="48" height="37" rx="6" fill="#85c1dc"/><rect x="99" y="53" width="48" height="37" rx="6" fill="#85c1dc"/><rect x="156" y="53" width="48" height="37" rx="6" fill="#85c1dc"/><rect x="213" y="53" width="60" height="37" rx="6" fill="#85c1dc"/><circle cx="80" cy="122" r="18" fill="#26313a"/><circle cx="240" cy="122" r="18" fill="#26313a"/></svg>`},
    {id:'train',name:'でんしゃ',say:'電車',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="139" width="304" height="5" rx="3" fill="#aeb5bb"/><path d="M18 44h250c20 0 31 9 34 29l6 48H18z" fill="#79b36c"/><rect x="37" y="58" width="43" height="34" rx="5" fill="#b9deeb"/><rect x="91" y="58" width="43" height="34" rx="5" fill="#b9deeb"/><rect x="145" y="58" width="43" height="34" rx="5" fill="#b9deeb"/><rect x="199" y="58" width="43" height="34" rx="5" fill="#b9deeb"/><rect x="254" y="57" width="35" height="35" rx="6" fill="#b9deeb"/><rect x="18" y="101" width="290" height="8" fill="#ead766"/><rect x="51" y="122" width="62" height="11" rx="5" fill="#303942"/><rect x="211" y="122" width="62" height="11" rx="5" fill="#303942"/></svg>`},
    {id:'fire',name:'しょうぼうしゃ',say:'しょうぼうしゃ',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="139" width="304" height="5" rx="3" fill="#b3b8bf"/><rect x="25" y="71" width="270" height="51" rx="8" fill="#e8564f"/><path d="M185 71h76l-20-28h-56z" fill="#e8564f"/><path d="M191 49h42l14 20h-56z" fill="#9ed6e8"/><path d="M48 48h134" stroke="#d9dde1" stroke-width="12" stroke-linecap="round"/><path d="M56 42h122M64 54h106" stroke="#818b93" stroke-width="3"/><circle cx="78" cy="122" r="19" fill="#26313a"/><circle cx="246" cy="122" r="19" fill="#26313a"/><rect x="204" y="32" width="34" height="10" rx="4" fill="#ffcf33"/></svg>`},
    {id:'ambulance',name:'きゅうきゅうしゃ',say:'きゅうきゅうしゃ',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="139" width="304" height="5" rx="3" fill="#b3b8bf"/><path d="M25 54h198c16 0 25 7 35 23l29 12c10 4 16 11 16 24v9H25z" fill="#f6f5ef" stroke="#c7ccd0" stroke-width="2"/><rect x="40" y="72" width="124" height="10" fill="#ef5a59"/><rect x="185" y="63" width="47" height="27" rx="5" fill="#a7d8e9"/><rect x="138" y="40" width="42" height="12" rx="5" fill="#e95d5b"/><path d="M98 84h18v-18h13v18h18v13h-18v18h-13V97H98z" fill="#e95d5b"/><circle cx="82" cy="122" r="19" fill="#26313a"/><circle cx="247" cy="122" r="19" fill="#26313a"/></svg>`},
    {id:'plane',name:'ひこうき',say:'飛行機',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><path d="M19 90l119-13 68-52h23l-42 50 91 7c13 1 22 8 23 15-1 8-10 14-23 15l-91 7 42 24h-23l-68-28-119-12z" fill="#83b9dc"/><path d="M62 86h141" stroke="#f4f7f9" stroke-width="7"/><circle cx="269" cy="97" r="5" fill="#f5d35e"/></svg>`},
    {id:'ship',name:'ふね',say:'船',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><path d="M28 103h268l-29 34H57z" fill="#4b83a8"/><rect x="92" y="62" width="136" height="42" rx="7" fill="#f4f1e8"/><rect x="115" y="42" width="90" height="23" rx="5" fill="#e9e5dc"/><rect x="142" y="20" width="28" height="24" rx="4" fill="#d36d52"/><rect x="110" y="73" width="24" height="15" rx="3" fill="#87bfd7"/><rect x="145" y="73" width="24" height="15" rx="3" fill="#87bfd7"/><rect x="180" y="73" width="24" height="15" rx="3" fill="#87bfd7"/><path d="M34 145c24-8 44-8 68 0 24-8 44-8 68 0 24-8 44-8 68 0 24-8 44-8 68 0" fill="none" stroke="#7fc7dd" stroke-width="7" stroke-linecap="round"/></svg>`},
    {id:'shovel',name:'ショベルカー',say:'ショベルカー',svg:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg"><rect x="22" y="126" width="197" height="23" rx="12" fill="#39434b"/><rect x="51" y="96" width="138" height="34" rx="8" fill="#e5b94d"/><path d="M102 49h72c12 0 20 7 23 19l7 28h-102z" fill="#e5b94d"/><path d="M124 58h44c8 0 13 5 15 12l5 18h-64z" fill="#a2d4e6"/><path d="M190 72l53-42 14 15-46 50" fill="none" stroke="#e5b94d" stroke-width="18" stroke-linecap="round"/><path d="M248 35l41 12-17 54-50-12z" fill="#d4a43f"/><circle cx="81" cy="137" r="9" fill="#818a91"/><circle cx="159" cy="137" r="9" fill="#818a91"/></svg>`}
  ];

  let round=[],index=0,score=0,locked=false,current=null,currentSay='';
  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function speak(text){currentSay=text;if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.86;u.pitch=1.05;speechSynthesis.speak(u)}catch(_){} }
  function stars(){ $('stars').textContent=Array.from({length:5},(_,i)=>i<score?'★':'☆').join(' ') }
  function choicesFor(answer,count){const wrong=shuffle(CARS.filter(v=>v.id!==answer.id)).slice(0,count-1);return shuffle([answer,...wrong])}
  function start(){round=shuffle(CARS).slice(0,5);index=0;score=0;locked=false;$('finish').classList.remove('show');$('choices').style.display='grid';$('stage').style.display='grid';$('voice').parentElement.style.display='flex';stars();render()}
  function render(){locked=false;current=round[index];const count=index<2?2:3;const opts=choicesFor(current,count);$('qno').textContent=`${index+1} / 5`;$('prompt').textContent=index<2?'おなじ かたちは どれかな？':index===2?'どの のりものかな？':'かげを よくみて あてよう！';$('sub').textContent=index<2?'まずは ゆっくり みてね':index===2?'3つの なかから えらんでね':'にている かたちにも ちゅうもく';$('shadow').className='shadow-wrap';$('shadow').innerHTML=current.svg;const box=$('choices');box.className='choices'+(count===3?' three':'');box.innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-label',v.name);b.innerHTML=v.svg+`<span class="name">${v.name}</span>`;b.addEventListener('click',()=>pick(b,v));box.appendChild(b)});speak(index<2?'おなじ かたちは どれかな？':index===2?'どの のりものかな？':'かげを よくみて あてよう')}
  function pick(btn,v){if(locked)return;if(v.id!==current.id){btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');$('sub').textContent='もういちど みてみよう';speak('もういちど。かげを よくみてね');return}locked=true;score++;stars();btn.classList.add('correct');$('shadow').classList.add('reveal');$('prompt').textContent='せいかい！';$('sub').textContent=current.name+'！';speak('せいかい。'+current.say+'！');setTimeout(()=>{$('shadow').classList.add('go')},650);setTimeout(()=>{index++;if(index>=5)finish();else render()},1550)}
  function finish(){$('choices').style.display='none';$('stage').style.display='none';$('voice').parentElement.style.display='none';$('finish').classList.add('show');$('prompt').textContent='ぜんぶ できた！';$('sub').textContent='また ちがう かげが でるよ';speak('ぜんぶ できた！すごいね！')}
  $('voice').addEventListener('click',()=>speak(currentSay||'おなじ かたちは どれかな？'));
  $('again').addEventListener('click',start);
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});
  start();
})();
</script>
<script src="../../back.js" data-home="../../index.html"></script>
</body>
</html>
