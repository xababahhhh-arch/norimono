<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のりもの かげあて</title>
<meta name="theme-color" content="#f6f2e9">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:#f6f2e9;color:#17324a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}body{min-height:100vh;background:radial-gradient(90% 48% at 0 0,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(160deg,#faf6ee,#eef4f1 62%,#e7eef2);overflow-x:hidden}.app{min-height:100vh;max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:96px;min-height:48px}h1{font-size:23px;line-height:1.15;font-weight:900;letter-spacing:.04em}.stars{font-size:21px;letter-spacing:2px;color:#d7a72b;white-space:nowrap}.prompt{text-align:center;font-size:22px;font-weight:900;min-height:30px}.sub{text-align:center;font-size:13px;font-weight:800;color:#607487;min-height:18px}.stage{position:relative;min-height:232px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.86);border-radius:30px;background:linear-gradient(145deg,#dbe7e8,#c8d9dc);box-shadow:0 8px 0 rgba(57,78,91,.10);overflow:hidden}.stage:before{content:"";position:absolute;left:7%;right:7%;bottom:28px;height:6px;border-radius:99px;background:rgba(63,85,94,.18)}.shadow-wrap{width:min(82%,430px);position:relative;z-index:1;transition:transform .45s ease}.shadow-wrap svg{display:block;width:100%;height:auto;filter:brightness(.18) saturate(0);transition:filter .35s ease,transform .35s ease}.shadow-wrap.reveal svg{filter:none}.shadow-wrap.go{animation:driveAway .85s ease-in forwards}@keyframes driveAway{0%{transform:translateX(0) scale(1)}35%{transform:translateX(4%) scale(1.04)}100%{transform:translateX(125%) scale(.94)}}.question-no{position:absolute;top:12px;right:14px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.78);font-size:13px;font-weight:900;color:#536b78}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:176px}.choices.three{grid-template-columns:repeat(3,1fr)}.choice{appearance:none;border:2px solid rgba(255,255,255,.9);border-radius:24px;background:#fffaf2;box-shadow:0 6px 0 rgba(57,78,91,.13);min-width:0;min-height:160px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#17324a;font:inherit;touch-action:manipulation;transition:transform .08s ease,box-shadow .08s ease,background .2s ease}.choice:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(57,78,91,.13)}.choice svg{display:block;width:100%;max-height:112px}.choice .name{font-size:15px;font-weight:900;line-height:1.2}.choice.wrong{animation:shake .28s ease;background:#f9e9e4}.choice.correct{background:#e1f2e7}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions button{min-height:46px;border:0;border-radius:16px;padding:0 16px;font-size:14px;font-weight:900;background:#fff;color:#17324a;box-shadow:0 4px 0 rgba(57,78,91,.12)}.finish{display:none;text-align:center;padding:18px 8px 26px}.finish.show{display:block}.finish .big{font-size:33px;font-weight:900}.finish p{margin-top:8px;font-weight:800;color:#607487}.finish button{margin-top:16px;min-height:52px;border:0;border-radius:18px;padding:0 22px;background:#17324a;color:white;font-size:17px;font-weight:900}@media(max-width:430px){.app{gap:9px;padding-left:10px;padding-right:10px}.top{padding-left:88px}.top h1{font-size:19px}.stars{font-size:17px}.prompt{font-size:19px}.stage{min-height:210px;border-radius:24px}.choices{gap:8px;min-height:154px}.choice{min-height:144px;border-radius:20px;padding:6px 4px}.choice svg{max-height:94px}.choice .name{font-size:13px}.choices.three .choice .name{font-size:12px}}@media(max-width:350px){.top{padding-left:82px}.top h1{font-size:17px}.choices.three{gap:5px}.choice{min-height:132px}.choice svg{max-height:82px}}@media(prefers-reduced-motion:reduce){.shadow-wrap,.shadow-wrap svg,.choice{transition:none!important;animation:none!important}}
</style>
<script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head>
<body>
<div class="app" id="app"><div class="top"><h1>のりもの かげあて</h1><div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div></div><div class="prompt" id="prompt" aria-live="polite">おなじ かたちは どれかな？</div><div class="sub" id="sub">かげを よくみてね</div><section class="stage" id="stage" aria-label="のりものの かげ"><span class="question-no" id="qno">1 / 5</span><div class="shadow-wrap" id="shadow"></div></section><section class="choices" id="choices" aria-label="こたえ"></section><div class="actions"><button type="button" id="voice">🔊 もういちど</button></div><section class="finish" id="finish"><div class="big">⭐️ できた！ ⭐️</div><p>5もん ぜんぶ あそべたよ</p><button type="button" id="again">もういちど あそぶ</button></section></div>
<script src="../../shared/vehicles-legacy.js"></script>
<script>
'use strict';
(function(){
 const $=id=>document.getElementById(id);
 const IDS=['patocar','bus','keikyu','shobosha','kyukyusha','gomi'];
 const CARS=IDS.map(id=>(window.VEHICLES||[]).find(v=>v.id===id)).filter(Boolean).map(v=>({id:v.id,name:v.name,say:v.say||v.name,svg:v.svg}));
 let round=[],index=0,score=0,locked=false,current=null,currentSay='';
 function shuffle(a){return a.sort(()=>Math.random()-.5)}
 function speak(text,cb){currentSay=text;if(!window.__noriInteractionStarted)return;return NoriVoice.speak(text,cb);}
 function stars(){ $('stars').textContent=Array.from({length:5},(_,i)=>i<score?'★':'☆').join(' ') }
 function choicesFor(answer,count){const wrong=shuffle(CARS.filter(v=>v.id!==answer.id)).slice(0,count-1);return shuffle([answer,...wrong])}
 function start(){round=shuffle([...CARS]).slice(0,5);index=0;score=0;locked=false;$('finish').classList.remove('show');$('choices').style.display='grid';$('stage').style.display='grid';$('voice').parentElement.style.display='flex';stars();render()}
 function render(){locked=false;current=round[index];const count=index<2?2:3;const opts=choicesFor(current,count);$('qno').textContent=`${index+1} / 5`;$('prompt').textContent=index<2?'おなじ かたちは どれかな？':index===2?'どの のりものかな？':'かげを よくみて あてよう！';$('sub').textContent=index<2?'まずは ゆっくり みてね':index===2?'3つの なかから えらんでね':'にている かたちにも ちゅうもく';$('shadow').className='shadow-wrap';$('shadow').innerHTML=current.svg;const box=$('choices');box.className='choices'+(count===3?' three':'');box.innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-label',v.name);b.innerHTML=v.svg+`<span class="name">${v.name}</span>`;b.addEventListener('click',()=>pick(b,v));box.appendChild(b)});speak(index<2?'おなじ かたちは どれかな？':index===2?'どの のりものかな？':'かげを よくみて あてよう')}
 function pick(btn,v){if(locked)return;if(v.id!==current.id){btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');$('sub').textContent='もういちど みてみよう';speak(v.name+'だよ。もういちど、かげを よくみてね');return}locked=true;score++;stars();btn.classList.add('correct');$('shadow').classList.add('reveal');$('prompt').textContent='せいかい！';$('sub').textContent=current.name+'！';speak('せいかい。'+current.say+'！',()=>{index++;if(index>=5)finish();else render()});setTimeout(()=>{$('shadow').classList.add('go')},650)}
 function finish(){$('choices').style.display='none';$('stage').style.display='none';$('voice').parentElement.style.display='none';$('finish').classList.add('show');$('prompt').textContent='ぜんぶ できた！';$('sub').textContent='また ちがう かげが でるよ';speak('ぜんぶ できた！すごいね！')}
 $('voice').addEventListener('click',()=>speak(currentSay||'おなじ かたちは どれかな？'));
 $('again').addEventListener('click',start);
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)NoriVoice.stop()});
 document.addEventListener('norimono-started',()=>{setTimeout(()=>{$('voice').click()},250)},{once:true});
 start();
})();
</script>
<script src="../../back.js" data-home="../../index.html"></script>
</body></html>
