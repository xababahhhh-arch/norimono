<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>なんこ あるかな？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff6dc;color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 9px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:7px}.count{font-weight:900}.prompt{font-size:22px;font-weight:900;text-align:center}.dots{display:flex;gap:9px;min-height:48px;align-items:center;padding:6px 12px;border-radius:24px;animation:targetGlow 1.6s ease-in-out infinite}.dot{width:24px;height:24px;border-radius:50%;background:#ff9f43;box-shadow:inset 0 -3px #d87922;animation:dotPulse 1.6s ease-in-out infinite}.dot:nth-child(2){animation-delay:.12s}.dot:nth-child(3){animation-delay:.24s}.choices{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{position:relative;border:3px solid #fff;border-radius:24px;background:#fff;box-shadow:0 6px 0 #17324a1c;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:manipulation}.choice:active{transform:translateY(3px)}.choice.good{outline:7px solid #67cf78;background:#eaf9ed}.choice.bad{animation:shake .3s;background:#fff1ec}.fleet{width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px}.item{font-size:58px;line-height:1;filter:drop-shadow(0 3px 1px #0001)}.hand{position:absolute;right:8px;top:7px;font-size:36px;animation:tap .8s infinite}.star{position:fixed;font-size:29px;z-index:20;pointer-events:none;animation:fly .7s forwards}.done{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#fff9e9f2;z-index:15}.done.show{display:grid}.done b{font-size:30px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#65c77a;color:#fff;font:900 18px inherit}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes tap{50%{transform:translateY(7px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@keyframes targetGlow{0%,100%{background:#ffffff2e;box-shadow:0 0 0 0 #ffbc4800}50%{background:#ffffffd1;box-shadow:0 0 22px 7px #ffbc4847}}@keyframes dotPulse{0%,100%{transform:scale(.92);filter:brightness(.95)}50%{transform:scale(1.12);filter:brightness(1.12);box-shadow:inset 0 -3px #d87922,0 0 14px 7px #ff9f436b}}@media(prefers-reduced-motion:reduce){.dots,.dot{animation:none}.dots{background:#ffffffbf}}@media(max-width:390px){.prompt{font-size:20px}.item{font-size:50px}.choices{gap:7px}.choice{border-radius:19px;padding:5px}}@media(max-height:700px){.item{font-size:44px}.dots{min-height:38px;padding:4px 10px}.dot{width:20px;height:20px}}</style><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head><body><main class="app"><div class="count" id="count"></div><div class="prompt" id="prompt">おなじ かずは どっち？</div><div class="dots" id="dots"></div><div class="choices" id="choices"></div></main><div class="done" id="done"><div>🎉 ⭐ ⭐ ⭐<br><b>かぞえられたね！</b><br><button id="again">もういちど</button></div></div><script>(()=>{'use strict';const kinds=[{icon:'🚗',name:'くるま',spoken:'くるま',counts:['いちだい','にだい','さんだい']},{icon:'🚌',name:'バス',spoken:'ばす',counts:['いちだい','にだい','さんだい']},{icon:'🚲',name:'じてんしゃ',spoken:'じてんしゃ',counts:['いちだい','にだい','さんだい']},{icon:'🚂',name:'でんしゃ',spoken:'でんしゃ',counts:['いちりょう','にりょう','さんりょう']},{icon:'✈️',name:'ひこうき',spoken:'ひこうき',counts:['いっき','にき','さんき']},{icon:'🚢',name:'ふね',spoken:'ふね',counts:['いっせき','にせき','さんせき']},{icon:'🍎',name:'りんご',spoken:'りんご',counts:['いっこ','にこ','さんこ']},{icon:'⚽',name:'ボール',spoken:'ぼーる',counts:['いっこ','にこ','さんこ']},{icon:'⭐',name:'ほし',spoken:'ほし',counts:['いっこ','にこ','さんこ']},{icon:'🌷',name:'はな',spoken:'はな',counts:['いちりん','にりん','さんりん']}];const rounds=[1,2,2,3,3,Math.random()<.5?2:3];let q=0,busy=false,ctx=null,token=0,started=false,lastKind=-1;const $=id=>document.getElementById(id);function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,d=.13,v=.025,delay=0){const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}function good(){tone(600);tone(820,.17,.024,.11)}function soft(){tone(300,.14,.012);tone(360,.16,.011,.11)}function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,.026,i*.12))}function speak(text,cb){return NoriVoice.speak(text,cb);}function chooseKind(){let i;do{i=Math.floor(Math.random()*kinds.length)}while(i===lastKind&&kinds.length>1);lastKind=i;return kinds[i]}function fleet(n,k){return '<div class="fleet">'+Array.from({length:n},()=>`<span class="item" aria-hidden="true">${k.icon}</span>`).join('')+'</div>'}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*150-75)+'px');s.style.setProperty('--y',(-30-Math.random()*120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function options(target){let wrong=target===1?2:(target===2?(q<3?1:3):2);if(q>=4&&target===3)wrong=Math.random()<.5?1:2;let a=[target,wrong];return Math.random()<.5?a:a.reverse()}function dotsNum(n){return n===1?'ひとつ':n===2?'ふたつ':'みっつ'}function counted(k,n){return k.counts[n-1]}function render(){if(!started)return;busy=false;const target=rounds[q],kind=chooseKind();$('count').textContent=`${q+1} / ${rounds.length}`;$('prompt').textContent='ひかっている ● と おなじ かずは どっち？';$('dots').innerHTML=Array.from({length:target},()=>'<span class="dot"></span>').join('');const cs=$('choices');cs.innerHTML='';options(target).forEach(n=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=fleet(n,kind)+(q===0&&n===target?'<span class="hand">👆</span>':'');b.onclick=()=>pick(b,n,target,kind);cs.appendChild(b)});speak(q===0?`うえで ひかっている まるを みてね。まるは ${dotsNum(target)}。${kind.spoken}が ${counted(kind,target)} ある ほうを おしてね`:`ひかっている まるは ${dotsNum(target)}。${kind.spoken}が ${counted(kind,target)} あるのは どっちかな？`)}function pick(b,n,target,kind){if(busy)return;if(n===target){busy=true;b.classList.add('good');good();burst(b);speak(`せいかい。${kind.spoken}は、${counted(kind,target)} だね`,()=>{q++;if(q>=rounds.length){fanfare();$('done').classList.add('show');speak('ぜんぶ できた。じょうずに かぞえられたね！')}else render()})}else{b.classList.add('bad');soft();speak(`こっちは、${kind.spoken}が ${counted(kind,n)} だね。ひかっている まると おなじ かずを さがそう`,()=>b.classList.remove('bad'))}}document.addEventListener('norimono-started',()=>{started=true;audio();render()});$('again').onclick=()=>{q=0;lastKind=-1;$('done').classList.remove('show');render()};if(window.__noriInteractionStarted){started=true;render()}})();</script><script src="../../back.js" data-home="../../learning.html"></script></body></html>
