<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>なんだい いるかな？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff6dc;color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 62px) 9px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;align-items:center;gap:7px}.count{font-weight:900}.prompt{font-size:22px;font-weight:900;text-align:center}.dots{display:flex;gap:9px;min-height:48px;align-items:center;padding:6px 12px;border-radius:24px;animation:targetGlow 1.6s ease-in-out infinite}.dot{width:24px;height:24px;border-radius:50%;background:#ff9f43;box-shadow:inset 0 -3px #d87922,0 0 0 0 rgba(255,159,67,.42);animation:dotPulse 1.6s ease-in-out infinite}.dot:nth-child(2){animation-delay:.12s}.dot:nth-child(3){animation-delay:.24s}.choices{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{position:relative;border:3px solid #fff;border-radius:24px;background:#fff;box-shadow:0 6px 0 #17324a1c;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:manipulation}.choice:active{transform:translateY(3px)}.choice.good{outline:7px solid #67cf78;background:#eaf9ed}.choice.bad{animation:shake .3s;background:#fff1ec}.fleet{width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:8px}.car{width:82px;height:48px}.car svg{width:100%;height:100%;display:block}.hand{position:absolute;right:8px;top:7px;font-size:36px;animation:tap .8s infinite}.star{position:fixed;font-size:29px;z-index:20;pointer-events:none;animation:fly .7s forwards}.done{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#fff9e9f2;z-index:15}.done.show{display:grid}.done b{font-size:30px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#65c77a;color:#fff;font:900 18px inherit}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes tap{50%{transform:translateY(7px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@keyframes targetGlow{0%,100%{background:rgba(255,255,255,.18);box-shadow:0 0 0 0 rgba(255,188,72,0)}50%{background:rgba(255,255,255,.82);box-shadow:0 0 22px 7px rgba(255,188,72,.28)}}@keyframes dotPulse{0%,100%{transform:scale(.92);filter:brightness(.95);box-shadow:inset 0 -3px #d87922,0 0 0 0 rgba(255,159,67,.35)}50%{transform:scale(1.12);filter:brightness(1.12);box-shadow:inset 0 -3px #d87922,0 0 14px 7px rgba(255,159,67,.42)}}@media(prefers-reduced-motion:reduce){.dots,.dot{animation:none}.dots{background:rgba(255,255,255,.75);box-shadow:0 0 18px 5px rgba(255,188,72,.22)}}@media(max-width:390px){.prompt{font-size:20px}.car{width:70px;height:42px}.choices{gap:7px}.choice{border-radius:19px;padding:5px}}@media(max-height:700px){.car{width:62px;height:37px}.dots{min-height:38px;padding:4px 10px}.dot{width:20px;height:20px}}</style></head><body><main class="app"><div class="count" id="count"></div><div class="prompt" id="prompt">おなじ かずは どっち？</div><div class="dots" id="dots" aria-label="かぞえる まる"></div><div class="choices" id="choices"></div></main><div class="done" id="done"><div>🎉 ⭐ ⭐ ⭐<br><b>かぞえられたね！</b><br><button id="again">もういちど</button></div></div><script>
(()=>{'use strict';const rounds=[1,2,2,3,3,Math.random()<.5?2:3];let q=0,busy=false,ctx=null,token=0,started=false;const $=id=>document.getElementById(id);function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,d=.13,v=.025,delay=0){const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03)}function good(){tone(600);tone(820,.17,.024,.11)}function soft(){tone(300,.14,.012);tone(360,.16,.011,.11)}function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,.026,i*.12))}function voice(){const vs=speechSynthesis.getVoices().filter(v=>/^ja([-_]|$)/i.test(v.lang||''));const bad=/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bahh|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Wobble|Zarvox/i;return vs.filter(v=>!bad.test(v.name)).sort((a,b)=>(/premium|enhanced|Kyoko|Otoya|Google/i.test(b.name)?1:0)-(/premium|enhanced|Kyoko|Otoya|Google/i.test(a.name)?1:0))[0]||vs[0]}function speak(text,cb){const t=++token;if(!('speechSynthesis'in window)){setTimeout(cb||(()=>{}),500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.96;u.pitch=1;u.volume=.82;const v=voice();if(v)u.voice=v;let done=false;const end=()=>{if(done||t!==token)return;done=true;setTimeout(()=>{if(t===token&&cb)cb()},300)};u.onend=end;u.onerror=end;speechSynthesis.speak(u);setTimeout(()=>{if(!done&&!speechSynthesis.speaking)end()},7000)}function car(){return '<span class="car"><svg viewBox="0 0 120 70" aria-hidden="true"><path d="M17 42h6l10-21h48l18 21h7c7 0 10 5 10 11v4H7v-5c0-6 4-10 10-10z" fill="#3f91d8"/><path d="M40 25h37l13 17H31z" fill="#dff5ff"/><path d="M60 25v17" stroke="#3f91d8" stroke-width="4"/><circle cx="30" cy="57" r="10" fill="#263746"/><circle cx="91" cy="57" r="10" fill="#263746"/><circle cx="30" cy="57" r="4" fill="#cbd5dc"/><circle cx="91" cy="57" r="4" fill="#cbd5dc"/></svg></span>'}function fleet(n){return '<div class="fleet">'+Array.from({length:n},car).join('')+'</div>'}function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*150-75)+'px');s.style.setProperty('--y',(-30-Math.random()*120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function options(target){let wrong=target===1?2:(target===2?(q<3?1:3):2);if(q>=4&&target===3)wrong=Math.random()<.5?1:2;let a=[target,wrong];return Math.random()<.5?a:a.reverse()}function render(){if(!started)return;busy=false;const target=rounds[q];$('count').textContent=`${q+1} / ${rounds.length}`;$('prompt').textContent='ひかっている ● と おなじ かずは どっち？';$('dots').innerHTML=Array.from({length:target},()=>'<span class="dot"></span>').join('');const cs=$('choices');cs.innerHTML='';options(target).forEach(n=>{const b=document.createElement('button');b.className='choice';b.type='button';b.dataset.n=n;b.innerHTML=fleet(n)+(q===0&&n===target?'<span class="hand">👆</span>':'');b.onclick=()=>pick(b,n,target);cs.appendChild(b)});speak(target===1?'うえで ひかっている まるを みてね。まるが ひとつ。くるまも ひとつの ほうを おしてね':`ひかっている まるが ${target===2?'ふたつ':'みっつ'}。おなじ かずの くるまは どっちかな？`)}function pick(b,n,target){if(busy)return;if(n===target){busy=true;b.classList.add('good');good();burst(b);speak(`せいかい。くるまも ${target===1?'ひとつ':target===2?'ふたつ':'みっつ'} だね`,()=>{q++;if(q>=rounds.length){fanfare();$('done').classList.add('show');speak('ぜんぶ できた。じょうずに かぞえられたね！')}else render()})}else{b.classList.add('bad');soft();speak(`こっちは ${n===1?'ひとつ':n===2?'ふたつ':'みっつ'} だね。ひかっている まると おなじ かずを さがそう`,()=>b.classList.remove('bad'))}}document.addEventListener('norimono-started',()=>{started=true;audio();render()});$('again').onclick=()=>{q=0;$('done').classList.remove('show');render()};if(window.__noriInteractionStarted){started=true;render()}})();
</script><script src="../../back.js" data-home="../../index.html"></script></body></html>
