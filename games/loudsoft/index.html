<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>おおきい おと？ ちいさい おと？</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#fff7e9;color:#17324a;user-select:none;-webkit-user-select:none}.app{height:100%;padding:calc(env(safe-area-inset-top) + 58px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px}.progress{font-weight:900}.guide{font-size:22px;font-weight:900;text-align:center;min-height:30px}.speaker{border:0;background:#fff;border-radius:50%;width:104px;height:104px;font-size:52px;box-shadow:0 7px 0 #d9cbb8;touch-action:manipulation}.speaker:active{transform:translateY(4px)}.wave{height:38px;display:flex;gap:5px;align-items:center}.wave i{display:block;width:7px;border-radius:8px;background:#f1a24b;animation:pulse .65s infinite alternate}.wave i:nth-child(1),.wave i:nth-child(5){height:13px}.wave i:nth-child(2),.wave i:nth-child(4){height:24px}.wave i:nth-child(3){height:35px}.choices{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-items:center}.choice{position:relative;border:0;border-radius:24px;min-height:150px;background:#fff;box-shadow:0 7px 0 #d8d2c7;font:900 21px inherit;color:#17324a;touch-action:manipulation}.choice .icon{display:block;font-size:62px;line-height:1.1}.choice .label{display:block;margin-top:7px}.choice.hint{animation:glow .8s infinite alternate}.choice.good{background:#d9f5df;transform:scale(1.03)}.choice.bad{animation:shake .25s}.finger{position:absolute;right:6px;top:-22px;font-size:42px;animation:tap .7s infinite}.status{font-size:20px;font-weight:900;min-height:30px;text-align:center}.done{position:fixed;inset:0;display:none;place-items:center;background:#fff9edf2;text-align:center;z-index:30}.done.show{display:grid}.done b{font-size:30px}.done button{margin-top:18px;border:0;border-radius:18px;padding:14px 24px;background:#5bb97b;color:#fff;font:900 18px inherit}.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly .7s forwards;z-index:20}@keyframes pulse{to{transform:scaleY(.55);opacity:.55}}@keyframes glow{to{box-shadow:0 0 0 8px #ffd45c88,0 7px 0 #d8d2c7}}@keyframes tap{50%{transform:translateY(10px)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes fly{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-height:700px){.app{gap:5px}.speaker{width:82px;height:82px;font-size:42px}.choice{min-height:115px}.choice .icon{font-size:50px}.guide{font-size:19px}}</style><script src="../../shared/vehicles.js"></script><script src="../../shared/pronunciation.js"></script><script src="../../shared/voice.js"></script><script src="../../shared/icons.js"></script><link rel="stylesheet" href="../../shared/product.css"></head><body><main class="app"><div class="progress" id="progress">1 / 6</div><div class="guide" id="guide">おとを きいてね</div><button class="speaker" id="speaker" type="button" aria-label="おとを もういちど きく">🔊</button><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="choices"><button class="choice" id="loud" type="button"><span class="icon">🦁</span><span class="label">おおきい おと</span></button><button class="choice" id="soft" type="button"><span class="icon">🐭</span><span class="label">ちいさい おと</span></button></div><div class="status" id="status"></div></main><div class="done" id="done"><div>✨ 🎵 ✨<br><b>おとの おおきさ<br>わかったね！</b><br><button id="again" type="button">もういちど</button></div></div><script>(()=>{'use strict';const answers=['loud','soft','loud','soft','soft','loud'];let q=0,ctx=null,busy=false;const $=id=>document.getElementById(id);function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(kind){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+.02,amp=kind==='loud'?.11:.022;o.type='sine';o.frequency.setValueAtTime(330,t);o.frequency.linearRampToValueAtTime(392,t+.42);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(amp,t+.06);g.gain.setValueAtTime(amp,t+.55);g.gain.linearRampToValueAtTime(.0001,t+.72);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.75)}function ping(ok){const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=ok?760:300;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(c.destination);o.start();o.stop(t+.18)}function voice(text,cb){return NoriVoice.speak(text,cb);}function burst(){const r=$('speaker').getBoundingClientRect();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent='⭐';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*170-85)+'px');s.style.setProperty('--y',(-45-Math.random()*135)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}function clear(){['loud','soft'].forEach(x=>{$(x).classList.remove('hint','good','bad');const f=$(x).querySelector('.finger');if(f)f.remove()})}function render(){busy=false;clear();$('progress').textContent=`${q+1} / ${answers.length}`;$('guide').textContent='おとを きいてね';$('status').textContent='';if(q<2){const b=$(answers[q]);b.classList.add('hint');const f=document.createElement('span');f.className='finger';f.textContent='👆';b.appendChild(f)}}function play(){ac();tone(answers[q])}function choose(kind){if(busy)return;busy=true;clear();if(kind===answers[q]){$(kind).classList.add('good');ping(true);burst();$('status').textContent='⭐ せいかい！';voice(kind==='loud'?'せいかい。おおきい おと！':'せいかい。ちいさい おと！',()=>{q++;if(q>=answers.length){fanfare();$('done').classList.add('show');voice('ぜんぶ できた。おとの おおきさ、わかったね！')}else{render();setTimeout(play,350)}})}else{$(kind).classList.add('bad');ping(false);$('status').textContent=kind==='loud'?'これは おおきい おと':'これは ちいさい おと';voice(kind==='loud'?'これは、おおきい おとの ほうだね。もういちど きいてみよう':'これは、ちいさい おとの ほうだね。もういちど きいてみよう',()=>{busy=false;setTimeout(play,250)})}}function fanfare(){const c=ac();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.12;o.frequency.value=f;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.27)})}$('speaker').addEventListener('pointerdown',()=>{ac();play()});$('loud').addEventListener('pointerdown',()=>{ac();choose('loud')});$('soft').addEventListener('pointerdown',()=>{ac();choose('soft')});$('again').addEventListener('pointerdown',()=>{ac();q=0;$('done').classList.remove('show');render();setTimeout(play,250)});document.addEventListener('norimono-started',()=>{ac();render();if(window.__noriSkipIntro||window.__noriIntroSpoken)play();else voice('おおきい おとかな、ちいさい おとかな。おとを きいて えらんでね',play)});render();})();</script><script src="../../back.js" data-home="../../learning.html"></script></body></html>
