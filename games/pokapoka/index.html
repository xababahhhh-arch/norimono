<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffce57"><title>そうくんの ポカポカハンマー</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;font-family:system-ui,"Hiragino Maru Gothic ProN",sans-serif;background:#ffdc79}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;pointer-events:none}a,button{pointer-events:auto;border:0;border-radius:22px;padding:10px 14px;background:#fff;color:#663b22;font-size:17px;font-weight:900;text-decoration:none;box-shadow:0 4px 0 #c49d6b}#score{font-size:23px;background:#fff9e4;border-radius:22px;padding:8px 15px;color:#9c5910}#overlay{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#fff4d4bb}#panel{width:min(90vw,420px);text-align:center;background:white;border-radius:32px;padding:24px 18px;box-shadow:0 10px 0 #edb95d;color:#874b22}h1{font-size:clamp(24px,7vw,35px);margin:5px 0 12px}p{font-size:19px;line-height:1.6}#start{background:#ff9d38;color:#fff;font-size:27px;padding:15px 35px;box-shadow:0 6px 0 #ce6b20}#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#764117;font-size:19px;font-weight:900;text-shadow:0 2px #fff;pointer-events:none}</style></head><body>
<canvas id="game" aria-label="ながれてくる星をハンマーでたたくゲーム"></canvas>
<header><a href="../../index.html">⌂ もどる</a><div id="score" aria-live="polite">⭐ 0</div><button id="sound" aria-label="音を切り替える">🔊</button></header>
<div id="hint">どこでも タッチ！ ポカッ！</div>
<div id="overlay"><div id="panel"><div style="font-size:65px">🔨⭐</div><h1>そうくんの<br>ポカポカハンマー！</h1><p>ながれてくる ほしを<br>ポカッ！ と たたこう！</p><button id="start">あそぶ ▶</button></div></div>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score');
let W=0,H=0,dpr=1,playing=false,muted=false,score=0,elapsed=0,last=0,spawn=0,hammer=0,flash=0,targets=[],sparks=[],audio;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function sound(freq=440){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.55,audio.currentTime+.16);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.19)}catch(e){}}
document.querySelector('#sound').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
function begin(){playing=true;score=0;elapsed=0;spawn=0;targets=[];sparks=[];scoreEl.textContent='⭐ 0';overlay.style.display='none';last=performance.now()}
document.querySelector('#start').onclick=begin;
function hit(){if(!playing)return;hammer=1;flash=.3;let closest=null,dist=Infinity;for(let t of targets){let d=Math.abs(t.z-.85);if(d<dist){dist=d;closest=t}}if(closest&&dist<.38){closest.hit=true;score++;scoreEl.textContent='⭐ '+score;sound(650);for(let i=0;i<18;i++)sparks.push({x:W*.59,y:H*.68,vx:(Math.random()-.5)*240,vy:(Math.random()-.8)*250,life:.7,size:3+Math.random()*6})}else sound(260)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();hit()}});
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function star(x,y,r,color){ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.47:r;let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function draw(){const s=Math.min(W/390,H/700),floor=H*.54;ctx.fillStyle='#ffca4c';ctx.fillRect(0,0,W,H);round(0,H*.13,W,H*.32,0,'#ffe279');for(let j=0;j<3;j++){ctx.fillStyle=['#58e2c6','#fff4c0','#3ac3dc'][j];ctx.fillRect(0,H*(.42+j*.012),W,H*.007)}
ctx.fillStyle='#8fd9ef';ctx.fillRect(0,floor,W,H-floor);ctx.strokeStyle='#70b7cf';ctx.lineWidth=1;for(let i=0;i<12;i++){let y=floor+(H-floor)*i/11;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(W*.5,floor);ctx.lineTo(W*.5+i*W*.22,H);ctx.stroke()}
const topY=H*.46,botY=H*1.05,cx=W*.59;poly([[cx-W*.07,topY],[cx+W*.07,topY],[cx+W*.28,botY],[cx-W*.28,botY]],'#62687e');poly([[cx-W*.048,topY],[cx+W*.048,topY],[cx+W*.21,botY],[cx-W*.21,botY]],'#9efc65');poly([[cx-W*.03,topY],[cx+W*.03,topY],[cx+W*.16,botY],[cx-W*.16,botY]],'#4f6779');
for(let i=0;i<9;i++){let z=((i/9+elapsed*.26)%1),y=topY+(botY-topY)*z*z,ww=W*(.05+.14*z);poly([[cx-ww,y],[cx+ww,y],[cx+ww*1.08,y+3+z*9],[cx-ww*1.08,y+3+z*9]],'#b5ff79')}
round(cx-W*.075,H*.31,W*.15,H*.16,8,'#515a68');round(cx-W*.055,H*.34,W*.11,H*.13,4,'#202735');star(cx,H*.305,14*s,'#ffed45');
for(const t of targets){if(t.hit)continue;let z=Math.min(1.3,t.z),p=z*z,y=topY+(botY-topY)*p,x=cx,sz=(14+48*z)*s;ellipse(x,y+sz*.28,sz*.9,sz*.27,'#48617a');round(x-sz*.7,y-sz*.45,sz*1.4,sz*.8,sz*.17,'#ff797a');star(x,y-sz*.13,sz*.44,'#fff05c')}
const px=W*.23,py=H*.67,rr=Math.min(W*.12,H*.085);ellipse(px-rr*.65,py+rr*.8,rr*.65,rr*.35,'#ed597e');ellipse(px+rr*.65,py+rr*.8,rr*.65,rr*.35,'#ed597e');ellipse(px,py,rr,rr,'#ff9cbd');ellipse(px-rr*.26,py-rr*.13,rr*.09,rr*.22,'#243c56');ellipse(px+rr*.25,py-rr*.13,rr*.09,rr*.22,'#243c56');ellipse(px-rr*.52,py+rr*.12,rr*.2,rr*.12,'#ff638e');ellipse(px+rr*.52,py+rr*.12,rr*.2,rr*.12,'#ff638e');ellipse(px,py+rr*.26,rr*.15,rr*.11,'#b93663');
ctx.save();ctx.translate(px+rr*.65,py-rr*.12);ctx.rotate(-.75+hammer*1.3);round(-rr*.08,-rr*1.65,rr*.16,rr*1.8,rr*.08,'#9c663a');round(-rr*.55,-rr*1.95,rr*1.1,rr*.7,rr*.19,'#bb874d');for(let i=-1;i<=1;i++)round(i*rr*.23-rr*.035,-rr*1.9,rr*.07,rr*.6,2,'#d8a46a');ctx.restore();
for(let p of sparks){ctx.globalAlpha=Math.max(0,p.life/.7);star(p.x,p.y,p.size,'#fff56c')}ctx.globalAlpha=1;if(flash>0){star(W*.59,H*.68,(30+flash*90)*s,'#fff1a0');}
if(playing&&elapsed>=45){playing=false;overlay.style.display='flex';document.querySelector('#panel').innerHTML='<div style="font-size:65px">🎉⭐</div><h1>やったね！</h1><p>ほしを '+score+'こ あつめたよ！</p><button id="start">もういっかい ▶</button>';document.querySelector('#start').onclick=begin}
}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(playing){elapsed+=dt;spawn+=dt;if(spawn>1.65){spawn=0;targets.push({z:0,hit:false})}for(let t of targets)t.z+=dt*.33;targets=targets.filter(t=>t.z<1.38&&!t.hit);hammer=Math.max(0,hammer-dt*3.7);flash=Math.max(0,flash-dt);for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
